<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新海耗材登記</title>
<style>
:root{
  --bg:#e6ecf6;--panel:#fff;--ink:#1d2a30;--muted:#66767d;--line:#d3e0ec;--soft:#eef3f4;
  --accent:#0f7c80;--accent-ink:#fff;--accent-soft:#e1f1f1;
  --danger:#c0392b;--danger-soft:#fbe9e7;--ok:#1e8449;--ok-soft:#e5f4ea;--warn:#b9770e;--warn-soft:#fdf2e0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1823;--panel:#1a2226;--ink:#e3eaec;--muted:#93a3a9;--line:#2c383d;--soft:#212b30;
  --accent:#3fb6b9;--accent-ink:#0b1416;--accent-soft:#16383a;
  --danger:#ef7a6c;--danger-soft:#3a1f1c;--ok:#5cc98a;--ok-soft:#173023;--warn:#e7b25a;--warn-soft:#352a16;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-danger{color:var(--danger)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:3px 8px;font-size:13px}
/* 標題置中：左右兩欄等寬，右欄放設定與登入資訊 */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{grid-column:2;font-size:28px;margin:0;text-align:center;letter-spacing:.04em}
.head-r{grid-column:3;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
@media (max-width:760px){header{grid-template-columns:1fr}header h1{grid-column:1;font-size:22px}.head-r{grid-column:1;justify-content:center}}
.me{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:13px;color:var(--muted)}
.field.req label::after{content:" *";color:var(--danger)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap;font-size:13px}
td.num,th.num{text-align:right}
tr.editing td{background:var(--accent-soft)}
.nw{white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.chip.pending{background:var(--warn-soft);color:var(--warn)}
.chip.rejected{background:var(--danger-soft);color:var(--danger)}
.chip.confirmed{background:var(--ok-soft);color:var(--ok)}
.chip.perm{background:var(--soft);color:var(--muted)}
.reason{color:var(--danger);font-size:13px}
.empty{color:var(--muted);padding:12px 4px}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.gate-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:420px;width:100%;text-align:center}
.gate-box h2{margin:0 0 12px;font-size:24px}
.gate-box p{color:var(--muted);line-height:1.7}
.gate-box .who{color:var(--ink);font-weight:600}
.gate-box button{margin-top:8px;padding:10px 18px;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:var(--panel);border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}
.item-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.item-list span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;display:inline-flex;align-items:center;gap:2px}
.item-list button{border:0;background:none;padding:0 6px;color:var(--danger)}
/* 乳牙套尺寸：4 列 × 12 格的表格狀按鈕 */
.sg{display:grid;gap:4px;min-width:640px;padding:8px 6px 2px 0} /* 上、右留空間給支數標記 */
.sg-h{text-align:center;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid var(--line);padding-bottom:2px}
.sg-r{display:flex;flex-direction:column;justify-content:center;font-weight:700;padding-right:6px;font-size:13px;line-height:1.2}
.sg-r small{font-weight:400;color:var(--muted);font-size:11px}
.sg-sep{grid-column:1/-1;height:6px}
.sg-corner{font-weight:400;font-size:11px;align-self:end;padding-right:6px;border-bottom:0}
.sg-b .mx{font-size:14px;font-weight:600}
.sg-b{position:relative}
.sg-n{position:absolute;top:-6px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font:700 11px/18px system-ui,sans-serif;font-style:normal;text-align:center}
.sg-picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.sg-pick{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 8px;background:var(--panel);color:var(--ink)}
.sg-pick b{min-width:16px;text-align:center}
.sg-pick .btn-sm{padding:0 7px;line-height:20px}
.sg-b{padding:7px 0;display:flex;justify-content:center;align-items:center;background:var(--soft)}
.sg-b .pal{font-size:15px}
.sg-b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Palmer 角標：左上 ⌊、右上 ⌋、左下 ⌈、右下 ⌉ */
.pal{display:inline-block;padding:0 3px;line-height:1.15;font-weight:700;border:0 solid currentColor}
.pal.ul{border-left-width:2px;border-bottom-width:2px}.pal.ur{border-right-width:2px;border-bottom-width:2px}
.pal.ll{border-left-width:2px;border-top-width:2px}.pal.lr{border-right-width:2px;border-top-width:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;z-index:90;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (max-width:640px){header{padding:10px 12px}main{padding:12px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

window.OWNER_EMAILS = ['ccs93611@gmail.com']; // 要和 index.html、firestore.rules 一致

</head>
<body>
<header>
  <h1>新海美學牙醫・耗材登記</h1>
  <div class="head-r">
    <button id="cfgBtn" hidden>⚙ 耗材種類</button>
    <div class="me" id="me" hidden><span id="meEmail"></span> <span class="chip perm" id="mePerm"></span> <button class="btn-sm btn-ghost" id="signOutBtn">登出</button></div>
  </div>
</header>
<main>
  <form class="card" id="form" autocomplete="off" hidden>
    <h2><span id="fTitle">登記耗材</span><span class="sp"></span><button type="button" class="btn-sm" id="clearPt">清除病患資料</button></h2>
    <div id="fReason" class="reason" hidden></div>
    <div class="grid">
      <div class="field req"><label for="fDate">日期</label><input type="date" id="fDate" required></div>
      <div class="field req"><label for="fName">病患姓名</label><input id="fName" required></div>
      <div class="field"><label for="fBirth">病患生日</label><input type="date" id="fBirth"></div>
      <div class="field req"><label for="fChart">病歷號</label><input id="fChart" required></div>
      <div class="field"><label for="fTooth">牙位</label><input id="fTooth" placeholder="例如 36、11-21"></div>
      <div class="field req" style="grid-column:span 2"><label for="fItem">耗材種類</label><select id="fItem" required></select></div>
      <div class="field req" id="fSpecF" hidden><label for="fSpec" id="fSpecL">長度</label><select id="fSpec"></select></div>
      <div class="field req" id="fGridF" hidden style="grid-column:1/-1"><label id="fGridL">尺寸</label><div class="scroll-x"><div class="sg" id="fGrid"></div></div><div class="sub" id="fGridSel"></div></div>
      <div class="field req"><label for="fQty">數量</label><input type="number" id="fQty" min="1" step="1" value="1" required></div>
      <div class="field req"><label for="fDoc">醫師</label><select id="fDoc" required></select></div>
      <div class="field req"><label for="fAsst">助理</label><select id="fAsst" required></select></div>
    </div>
    <div class="acts">
      <button type="submit" class="btn-primary" id="fSubmit">送出，等醫師確認</button>
      <button type="button" id="fCancel" hidden>取消修改</button>
      <span class="hint" id="fHint">送出後保留病患、醫師與助理，可以接著登記同一位病患的其他耗材。</span>
    </div>
  </form>
  <section class="card">
    <h2>登記紀錄<span class="sp"></span><span class="sub" id="count"></span><button type="button" class="btn-sm" id="exportBtn">匯出 Excel</button></h2>
    <div class="filters">
      <!-- 篩選順序與表格欄位一致：日期（月份）→ 病患／病歷號／牙位（搜尋）→ 耗材種類 → 醫師 → 狀態 -->
      <div class="field"><label for="vMonth">月份</label><div style="display:flex;gap:4px"><button type="button" class="btn-sm" data-mv="-1" title="上個月" aria-label="上個月">‹</button><input type="month" id="vMonth" required><button type="button" class="btn-sm" data-mv="1" title="下個月" aria-label="下個月">›</button><button type="button" class="btn-sm" data-mv="0">本月</button></div></div>
      <div class="field" style="flex:1;min-width:180px"><label for="vQ">搜尋</label><input type="search" id="vQ" placeholder="病患姓名、病歷號、牙位"></div>
      <div class="field"><label for="vItem">耗材種類</label><select id="vItem"></select></div>
      <div class="field"><label for="vDoc">醫師</label><select id="vDoc"></select></div>
      <div class="field"><label for="vSt">狀態</label><select id="vSt">
        <option value="all">全部</option><option value="open">未完成（待確認＋退回）</option>
        <option value="pending">待醫師確認</option><option value="rejected">醫師退回</option>
        <option value="confirmed">已確認</option></select></div>
    </div>
    <div class="hint" id="otherMonths" hidden style="margin:0 0 10px"></div>
    <div class="scroll-x"><table id="list"></table></div>
  </section>
  <section class="card" id="statCard">
    <h2>耗材統計<span class="sp"></span><span class="sub" id="stInfo"></span></h2>
    <div class="filters">
      <div class="field"><label for="sFrom">從</label><input type="date" id="sFrom"></div>
      <div class="field"><label for="sTo">到</label><input type="date" id="sTo"></div>
      <div class="field"><label>&nbsp;</label><div style="display:flex;gap:4px;flex-wrap:wrap"><button type="button" class="btn-sm" data-rng="m0">本月</button><button type="button" class="btn-sm" data-rng="m1">上個月</button><button type="button" class="btn-sm" data-rng="y0">今年</button></div></div>
      <div class="field"><label for="sBy">分列方式</label><select id="sBy"><option value="item">依耗材種類</option><option value="itemDoc">依耗材種類＋醫師</option><option value="doc">依醫師</option></select></div>
      <div class="field"><label for="sDoc">醫師</label><select id="sDoc"></select></div>
      <div class="field"><label>&nbsp;</label><button type="button" class="btn-primary" id="sGo">開始統計</button></div>
    </div>
    <div class="scroll-x"><table id="stTable"></table></div>
    <div id="stDetail" hidden style="margin-top:16px">
      <h2 style="font-size:16px"><span id="stDetailTitle"></span><span class="sp"></span><select id="stDetailSt" class="btn-sm"><option value="">全部狀態</option><option value="confirmed">已確認</option><option value="pending">待醫師確認</option><option value="rejected">醫師退回</option></select><button type="button" class="btn-sm" id="stDetailClose">收起明細</button></h2>
      <div class="scroll-x"><table id="stDetailTable"></table></div>
    </div>
  </section>
</main>
<div id="gate" class="gate" hidden><div class="gate-box"><h2>新海美學牙醫・耗材登記</h2><p id="gateMsg">連線中…</p><div id="gateActs"></div></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtD=s=>s?`${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`:'';
const fmtAt=t=>t?new Date(t).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ====== 狀態 ====== */
const ST={pending:'待醫師確認',rejected:'醫師退回',confirmed:'已確認'};
let fs=null,me='',mySid='',PERM='super';
const canEdit=()=>['self','manage','super','device'].includes(PERM); // 可以登記、修改、刪除未確認的耗材
const canCfg=()=>PERM==='super';                                     // 只有超級管理員可以設定耗材種類
let staff=[];           // 排班系統的人員名單 {id,role,code,name,active}
let cfg={};             // csConfig/settings：耗材種類 items（還沒設定過時用 DEFAULT_ITEMS）
const DEFAULT_ITEMS=['玻璃纖維釘','兒童乳牙套(SSC)','MTA(管)','MTA(粉)','膠原蛋白(速吉安)','膠原蛋白(亞果)','FDBA骨粉(粗)','FDBA骨粉(細)',
  '可吸收再生膜(海昌/20*30mm/盒)','不可吸收再生膜(cytoplast)','鈦網(Titanlum Membrane)','植牙骨釘(Bone screw)','植牙骨釘(Tenting screw)','植牙骨釘(Bone tack)',
  '植體(Hiossen)','矯正骨釘','手捏臨時假牙','隱適美口掃'];
// 需要追加選擇規格的耗材（存在紀錄的 spec 欄位）
const ITEM_SPECS={
  '植牙骨釘(Bone screw)':{label:'長度',opts:['6 mm','8 mm','10 mm']},
  '植牙骨釘(Tenting screw)':{label:'長度',opts:['8.5 mm','10.0 mm','11.5 mm','13.0 mm']},
  '玻璃纖維釘':{label:'顏色',opts:['黃','紅','藍','綠'],colors:{黃:'#c99a00',紅:'#d32f2f',藍:'#1e63c7',綠:'#2e8b3d'}}, // 字體顯示對應顏色（要和 index.html 的 CS_SPEC_COLORS 一致）
  // 乳牙套：照診所套組盒的排列，4 列 × 12 格。上到下：上顎 D（第一乳臼齒）、上顎 E（第二乳臼齒）、下顎 D、下顎 E；
  // 每列左半是 LEFT（7 → 2 號），右半是 RIGHT（2 → 7 號）。存成例如「左上 D4」，畫面用 Palmer 角標（⌊D4、D4⌋、⌈D4、D4⌉）顯示
  '兒童乳牙套(SSC)':{label:'尺寸',grid:{halves:[['左','LEFT'],['右','RIGHT']],
    rows:[['上','D','第一乳臼齒'],['上','E','第二乳臼齒'],['下','D','第一乳臼齒'],['下','E','第二乳臼齒']],sizes:[2,3,4,5,6,7]}},
  // 矯正骨釘：直徑（列）× 長度（欄）的表格，存成例如「∅1.6 × 8 mm」
  '矯正骨釘':{label:'規格',matrix:{rowLabel:'直徑 (Diameter)',colLabel:'長度 (Length)',rows:['1.4','1.6','1.8'],cols:['6','8','10','12']}},
};
const matrixVal=(r,c)=>`∅${r} × ${c} mm`;
// 表格格子的順序（左半大到小、右半小到大），也是排序用的規格順序
const gridCells=(G,[ud,t])=>G.halves.flatMap(([side],i)=>(i?G.sizes:[...G.sizes].reverse()).map(z=>`${side}${ud} ${t}${z}`));
Object.values(ITEM_SPECS).forEach(s=>{
  if(s.grid)s.opts=s.grid.rows.flatMap(r=>gridCells(s.grid,r));
  if(s.matrix)s.opts=s.matrix.rows.flatMap(r=>s.matrix.cols.map(c=>matrixVal(r,c)));
});
const isGrid=s=>!!(s&&(s.grid||s.matrix)); // 用表格按鈕點選（可以複選）
// Palmer 角標：左上 ⌊、右上 ⌋、左下 ⌈、右下 ⌉（與套組盒標示相同）
const palmer=v=>{const m=/^([左右])([上下]) ([DE]\d)$/.exec(v||'');return m?`<span class="pal ${m[2]==='上'?'u':'l'}${m[1]==='左'?'l':'r'}" title="${esc(v)}">${esc(m[3])}</span>`:''};
let gridSel={}; // 表格按鈕選到的規格 → 支數（新增時可複選；修改既有紀錄時只能選一個規格）
const itemLabel=x=>x.item+(x.spec?` ${x.spec}`:'');
const specColor=x=>ITEM_SPECS[x.item]?.colors?.[x.spec]||'';
// 表格用：規格有對應顏色時用該顏色顯示
const itemHtml=x=>esc(x.item)+(x.spec?' '+(specColor(x)?`<b style="color:${specColor(x)}">${esc(x.spec)}</b>`:palmer(x.spec)?`${esc(x.spec.slice(0,2))} ${palmer(x.spec)}`:esc(x.spec)):'');
const specIdx=x=>x.spec?(ITEM_SPECS[x.item]?.opts.indexOf(x.spec)??99)+1:0; // 排序用：沒有規格排前面，其餘依選單順序
// 選了需要規格的耗材時顯示規格選單（必填）
function syncSpec(v,qty){
  const s=ITEM_SPECS[$('#fItem').value],sel=$('#fSpec'),grid=isGrid(s);
  $('#fGridF').hidden=!grid;gridSel=grid&&v?{[v]:Number(qty)||1}:{};
  // 表格點選時，數量在表格裡逐一設定，不用下方的「數量」欄
  $('#fQty').closest('.field').hidden=grid;$('#fQty').required=!grid;
  if(grid){$('#fGridL').textContent=s.label;drawGrid(s)}
  $('#fSpecF').hidden=!s||grid;sel.required=!!s&&!grid;
  if(grid){sel.innerHTML='';colorSpec();return}
  sel.innerHTML=s?'<option value="">請選擇</option>'+s.opts.map(o=>`<option value="${esc(o)}"${s.colors?.[o]?` style="color:${s.colors[o]};font-weight:700"`:''}>${esc(o)}</option>`).join(''):'';
  if(s){$('#fSpecL').textContent=s.label;sel.value=v||''}
  colorSpec();
}
// 表格狀按鈕：乳牙套尺寸（grid）或 直徑 × 長度（matrix）
function drawGrid(s){
  // 已選清單：每個規格可以用 − ＋ 調整支數（減到 0 就取消）
  const hint=lab=>{const sel=s.opts.filter(v=>gridSel[v]),tot=sel.reduce((t,v)=>t+gridSel[v],0);
    $('#fGridSel').innerHTML=sel.length?`<div class="sg-picks">已選${sel.length>1?` ${sel.length} 種、共 ${tot} 支`:''}：${sel.map(v=>`<span class="sg-pick" data-pk="${esc(v)}">${lab(v)}<button type="button" class="btn-sm" data-dec aria-label="減少">−</button><b>${gridSel[v]}</b><button type="button" class="btn-sm" data-inc aria-label="增加">＋</button></span>`).join('')}</div>${sel.length>1?`<div class="sub">送出後每個${s.label}各存一筆</div>`:''}`
      :`<span class="reason">請點選${s.label}</span><span class="sub">${editing?'':'（可以複選）'}再點一次同一格可以增加支數</span>`};
  const btn=(v,html,title)=>{const n=gridSel[v]||0;return `<button type="button" class="sg-b${n?' on':''}" data-sg="${esc(v)}" aria-pressed="${!!n}" title="${esc(title||v)}">${html}${n?`<i class="sg-n">${n}</i>`:''}</button>`};
  if(s.matrix){const M=s.matrix;
    let h=`<div class="sg-h sg-corner">${esc(M.rowLabel)} ＼ ${esc(M.colLabel)}</div>${M.cols.map(c=>`<div class="sg-h">${esc(c)} mm</div>`).join('')}`;
    M.rows.forEach(r=>{h+=`<div class="sg-r">∅ ${esc(r)} mm</div>`+M.cols.map(c=>btn(matrixVal(r,c),`<span class="mx">∅${esc(r)} × ${esc(c)}</span>`)).join('')});
    $('#fGrid').style.gridTemplateColumns=`auto repeat(${M.cols.length},minmax(70px,1fr))`;
    $('#fGrid').style.minWidth='0';$('#fGrid').innerHTML=h;
    hint(esc);return;
  }
  const G=s.grid,n=G.sizes.length;$('#fGrid').style.minWidth='';
  let h=`<div></div>${G.halves.map(([s,en],i)=>`<div class="sg-h" style="grid-column:${i?n+3:2}/span ${n}">${en}　${s}</div>`).join('')}`;
  G.rows.forEach((row,ri)=>{const [ud,t,name]=row;
    if(ri&&ud!==G.rows[ri-1][0])h+='<div class="sg-sep"></div>'; // 上顎、下顎之間留空
    h+=`<div class="sg-r">${ud==='上'?'UPPER':'LOWER'} ${t}<small>${ud}顎・${name}</small></div>`;
    gridCells(G,row).forEach((v,i)=>{if(i===n)h+='<div></div>';
      h+=btn(v,palmer(v),`${v}（${ud}顎${name}）`)});
  });
  $('#fGrid').style.gridTemplateColumns=`auto repeat(${n},minmax(40px,1fr)) 10px repeat(${n},minmax(40px,1fr))`;
  $('#fGrid').innerHTML=h;
  // 依表格順序列出已選的尺寸
  hint(v=>`${esc(v.slice(0,2))} ${palmer(v)}`);
}

const sortStaff=(a,b)=>String(a.code||a.name||'').localeCompare(String(b.code||b.name||''),'zh-Hant',{numeric:true});

/* ====== 資料存取：雲端（Firestore）或本機（localStorage，開發測試用，與 index.html?local=1 共用） ====== */
const LOCAL_KEY='xinhai_cs_local_v1',ROSTER_KEY='clinic_roster_local_v1';
const Local={
  load(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'null')||{items:[],cfg:{}}}catch(e){return {items:[],cfg:{}}}},
  save(d){localStorage.setItem(LOCAL_KEY,JSON.stringify(d))},
};
const DB={
  async put(x){
    if(fs)return fs.collection('csItems').doc(x.id).set(x);
    const d=Local.load();d.items=d.items.filter(y=>y.id!==x.id);d.items.push(x);Local.save(d);
  },
  async del(id){
    if(fs)return fs.collection('csItems').doc(id).delete();
    const d=Local.load();d.items=d.items.filter(y=>y.id!==id);Local.save(d);
  },
  async saveCfg(){
    if(fs)return fs.doc('csConfig/settings').set(cfg);
    const d=Local.load();d.cfg=cfg;Local.save(d);
  },
};
// 雲端讀取：未完成（待確認＋退回）的全部讀；已確認的只讀所選月份
let subOpen={},subMonth={},monthUnsub=null,monthKey='';
const mergeItems=()=>{items=new Map(Object.entries({...subMonth,...subOpen}));fillItems();render()};
function subscribeMonth(){
  if(!fs){render();return}
  if(monthKey===view.month)return;
  monthKey=view.month;if(monthUnsub)monthUnsub();subMonth={};
  monthUnsub=fs.collection('csItems').where('month','==',view.month).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});subMonth=m;mergeItems();
  },e=>{console.warn(e);toast('讀取紀錄失敗：'+(e.code==='permission-denied'?'沒有權限':e.message))});
}
function startCloud(){
  afterLogin();
  fs.collection('staff').onSnapshot(snap=>{staff=snap.docs.map(d=>({id:d.id,...d.data()}));fillSelects();render()},e=>console.warn(e));
  fs.doc('csConfig/settings').onSnapshot(s=>{cfg=s.exists?s.data():{};fillItems()},e=>console.warn(e));
  fs.collection('csItems').where('status','in',['pending','rejected']).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});subOpen=m;mergeItems();
  },e=>{console.warn(e);toast('讀取紀錄失敗：'+(e.code==='permission-denied'?'沒有權限（請確認安全規則已更新）':e.message))});
  subscribeMonth();
}
function bootLocal(){
  const m=location.search.match(/[?&]perm=(view|self|manage|super|device)/);PERM=m?m[1]:'super';me='本機測試';
  const as=location.search.match(/[?&]as=([\w-]+)/);mySid=as?as[1]:'';
  const loadAll=()=>{
    let r=null;try{r=JSON.parse(localStorage.getItem(ROSTER_KEY)||'null')}catch(e){}
    staff=r?.staff?.length?r.staff:[{id:'d1',role:'doctor',code:'Dr.A',name:'王醫師'},{id:'d2',role:'doctor',code:'Dr.B',name:'李醫師'},{id:'a1',role:'assistant',code:'A1',name:'陳助理'},{id:'a2',role:'assistant',code:'A2',name:'林助理'}];
    const d=Local.load();cfg=d.cfg||{};items=new Map(d.items.map(x=>[x.id,x]));

}

/* ====== 畫面 ====== */
function fillSelects(){
  const opt=(list,v,ph)=>`<option value="">${ph}</option>`+list.map(s=>`<option value="${esc(s.id)}">${esc(codeName(s))}</option>`).join('');
  const keep=(el,html)=>{const v=el.value;if(el.innerHTML!==html)el.innerHTML=html;el.value=v};
  // 編輯舊紀錄時，已離職的人員也要能顯示
  const docs=people('doctor'),assts=people('assistant');
  keep($('#fDoc'),opt(docs,'','請選擇醫師'));keep($('#fAsst'),opt(assts,'','請選擇助理'));
  const allDocs='<option value="">全部醫師</option>'+docs.map(s=>`<option value="${esc(s.id)}">${esc(codeName(s))}</option>`).join('');
  keep($('#vDoc'),allDocs);keep($('#sDoc'),allDocs);
  // 預設助理：登入帳號綁定的助理，否則用這台設備上次選的
  if(!$('#fAsst').value&&!editing){let a=byId(mySid)?.role==='assistant'?mySid:'';if(!a)try{a=localStorage.getItem('cs_last_asst')||''}catch(e){}
    if(assts.some(s=>s.id===a))$('#fAsst').value=a}
}
// 耗材種類選單：修改舊紀錄時，已從清單刪除的種類也要能顯示
function fillItems(extra){
  const o=n=>`<option value="${esc(n)}">${esc(n)}</option>`,list=itemList();
  const set=(el,html)=>{const v=el.value;el.innerHTML=html;el.value=v};
  const f=$('#fItem'),cur=extra||f.value;
  set(f,'<option value="">請選擇耗材種類</option>'+list.map(o).join('')+(cur&&!list.includes(cur)?o(cur):''));if(extra)f.value=extra;
  // 篩選選單：清單＋紀錄裡出現過、已不在清單的種類
  const old=[...new Set([...items.values()].map(x=>x.item))].filter(n=>n&&!list.includes(n));
  set($('#vItem'),'<option value="">全部耗材</option>'+list.map(o).join('')+old.map(o).join(''));
}
function afterLogin(){
  $('#gate').hidden=true;$('#me').hidden=false;
  $('#meEmail').textContent=PERM==='device'?me:myName();
  $('#mePerm').textContent={view:'僅檢視',self:'一般編輯',manage:'排班管理',super:'超級管理員',device:'認證設備'}[PERM]||PERM;
  $('#signOutBtn').textContent=PERM==='device'?'退出設備模式':'登出';
  $('#form').hidden=!canEdit();$('#cfgBtn').hidden=!canCfg();
  if(!$('#fDate').value)$('#fDate').value=today();
  $('#vMonth').value=view.month;
  render();
}
function filtered(){
  const q=view.q.trim().toLowerCase();
  return [...items.values()].filter(x=>{
    if(x.month!==view.month)return false;
    if(view.st==='open'?!['pending','rejected'].includes(x.status):(view.st!=='all'&&x.status!==view.st))return false;
    if(view.doc&&x.doctorId!==view.doc)return false;
    if(view.item&&x.item!==view.item)return false;
    if(q&&![x.pName,x.chartNo,itemLabel(x),x.tooth].some(v=>String(v||'').toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>({rejected:0,pending:1,confirmed:2}[a.status]-{rejected:0,pending:1,confirmed:2}[b.status])||b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
}
function statusHtml(x){
  const r=x.review;
  if(x.status==='confirmed')return `<span class="chip confirmed">已確認</span>${r?`<div class="sub">${esc(r.byName||'')} ${esc(fmtAt(r.at))}</div>`:''}`;
  if(x.status==='rejected')return `<span class="chip rejected">醫師退回</span>${r?`<div class="sub">${esc(r.byName||'')} ${esc(fmtAt(r.at))}</div>`:''}${x.reason?`<div class="reason">原因：${esc(x.reason)}</div>`:''}`;
  return `<span class="chip pending">待醫師確認</span>${x.hist?.some(h=>h.a==='reject')?'<div class="sub">（退回後已修改重送）</div>':''}`;
}
function render(){
  $('#vMonth').value=view.month;
  const list=filtered(),open=[...items.values()].filter(x=>x.status!=='confirmed');
  const rej=open.filter(x=>x.status==='rejected').length;
  $('#count').innerHTML=`共 ${list.length} 筆${rej?`，<span class="reason">退回待修改 ${rej} 筆（所有月份）</span>`:''}`;
  // 其他月份還有未完成（待確認／退回）的紀錄：一鍵跳過去
  const by={};open.forEach(x=>{if(x.month!==view.month){const b=by[x.month]||(by[x.month]={n:0,r:0});b.n++;if(x.status==='rejected')b.r++}});
  const yms=Object.keys(by).sort().reverse(),om=$('#otherMonths');om.hidden=!yms.length;
  om.innerHTML=yms.length?'其他月份還有未完成的紀錄：'+yms.map(ym=>`<button type="button" class="btn-sm" data-goto="${ym}">${Number(ym.slice(0,4))}年${Number(ym.slice(5))}月（${by[ym].n}${by[ym].r?`，退回 ${by[ym].r}`:''}）</button>`).join(' '):'';
  const canChange=x=>canEdit()&&(x.status!=='confirmed'||PERM==='super');
  $('#list').innerHTML='<thead><tr><th>日期</th><th>病患</th><th>病歷號</th><th>牙位</th><th>耗材種類</th><th class="num">數量</th><th>醫師</th><th>助理</th><th>狀態</th><th></th></tr></thead><tbody>'+
    (list.length?list.map(x=>`<tr data-id="${esc(x.id)}"${editing===x.id?' class="editing"':''}>
      <td class="nw">${esc(fmtD(x.date))}<div class="sub">${esc(x.date.slice(0,4))}</div></td>
      <td>${esc(x.pName)}${x.pBirth?`<div class="sub">生日 ${esc(x.pBirth)}</div>`:''}</td>
      <td class="nw">${esc(x.chartNo)}</td><td>${esc(x.tooth||'')}</td><td>${itemHtml(x)}</td><td class="num">${esc(x.qty)}</td>
      <td class="nw">${esc(byId(x.doctorId)?.name||x.doctorName||'')}</td><td class="nw">${esc(byId(x.assistantId)?.name||x.assistantName||'')}</td>
      <td>${statusHtml(x)}</td>
      <td class="nw">${canChange(x)&&x.status!=='confirmed'?`<button type="button" class="btn-sm${x.status==='rejected'?' btn-primary':''}" data-edit>${x.status==='rejected'?'修改重送':'修改'}</button> `:''}${canChange(x)?'<button type="button" class="btn-sm btn-danger" data-del>刪除</button>':''}</td>
    </tr>`).join(''):`<tr><td colspan="10" class="empty">這個月${view.st==='open'?'沒有待醫師確認或被退回的耗材':'沒有符合條件的紀錄'}</td></tr>`)+'</tbody>';
}

/* ====== 登記／修改 ====== */
const F=['fDate','fName','fBirth','fChart','fTooth','fItem','fQty','fDoc','fAsst'];
function setEditing(x){
  editing=x?x.id:null;
  $('#fTitle').textContent=x?`修改耗材登記（${x.pName}・${itemLabel(x)}）`:'登記耗材';
  $('#fSubmit').textContent=x?(x.status==='rejected'?'修改後重新送出':'儲存修改'):'送出，等醫師確認';
  $('#fCancel').hidden=!x;$('#fHint').hidden=!!x;
  $('#fReason').hidden=!(x&&x.status==='rejected'&&x.reason);$('#fReason').textContent=x&&x.reason?`醫師退回原因：${x.reason}`:'';
  if(x){const v={fDate:x.date,fName:x.pName,fBirth:x.pBirth||'',fChart:x.chartNo,fTooth:x.tooth||'',fItem:x.item,fQty:x.qty,fDoc:x.doctorId,fAsst:x.assistantId};
    // 已離職的醫師／助理：暫時加進選單
    [['fDoc',x.doctorId,x.doctorName],['fAsst',x.assistantId,x.assistantName]].forEach(([k,id,n])=>{if(id&&!$('#'+k).querySelector(`option[value="${CSS.escape(id)}"]`))$('#'+k).insertAdjacentHTML('beforeend',`<option value="${esc(id)}">${esc(byId(id)?codeName(byId(id)):n||id)}</option>`)});
    fillItems(x.item);F.forEach(k=>$('#'+k).value=v[k]);syncSpec(x.spec,x.qty);$('#form').scrollIntoView({behavior:'smooth',block:'start'});}
  render();
}
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();if(!canEdit())return;
  const g=k=>$('#'+k).value.trim();
  // 表格按鈕可以複選：新增時每個規格各存一筆紀錄，數量是表格裡設定的支數；其他耗材用「數量」欄
  const sp=ITEM_SPECS[g('fItem')],grid=isGrid(sp);
  const specs=sp?(grid?sp.opts.filter(v=>gridSel[v]):[g('fSpec')].filter(Boolean)):[''];
  if(sp&&!specs.length){alert(`請選擇${sp.label}`);return}
  if(!grid&&!(Number(g('fQty'))>0)){alert('數量要大於 0');return}
  const old=editing&&items.get(editing),now=Date.now(),who=myName();
  const xs=specs.map(spec=>{const qty=grid?gridSel[spec]:Number(g('fQty'));
    const x=old?JSON.parse(JSON.stringify(old)):{id:newId(),createdAt:now,createdBy:who,hist:[]};
    Object.assign(x,{date:g('fDate'),month:g('fDate').slice(0,7),pName:g('fName'),pBirth:g('fBirth'),chartNo:g('fChart'),tooth:g('fTooth'),item:g('fItem'),spec,qty,
      doctorId:g('fDoc'),doctorName:byId(g('fDoc'))?.name||'',assistantId:g('fAsst'),assistantName:byId(g('fAsst'))?.name||'',
      status:'pending',updatedAt:now,updatedBy:who});
    x.hist=(x.hist||[]).concat({a:!old?'create':old.status==='rejected'?'resubmit':'edit',at:now,by:who});
    if(old?.status==='rejected'){x.prevReason=old.reason;delete x.reason;delete x.review}
    return x;
  });
  const btn=$('#fSubmit');btn.disabled=true;
  try{
    for(const x of xs){await DB.put(x);if(!fs)items.set(x.id,x)}
    try{localStorage.setItem('cs_last_asst',xs[0].assistantId)}catch(err){}
    if(old){setEditing(null);clearForm(true);toast(old.status==='rejected'?'已重新送出，等醫師確認':'已儲存修改')}
    else{['fTooth','fItem'].forEach(k=>$('#'+k).value='');$('#fQty').value=1;syncSpec();$('#fItem').focus();toast(xs.length>1?`已登記 ${xs.length} 筆，等醫師確認`:'已登記，等醫師確認')}
    render();
  }catch(err){console.error(err);alert('儲存失敗：'+(err.code==='permission-denied'?'沒有權限（確認的紀錄不能修改，或安全規則尚未更新）':err.message))}
  finally{btn.disabled=false}
});
function clearForm(keepStaff){
  ['fName','fBirth','fChart','fTooth','fItem'].forEach(k=>$('#'+k).value='');$('#fQty').value=1;syncSpec();
  if(!keepStaff){$('#fDoc').value=''}
  $('#fDate').value=$('#fDate').value||today();
}
$('#clearPt').addEventListener('click',()=>{['fName','fBirth','fChart','fTooth','fItem'].forEach(k=>$('#'+k).value='');$('#fQty').value=1;syncSpec();$('#fName').focus()});
$('#fItem').addEventListener('change',()=>syncSpec());
$('#fSpec').addEventListener('change',colorSpec);
$('#fGrid').addEventListener('click',e=>{const b=e.target.closest('[data-sg]');if(!b)return;const v=b.dataset.sg;
  // 點格子：沒選過 → 1 支；已選 → 再加 1 支。修改既有紀錄時換成別格（保留支數）

$('#fCancel').addEventListener('click',()=>{setEditing(null);clearForm(true)});
$('#list').addEventListener('click',async e=>{

    try{await DB.del(x.id);if(!fs)items.delete(x.id);if(editing===x.id)setEditing(null);render()}

  }
});
// 匯出 Excel：目前畫面上的紀錄（所選月份＋篩選條件），先選排序方式

$('#exportBtn').addEventListener('click',()=>{
  if(!window.XLSX){alert('無法載入 Excel 元件，請確認網路連線後重新整理。');return}
  const n=filtered().length;if(!n){alert('目前沒有可以匯出的紀錄');return}

  if(!EX_SORT[last])last='date';
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-label="匯出 Excel"><h3>匯出 Excel（${n} 筆）</h3>
    <div style="display:grid;gap:8px;margin:12px 0">${Object.entries(EX_SORT).map(([k,l])=>`<label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="radio" name="exSort" value="${k}"${k===last?' checked':''}>${l}</label>`).join('')}</div>
    <p class="hint">同耗材種類或同醫師的紀錄再依日期排序。</p>
    <div class="acts" style="justify-content:flex-end"><button type="button" data-close>取消</button><button type="button" class="btn-primary" data-go>匯出</button></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{
    if(e.target===bg||e.target.closest('[data-close]')){bg.remove();return}
    if(e.target.closest('[data-go]')){const k=bg.querySelector('input[name=exSort]:checked').value;try{localStorage.setItem('cs_export_sort',k)}catch(err){}bg.remove();exportExcel(k)}
  });
});
function exportExcel(sortBy){
  const L=itemList(),io=n=>{const i=L.indexOf(n);return i<0?999:i};
  const docKey=x=>{const s=byId(x.doctorId);return s?String(s.code||s.name||''):'~'+(x.doctorName||'')};
  const byDate=(a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0);
  const list=filtered().sort(sortBy==='item'?(a,b)=>io(a.item)-io(b.item)||a.item.localeCompare(b.item,'zh-Hant')||specIdx(a)-specIdx(b)||byDate(a,b)
    :sortBy==='doc'?(a,b)=>docKey(a).localeCompare(docKey(b),'zh-Hant',{numeric:true})||byDate(a,b):byDate);
  const at=t=>t?new Date(t).toLocaleString('zh-TW',{hour12:false}):'';
  const rows=list.map(x=>({'日期':x.date,'病患姓名':x.pName,'病患生日':x.pBirth||'','病歷號':x.chartNo,'牙位':x.tooth||'','耗材種類':x.item,'規格':x.spec||'','數量':Number(x.qty)||0,
    '醫師':byId(x.doctorId)?.name||x.doctorName||'','助理':byId(x.assistantId)?.name||x.assistantName||'','狀態':ST[x.status]||x.status,
    '確認／退回':x.review?.byName||'','確認／退回時間':at(x.review?.at),'退回原因':x.status==='rejected'?(x.reason||''):'','登記者':x.createdBy||'','登記時間':at(x.createdAt)}));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[11,10,11,10,10,28,8,6,8,8,11,10,18,20,12,18].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'耗材登記');
  const tag=[view.item,view.doc&&byId(view.doc)?.name,view.st!=='all'&&$('#vSt').selectedOptions[0].text.replace(/（.*）/,'')].filter(Boolean).join('_');
  XLSX.writeFile(wb,`耗材登記_${view.month}${tag?'_'+tag:''}.xlsx`.replace(/[\\/:*?"<>|]/g,'-'));
}
$('#vSt').addEventListener('change',e=>{view.st=e.target.value;render()});
function setMonth(ym){view.month=ym;subscribeMonth();render()}
$('#vMonth').addEventListener('change',e=>{if(!e.target.value){e.target.value=view.month;return}setMonth(e.target.value)});
document.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',()=>{
  const k=Number(b.dataset.mv),[y,m]=view.month.split('-').map(Number),d=k?new Date(y,m-1+k,1):new Date();
  setMonth(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}));
$('#otherMonths').addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(b)setMonth(b.dataset.goto)});
$('#vDoc').addEventListener('change',e=>{view.doc=e.target.value;render()});
$('#vItem').addEventListener('change',e=>{view.item=e.target.value;render()});
$('#vQ').addEventListener('input',e=>{view.q=e.target.value;render()});

/* ====== 耗材種類設定（超級管理員） ====== */
$('#cfgBtn').addEventListener('click',()=>{
  const bg=document.createElement('div');bg.className='modal-bg';
  const draw=()=>{bg.innerHTML=`<div class="modal"><h3>耗材種類</h3>
    <p class="hint">登記時從這份清單選擇，順序就是選單的順序（按 ↑ 往前移）。刪除種類不影響已登記的紀錄。</p>
    <div class="item-list">${itemList().map((n,i)=>`<span>${esc(n)}${i?`<button type="button" data-up="${i}" title="往前移" style="color:var(--muted)">↑</button>`:''}<button type="button" data-rm="${i}" title="刪除">×</button></span>`).join('')||'<span class="hint">尚未設定</span>'}</div>
    <div style="display:flex;gap:8px"><input id="newItem" placeholder="新增耗材種類" style="flex:1"><button type="button" class="btn-primary" data-add>新增</button></div>
    <div class="acts" style="justify-content:flex-end"><button type="button" data-close>關閉</button></div></div>`;
    bg.querySelector('#newItem').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();bg.querySelector('[data-add]').click()}});};
  draw();document.body.appendChild(bg);bg.querySelector('#newItem').focus();
  bg.addEventListener('click',async e=>{
    if(e.target===bg||e.target.closest('[data-close]')){bg.remove();return}
    let ch=false;
    const L=[...itemList()];
    if(e.target.closest('[data-add]')){const n=bg.querySelector('#newItem').value.trim();if(!n)return;if(L.includes(n)){alert('已經有這個種類');return}cfg.items=[...L,n];ch=true}
    const rm=e.target.closest('[data-rm]');if(rm){const n=L[rm.dataset.rm];if(!confirm(`刪除耗材種類「${n}」？`))return;cfg.items=L.filter((_,i)=>i!==Number(rm.dataset.rm));ch=true}
    const up=e.target.closest('[data-up]');if(up){const i=Number(up.dataset.up);[L[i-1],L[i]]=[L[i],L[i-1]];cfg.items=L;ch=true}
    if(ch){try{await DB.saveCfg()}catch(err){alert('儲存失敗：'+(err.code==='permission-denied'?'沒有權限':err.message))}fillItems();draw();bg.querySelector('#newItem').focus()}
  });
});

/* ====== 耗材統計：選日期區間後按「開始統計」才讀雲端（依登記日期），可依耗材種類／醫師分列，點一列看明細與登錄狀態 ====== */
let stData=null,stKey=null,stRange='';
function setRange(k){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth(),f=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const [a,b]=k==='m1'?[new Date(y,m-1,1),new Date(y,m,0)]:k==='y0'?[new Date(y,0,1),t]:[new Date(y,m,1),t];
  $('#sFrom').value=f(a);$('#sTo').value=f(b);
}
async function runStats(){
  const from=$('#sFrom').value,to=$('#sTo').value;
  if(!from||!to||from>to){alert('請選擇正確的日期區間');return}
  const btn=$('#sGo');btn.disabled=true;btn.textContent='讀取中…';
  try{
    if(fs){const s=await fs.collection('csItems').where('date','>=',from).where('date','<=',to).get();stData=s.docs.map(d=>({id:d.id,...d.data()}))}
    else stData=Local.load().items.filter(x=>x.date>=from&&x.date<=to);
    stRange=`${from} ～ ${to}`;stKey=null;renderStats();
  }catch(e){console.error(e);alert('統計失敗：'+(e.code==='permission-denied'?'沒有權限':e.message))}
  finally{btn.disabled=false;btn.textContent='開始統計'}
}
const docName=x=>byId(x.doctorId)?.name||x.doctorName||'（未填）';
function renderStats(){
  if(!stData){$('#stTable').innerHTML='<tbody><tr><td class="empty">選擇日期區間後按「開始統計」。</td></tr></tbody>';$('#stInfo').textContent='';$('#stDetail').hidden=true;return}
  const by=$('#sBy').value,doc=$('#sDoc').value,data=stData.filter(x=>!doc||x.doctorId===doc);
  // 有規格的耗材（例如 Bone screw 各長度）分開統計
  const keyOf=x=>by==='doc'?docName(x):by==='itemDoc'?itemLabel(x)+'\u0001'+docName(x):itemLabel(x);
  // 依耗材清單順序排（清單外的放後面），同耗材依規格順序，醫師依姓名
  const L=itemList(),io=n=>{const i=L.indexOf(n);return i<0?999:i};
  const g=new Map();
  data.forEach(x=>{const k=keyOf(x);if(!g.has(k))g.set(k,{k,x,o:io(x.item)*100+specIdx(x),n:0,q:{pending:0,rejected:0,confirmed:0}});const r=g.get(k);r.n++;r.q[x.status]=(r.q[x.status]||0)+(Number(x.qty)||0)});
  const rows=[...g.values()].sort((a,b)=>{const [ai,ad]=a.k.split('\u0001'),[bi,bd]=b.k.split('\u0001');return by==='doc'?ai.localeCompare(bi,'zh-Hant'):(a.o-b.o)||ai.localeCompare(bi,'zh-Hant')||String(ad).localeCompare(String(bd),'zh-Hant')});
  const tot={n:0,pending:0,rejected:0,confirmed:0};rows.forEach(r=>{tot.n+=r.n;['pending','rejected','confirmed'].forEach(s=>tot[s]+=r.q[s])});
  $('#stInfo').textContent=`${stRange}　共 ${tot.n} 筆`;
  const head=by==='doc'?'<th>醫師</th>':by==='itemDoc'?'<th>耗材種類</th><th>醫師</th>':'<th>耗材種類</th>';
  const cells=r=>{const [a,b]=r.k.split('\u0001');return by==='itemDoc'?`<td>${itemHtml(r.x)}</td><td class="nw">${esc(b)}</td>`:by==='item'?`<td>${itemHtml(r.x)}</td>`:`<td>${esc(a)}</td>`};
  $('#stTable').innerHTML=`<thead><tr>${head}<th class="num">已確認數量</th><th class="num">待醫師確認</th><th class="num">醫師退回</th><th class="num">合計數量</th><th class="num">筆數</th><th></th></tr></thead><tbody>`+
    (rows.length?rows.map(r=>`<tr${stKey===r.k?' class="editing"':''}>${cells(r)}<td class="num"><b>${r.q.confirmed}</b></td><td class="num">${r.q.pending||''}</td><td class="num">${r.q.rejected?`<span class="reason">${r.q.rejected}</span>`:''}</td><td class="num">${r.q.confirmed+r.q.pending+r.q.rejected}</td><td class="num">${r.n}</td><td><button type="button" class="btn-sm" data-stk="${esc(r.k)}">明細</button></td></tr>`).join('')
      +`<tr><th${by==='itemDoc'?' colspan="2"':''}>合計</th><th class="num">${tot.confirmed}</th><th class="num">${tot.pending}</th><th class="num">${tot.rejected}</th><th class="num">${tot.confirmed+tot.pending+tot.rejected}</th><th class="num">${tot.n}</th><th></th></tr>`
      :`<tr><td colspan="8" class="empty">這段期間沒有耗材登記</td></tr>`)+'</tbody>';
  // 明細
  const det=stKey===null?null:data.filter(x=>keyOf(x)===stKey);
  $('#stDetail').hidden=!det;if(!det)return;
  const st=$('#stDetailSt').value,list=det.filter(x=>!st||x.status===st).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  $('#stDetailTitle').textContent=`明細：${stKey.replace('\u0001','・')}（${list.length} 筆）`;
  $('#stDetailTable').innerHTML='<thead><tr><th>日期</th><th>病患</th><th>病歷號</th><th>牙位</th><th>耗材種類</th><th class="num">數量</th><th>醫師</th><th>助理</th><th>狀態</th></tr></thead><tbody>'+
    (list.length?list.map(x=>`<tr><td class="nw">${esc(x.date)}</td><td>${esc(x.pName)}${x.pBirth?`<div class="sub">生日 ${esc(x.pBirth)}</div>`:''}</td><td class="nw">${esc(x.chartNo)}</td><td>${esc(x.tooth||'')}</td><td>${itemHtml(x)}</td><td class="num">${esc(x.qty)}</td><td class="nw">${esc(docName(x))}</td><td class="nw">${esc(byId(x.assistantId)?.name||x.assistantName||'')}</td><td>${statusHtml(x)}</td></tr>`).join('')
      :'<tr><td colspan="9" class="empty">沒有符合的紀錄</td></tr>')+'</tbody>';
}
document.querySelectorAll('[data-rng]').forEach(b=>b.addEventListener('click',()=>setRange(b.dataset.rng)));
$('#sGo').addEventListener('click',runStats);
$('#sBy').addEventListener('change',()=>{stKey=null;renderStats()});
$('#sDoc').addEventListener('change',()=>{stKey=null;renderStats()});
$('#stDetailSt').addEventListener('change',renderStats);
$('#stDetailClose').addEventListener('click',()=>{stKey=null;renderStats()});
$('#stTable').addEventListener('click',e=>{const b=e.target.closest('[data-stk]');if(!b)return;stKey=stKey===b.dataset.stk?null:b.dataset.stk;$('#stDetailSt').value='';renderStats();if(stKey)$('#stDetail').scrollIntoView({behavior:'smooth',block:'nearest'})});
setRange('m0');renderStats();

/* ====== 登入：Google 帳號（權限沿用排班系統）或認證設備（與治療計劃單共用 tpDevices） ====== */
function showGate(kind,email){
  const g=$('#gate'),msg=$('#gateMsg'),acts=$('#gateActs');g.hidden=false;
  if(kind==='loading'){msg.textContent='連線中…';acts.innerHTML='';return}
  if(kind==='signin'){
    msg.textContent=/FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent)?'App 內建的瀏覽器無法使用 Google 登入，請點右上角「⋯」選擇用 Safari 或 Chrome 開啟。':'請用 Google 帳號登入（與排班系統相同的帳號）。';
    acts.innerHTML='<button class="btn-primary" id="gSignIn">使用 Google 登入</button><div style="margin-top:14px"><button class="btn-sm btn-ghost" id="gDevice">這台設備申請認證（免登入）</button></div>';$('#gSignIn').onclick=signIn;$('#gDevice').onclick=deviceApply;return;
  }
  if(kind==='error'){msg.textContent=email;acts.innerHTML='<button id="gReload">重新整理</button>';$('#gReload').onclick=()=>location.reload();return}
  msg.innerHTML=kind==='suspended'?`你的帳號 <span class="who">${esc(email)}</span> 已被停權，無法使用本系統。`
    :`你的帳號 <span class="who">${esc(email)}</span> 還沒開通。<br>請把這個 Gmail 交給診所管理者，在排班系統「人員名單」綁定登入帳號。`;
  acts.innerHTML='<button id="gOther">改用其他帳號登入</button>';$('#gOther').onclick=signOut;
}
async function signIn(){
  const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
  try{await firebase.auth().signInWithPopup(pr)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-environment')return firebase.auth().signInWithRedirect(pr);
    if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('登入失敗：'+e.message);
  }
}
async function signOut(){if(PERM==='device'&&!confirm('退出設備模式？\n退出後這台設備需要重新申請認證、由超級管理員核准。'))return;if(window.firebase&&firebase.apps.length)await firebase.auth().signOut();location.reload()}
$('#signOutBtn').addEventListener('click',signOut);
const devCode=uid=>uid.slice(-6).toUpperCase();
async function deviceApply(){
  try{await firebase.auth().signInAnonymously()}
  catch(e){showGate('error',e.code==='auth/operation-not-allowed'?'Firebase 尚未啟用「匿名」登入方式，請管理者到 Firebase 主控台 → Authentication → 登入方式 啟用「匿名」。':'無法連線：'+(e.code||e.message))}
}
async function handleDevice(u){
  const ref=fs.doc('tpDevices/'+u.uid);let d=null;
  try{const s=await ref.get();d=s.exists?s.data():null}catch(e){console.error(e)}
  const g=$('#gate'),msg=$('#gateMsg'),acts=$('#gateActs');g.hidden=false;
  if(!d){
    msg.innerHTML=`申請把這台設備設為「認證設備」（與治療計劃單共用）。<br>核准後開啟本頁不需要 Google 登入，可以登記耗材。<br>設備代碼：<span class="who">${devCode(u.uid)}</span>`;
    acts.innerHTML=`<input id="devName" placeholder="設備名稱，例如：診間平板" style="width:100%;margin:6px 0"><br><button class="btn-primary" id="devSend">送出申請</button> <button id="devCancel">改用 Google 登入</button>`;
    $('#devCancel').onclick=signOut;
    $('#devSend').onclick=async()=>{
      const name=$('#devName').value.trim();if(!name){alert('請輸入設備名稱');return}
      $('#devSend').disabled=true;
      try{await ref.set({name,code:devCode(u.uid),approved:false,reqAt:Date.now(),ua:navigator.userAgent.slice(0,200)});handleDevice(u)}
      catch(e){alert('申請失敗：'+(e.code||e.message));$('#devSend').disabled=false}
    };
    return;
  }
  if(!d.approved){
    msg.innerHTML=`已送出設備認證申請（<span class="who">${esc(d.name)}</span>）。<br>請超級管理員到「治療計劃單 → ⚙ → 設備認證」核准，設備代碼：<span class="who">${devCode(u.uid)}</span><br>核准後本頁會自動開啟。`;
    acts.innerHTML='<button id="devCancel">改用 Google 登入</button>';$('#devCancel').onclick=signOut;
    ref.onSnapshot(s=>{if(s.exists&&s.data().approved)location.reload()},()=>{});
    return;
  }
  PERM='device';me='設備：'+d.name;
  ref.onSnapshot(s=>{if(!s.exists||!s.data().approved)location.reload()},()=>location.reload());
  startCloud();
}
function bootCloud(){
  if(!window.firebase){showGate('error','無法載入登入元件，請確認網路連線後重新整理。');return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  fs=firebase.firestore();fs.settings({ignoreUndefinedProperties:true,merge:true});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  showGate('loading');
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){showGate('signin');return}
    if(u.isAnonymous){handleDevice(u);return}
    me=(u.email||'').toLowerCase();
    const owner=(window.OWNER_EMAILS||[]).some(x=>x.toLowerCase()===me);
    let acc=null;try{const s=await fs.doc('access/'+me).get();acc=s.exists?s.data():null}catch(e){console.error(e)}
    if(!owner&&!acc){showGate('pending',me);fs.doc('access/'+me).onSnapshot(s=>{if(s.exists)location.reload()},()=>{});return}
    if(!owner&&acc.perm==='suspended'){showGate('suspended',me);return}
    PERM=owner?'super':(acc.perm||'view');mySid=acc?.staffId||'';
    if(!canEdit()&&!canCfg()){showGate('error',`你的權限（僅檢視）無法登記耗材。醫師請到排班系統的「耗材確認」分頁確認耗材。`);return}
    startCloud();
  });
}
if(window.FIREBASE_CONFIG)bootCloud();else bootLocal();
