<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新海設備認證</title>
<style>
:root{
  --bg:#d2deef;--panel:#fff;--ink:#1d2a30;--muted:#66767d;--line:#d3e0ec;--soft:#eef3f4;--card-line:#8fb0c4;
  --accent:#0f7c80;--accent-ink:#fff;--accent-soft:#e1f1f1;
  --danger:#c0392b;--danger-soft:#fbe9e7;--ok:#1e8449;--ok-soft:#e5f4ea;--warn:#b9770e;--warn-soft:#fdf2e0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1823;--panel:#1a2226;--ink:#e3eaec;--muted:#93a3a9;--line:#2c383d;--soft:#212b30;--card-line:#4a6572;
  --accent:#3fb6b9;--accent-ink:#0b1416;--accent-soft:#16383a;
  --danger:#ef7a6c;--danger-soft:#3a1f1c;--ok:#5cc98a;--ok-soft:#173023;--warn:#e7b25a;--warn-soft:#352a16;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
/* 背景與治療計劃單、耗材登記相同：淡藍底＋置中的診所 Logo 浮水印 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(tp-watermark.png?v=3) center/min(85vmin,720px) auto no-repeat;opacity:.14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.06}}
button,input{font:inherit;color:inherit}
input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-danger{color:var(--danger)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:3px 8px;font-size:13px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{grid-column:2;font-size:28px;margin:0;text-align:center;letter-spacing:.04em}
.head-r{grid-column:3;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
@media (max-width:760px){header{grid-template-columns:1fr}header h1{grid-column:1;font-size:22px}.head-r{grid-column:1;justify-content:center}}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px}
main>*{min-width:0} /* 表格太寬時只在卡片內左右捲動，整頁不會跟著變寬 */
.card{background:var(--panel);border:2px solid var(--card-line);border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(15,60,80,.12)}
.card>h2{font-size:18px;margin:0 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>h2 .sp{flex:1}
.hint{font-size:13px;color:var(--muted);margin:8px 0}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.row-acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}.row-acts button{white-space:nowrap}
#devTable td:first-child{min-width:5.5em}
th{background:var(--soft);font-weight:700;white-space:nowrap;font-size:15px}
td.c,th.c{text-align:center}
tr.old td{opacity:.55}
.nw{white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.off{background:var(--soft);color:var(--muted)}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.sw input{width:20px;height:20px;accent-color:var(--accent)}
.empty{color:var(--muted);padding:12px 4px}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.gate-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:440px;width:100%;text-align:center}
.gate-box h2{margin:0 0 12px;font-size:24px}
.gate-box p{color:var(--muted);line-height:1.7}
.gate-box .who{color:var(--ink);font-weight:600}
.gate-box button{margin-top:8px;padding:10px 18px;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:var(--panel);border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}
.modal label.opt{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.modal label.opt input{margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;z-index:90;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
<header>
  <h1>新海美學牙醫・設備認證</h1>
  <div class="head-r" id="me" hidden><span id="meEmail"></span><button class="btn-sm btn-ghost" id="signOutBtn">登出</button></div>
</header>
<main>
  <section class="card">
    <h2>認證設備<span class="sp"></span><span class="sub" id="devCount"></span></h2>
    <p class="hint">打卡：在平板開啟「新海打卡」App（或打卡網頁）。治療計劃單／耗材登記：在平板開啟該頁面，按「這台設備申請認證」。申請後會出現在這裡，畫面上的代碼要和平板顯示的一樣。<br>
      勾選就是核准並開通該系統，取消勾選就是停用；同一台設備可以分別開通。認證設備在治療計劃單算「編輯」、在耗材算「登記」。打卡也可以在排班系統「出勤 → 打卡裝置」核准。<br>App 下載：<a href="app.html" target="_blank" rel="noopener">新海打卡</a>、<a href="app-cs.html" target="_blank" rel="noopener">新海耗材</a>（App 會帶裝置編號，建議「綁定裝置編號」核准，重裝 App 也不用重新認證）。</p>
    <div class="scroll-x"><table id="devTable"></table></div>
  </section>
</main>
<div id="gate" class="gate" hidden><div class="gate-box"><h2>新海美學牙醫・設備認證</h2><p id="gateMsg">連線中…</p><div id="gateActs"></div></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtAt=t=>t?new Date(t).toLocaleString('zh-TW',{hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const permErr=e=>e&&e.code==='permission-denied'?'沒有權限（請確認安全規則已更新）':(e&&e.message||String(e));
let fs=null,me='';
let tpDevs={},kDevs={},hwDevs={},tpHws={}; // tpDevices（治療計劃單／耗材）、devices（打卡代碼）、hw（打卡裝置編號）、tpHw（耗材 App 裝置編號）
const TPHW_KEY='xinhai_tphw_local_v1';

/* ====== 資料存取：雲端或本機（本機測試：打卡裝置與 index.html?local=1 共用） ====== */
const KIOSK_KEY='clinic_kiosk_local_v1',TPDEV_KEY='xinhai_tpdev_local_v1';
const ld=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')||{}}catch(e){return {}}};
const sv=(k,d)=>{try{localStorage.setItem(k,JSON.stringify(d))}catch(e){}};
const DB={
  async tp(uid,obj){ // obj=null 刪除
    if(fs)return obj?fs.doc('tpDevices/'+uid).set(obj):fs.doc('tpDevices/'+uid).delete();
    const d=ld(TPDEV_KEY);if(obj)d[uid]=obj;else delete d[uid];sv(TPDEV_KEY,d);loadLocal();
  },
  async tpHw(id,obj){
    if(fs)return obj?fs.doc('tpHw/'+id).set(obj):fs.doc('tpHw/'+id).delete();
    const d=ld(TPHW_KEY);if(obj)d[id]=obj;else delete d[id];sv(TPHW_KEY,d);loadLocal();
  },
  async dev(id,obj){
    if(fs)return obj?fs.doc('devices/'+id).set(obj):fs.doc('devices/'+id).delete();
    const d=ld(KIOSK_KEY);d.devices=d.devices||{};if(obj)d.devices[id]=obj;else delete d.devices[id];sv(KIOSK_KEY,d);loadLocal();
  },
  async hw(id,obj){
    if(fs)return obj?fs.doc('hw/'+id).set(obj):fs.doc('hw/'+id).delete();
    const d=ld(KIOSK_KEY);d.hw=d.hw||{};if(obj)d.hw[id]=obj;else delete d.hw[id];sv(KIOSK_KEY,d);loadLocal();
  },
};
const run=async(p,ok)=>{try{await p;if(ok)toast(ok)}catch(e){console.error(e);alert('操作失敗：'+permErr(e))}};

/* ====== 認證設備：打卡（devices＋hw）與治療計劃單／耗材（tpDevices）合在同一張表 ======
   tpDevices：approved 已認證；tp／cs 分別開通治療計劃單、耗材（舊設備沒有這兩個欄位，視為都開通）；from 從哪個頁面申請
   打卡：雙軌核准，以裝置代碼（devices.approved）或以裝置編號（hw.approved，App 才有；代碼變了也沿用）；同一台平板的舊代碼淡化
   兩邊都是匿名登入的 uid，同一個 uid 出現在兩邊時合成一列 */
const devCode=uid=>uid.slice(-6).toUpperCase();
const devShort=id=>id.slice(0,6).toUpperCase();
const hwShort=h=>(h.slice(0,3)+'-'+h.slice(4,10)).toUpperCase();
const onTp=d=>!!d&&d.approved&&d.tp!==false,onCs=d=>!!d&&d.approved&&d.cs!==false;
function devVia(id){const d=kDevs[id];if(!d)return null;if(d.hwId&&hwDevs[d.hwId]?.approved)return 'hw';return d.approved?'code':null}
const SYS={k:'打卡',tp:'治療計劃單',cs:'耗材登記'};
function rows(){
  const newest={},newestT={};Object.entries(kDevs).sort((a,b)=>(b[1].at||0)-(a[1].at||0)).forEach(([id,d])=>{if(d.hwId&&!(d.hwId in newest))newest[d.hwId]=id});
  Object.entries(tpDevs).sort((a,b)=>(b[1].reqAt||0)-(a[1].reqAt||0)).forEach(([id,d])=>{if(d.hwId&&!(d.hwId in newestT))newestT[d.hwId]=id});
  return [...new Set([...Object.keys(tpDevs),...Object.keys(kDevs)])].map(uid=>{
    const t=tpDevs[uid]||null,k=kDevs[uid]||null,h=k?.hwId?hwDevs[k.hwId]:null,th=t?.hwId?tpHws[t.hwId]||null:null;
    // 治療計劃單／耗材：以裝置編號（tpHw）核准時看 tpHw 的 tp／cs，否則看 tpDevices
    const tpVia=th?.approved?'hw':t?.approved?'code':null,src=tpVia==='hw'?th:t;
    const on={k:k?!!devVia(uid):null,tp:t?(tpVia?src.tp!==false:false):null,cs:t?(tpVia?src.cs!==false:false):null};
    // 等待核准：從來沒核准過的（停用過的不算）
    const wait=(t&&!tpVia&&!t.approvedAt&&!th?.approvedAt)||(k&&!on.k&&!k.approvedAt&&!h?.approvedAt);
    const old=!!(k?.hwId&&newest[k.hwId]!==uid)||!!(t?.hwId&&newestT[t.hwId]!==uid);
    return {uid,t,k,h,th,tpVia,on,wait,old,at:Math.max(t?.reqAt||0,k?.at||0),name:t?.name||th?.name||k?.name||h?.name||''};
  }).sort((a,b)=>(b.wait-a.wait)||(a.old-b.old)||(b.at-a.at));
}
function renderDev(){
  const list=rows(),wait=list.filter(r=>r.wait).length;
  $('#devCount').textContent=`共 ${list.length} 台${wait?`，等待核准 ${wait} 台`:''}`;
  const from={tp:'治療計劃單',cs:'耗材登記'};
  const box=(r,k)=>r.on[k]===null?'<span class="sub">—</span>':`<label class="sw" title="${r.on[k]?'取消勾選＝停用':'勾選＝核准'}${SYS[k]}"><input type="checkbox" data-sw="${k}" ${r.on[k]?'checked':''}></label>`;
  $('#devTable').innerHTML='<thead><tr><th>設備</th><th>代碼</th><th>申請時間</th><th>狀態</th><th class="c">打卡</th><th class="c">治療<br>計劃單</th><th class="c">耗材</th><th></th></tr></thead><tbody>'+
    (list.length?list.map(r=>{
      const any=r.on.k||r.on.tp||r.on.cs;
      const st=r.wait&&!any?'<span class="chip wait">等待核准</span>':any?`<span class="chip ok">已認證</span>${r.wait?'<div><span class="chip wait">另有系統待核准</span></div>':''}`:'<span class="chip off">已停用</span>';
      const by=r.t?.approvedBy||r.k?.approvedBy||r.h?.approvedBy,byAt=r.t?.approvedAt||r.k?.approvedAt||r.h?.approvedAt;
      const via=r.k?devVia(r.uid):null;
      return `<tr data-uid="${esc(r.uid)}"${r.old?' class="old"':''}>
        <td><b>${esc(r.name||'（未命名）')}</b>${r.k?.model?`<div class="sub">${esc(r.k.model)}</div>`:r.t?.ua?`<div class="sub" title="${esc(r.t.ua)}">${esc(r.t.ua.slice(0,28))}…</div>`:''}${r.old?'<div class="sub">同一台平板的舊代碼</div>':''}</td>
        <td class="nw"><b>${esc(r.t?.code||(r.k?devShort(r.uid):devCode(r.uid)))}</b>${(r.k?.hwId||r.t?.hwId)?`<div class="sub">裝置編號 ${esc(hwShort(r.k?.hwId||r.t.hwId))}</div>`:''}</td>
        <td>${esc(fmtAt(r.at))}${r.t?.from?`<div class="sub">從${esc(from[r.t.from]||r.t.from)}申請</div>`:r.k&&!r.t?'<div class="sub">打卡裝置</div>':''}</td>
        <td>${st}${via==='hw'?'<div class="sub">打卡：綁定裝置編號</div>':via==='code'?'<div class="sub">打卡：核准代碼</div>':''}${r.tpVia==='hw'?'<div class="sub">計劃單／耗材：綁定裝置編號</div>':''}${any&&by?`<div class="sub">${esc(by)} ${esc(fmtAt(byAt))}</div>`:''}</td>
        <td class="c">${box(r,'k')}</td><td class="c">${box(r,'tp')}</td><td class="c">${box(r,'cs')}</td>
        <td><div class="row-acts"><button class="btn-sm" data-x="name">改名稱</button><button class="btn-sm btn-danger" data-x="del">刪除</button></div></td></tr>`;
    }).join(''):'<tr><td colspan="8" class="empty">目前沒有設備。</td></tr>')+'</tbody>';
}
const findRow=uid=>rows().find(r=>r.uid===uid);
// 勾選＝核准／開通；取消＝停用
$('#devTable').addEventListener('change',e=>{
  const c=e.target.closest('[data-sw]');if(!c)return;
  const r=findRow(c.closest('tr').dataset.uid);if(!r)return;const k=c.dataset.sw,nm=r.name||devCode(r.uid);
  c.checked=!c.checked; // 先還原，確認後由資料更新畫面
  if(k==='k'){
    const d=r.k,h=r.h;
    if(!r.on.k)modal(`<h3>核准打卡：${esc(nm)}</h3><p>裝置代碼 <b>${esc(devShort(r.uid))}</b>${d.hwId?`、裝置編號 <b>${esc(hwShort(d.hwId))}</b>${d.model?`（${esc(d.model)}）`:''}`:''}。請確認和平板上顯示的一樣。</p>
        <p><input id="mNm" style="width:100%" value="${esc(r.name)}" placeholder="裝置名稱，例如：櫃台平板"></p>
        ${d.hwId?`<label class="opt"><input type="radio" name="mHow" value="hw" checked><span><b>綁定裝置編號（建議）</b><br><span class="sub">這台平板之後代碼變了（清除資料、重裝 App）也自動沿用，不用再核准</span></span></label>
          <label class="opt"><input type="radio" name="mHow" value="code"><span><b>只核准這個代碼</b><br><span class="sub">代碼變了要重新核准</span></span></label>`:'<p class="hint">這台裝置是用瀏覽器開啟，沒有裝置編號，只能以代碼核准。</p>'}`,
      m=>{const name=m.querySelector('#mNm').value.trim()||'打卡裝置',how=m.querySelector('[name=mHow]:checked')?.value||'code',by={approvedBy:me,approvedAt:Date.now()};
        if(how==='hw')run(Promise.all([DB.hw(d.hwId,{at:Date.now(),...(h||{}),approved:true,name,model:d.model||h?.model||'',...by}),DB.dev(r.uid,{...d,name})]),'已核准打卡');
        else run(DB.dev(r.uid,{...d,approved:true,name,...by}),'已核准打卡');},'核准');
    else if(devVia(r.uid)==='hw'){const codes=Object.entries(kDevs).filter(([,y])=>y.hwId===d.hwId);
      modal(`<h3>停用打卡：${esc(nm)}</h3><p>這台平板是以裝置編號 <b>${esc(hwShort(d.hwId))}</b> 核准的。停用後，這台平板${codes.length>1?`（共 ${codes.length} 個代碼）`:''}都不能打卡，直到重新核准。</p>`,
        ()=>{run(Promise.all([DB.hw(d.hwId,{...h,approved:false}),...codes.filter(([,y])=>y.approved).map(([id,y])=>DB.dev(id,{...y,approved:false}))]),'已停用打卡');},'停用',true);}
    else modal(`<h3>停用打卡：${esc(nm)}？</h3><p>停用後這個代碼不能打卡，之後可以重新勾選核准。</p>`,()=>{run(DB.dev(r.uid,{...d,approved:false}),'已停用打卡');},'停用',true);
    return;
  }
  const t=r.t,th=r.th,label=SYS[k],by={approvedBy:me,approvedAt:Date.now()};
  // 已用裝置編號核准：改 tpHw 的開通狀態（這台平板的所有代碼一起生效）
  if(r.tpVia==='hw'){const v=!r.on[k];
    modal(`<h3>${v?'開通':'關閉'}${label}：${esc(nm)}${v?'':'？'}</h3><p>這台平板是以裝置編號 <b>${esc(hwShort(t.hwId))}</b> 核准的，${v?`開通後不用登入即可使用${label}`:`關閉後會立刻無法使用${label}，之後可以重新勾選`}。</p>`,
      ()=>{run(DB.tpHw(t.hwId,{...th,[k]:v}),`已${v?'開通':'關閉'}${label}`);},v?'開通':'關閉',!v);return;}
  if(!r.on[k]){
    // 開通：還沒認證的設備一併核准；第一次核准時只開通勾選的那一個系統；從 App 申請（有裝置編號）可以綁定裝置編號
    const next=t.approved?{...t,[k]:true}:{...t,approved:true,tp:k==='tp',cs:k==='cs',...by};
    const first=!t.approved&&t.hwId;
    modal(`<h3>開通${label}：${esc(nm)}</h3><p>設備代碼 <b>${esc(t.code||devCode(r.uid))}</b>${t.hwId?`、裝置編號 <b>${esc(hwShort(t.hwId))}</b>${t.model?`（${esc(t.model)}）`:''}`:''}，請確認和平板上顯示的一樣。開通後這台設備不用登入即可使用${label}。</p>
      ${first?`<p><input id="mNm" style="width:100%" value="${esc(r.name)}" placeholder="設備名稱，例如：診間平板"></p>
        <label class="opt"><input type="radio" name="mHow" value="hw" checked><span><b>綁定裝置編號（建議）</b><br><span class="sub">這台平板之後代碼變了（清除資料、重裝 App）也自動沿用，不用再核准</span></span></label>
        <label class="opt"><input type="radio" name="mHow" value="code"><span><b>只核准這個代碼</b><br><span class="sub">代碼變了要重新核准</span></span></label>`:''}`,
      m=>{const how=m.querySelector('[name=mHow]:checked')?.value||'code',name=m.querySelector('#mNm')?.value.trim()||t.name||'';
        if(how==='hw')run(Promise.all([DB.tpHw(t.hwId,{...(th||{}),approved:true,tp:k==='tp',cs:k==='cs',name,model:t.model||th?.model||'',...by}),...(name!==t.name?[DB.tp(r.uid,{...t,name})]:[])]),`已開通${label}（綁定裝置編號）`);
        else run(DB.tp(r.uid,{...next,name}),`已開通${label}`);},'開通');
  }else modal(`<h3>關閉${label}：${esc(nm)}？</h3><p>這台設備會立刻無法使用${label}，之後可以重新勾選。</p>`,
      ()=>{run(DB.tp(r.uid,{...t,[k]:false}),`已關閉${label}`);},'關閉',true);
});
$('#devTable').addEventListener('click',e=>{
  const b=e.target.closest('[data-x]');if(!b)return;
  const r=findRow(b.closest('tr').dataset.uid);if(!r)return;const nm=r.name||devCode(r.uid);
  if(b.dataset.x==='name')modal(`<h3>設備名稱</h3><input id="mNm" style="width:100%" value="${esc(r.name)}">`,m=>{const name=m.querySelector('#mNm').value.trim();if(!name)return false;
    run(Promise.all([...(r.t?[DB.tp(r.uid,{...r.t,name})]:[]),...(r.th?[DB.tpHw(r.t.hwId,{...r.th,name})]:[]),...(r.k?[DB.dev(r.uid,{...r.k,name})]:[]),...(r.h?[DB.hw(r.k.hwId,{...r.h,name})]:[])]),'已改名稱');},'儲存');
  if(b.dataset.x==='del'){
    const hwNote=(r.k&&devVia(r.uid)==='hw'?'<br>這台平板的打卡已綁定裝置編號，重新開啟 App 會自動以新代碼恢復；要讓它不能打卡請先取消「打卡」勾選。':'')+(r.tpVia==='hw'?'<br>這台平板的計劃單／耗材已綁定裝置編號，重新開啟耗材 App 會自動以新代碼恢復；要讓它不能使用請先取消勾選。':'');
    modal(`<h3>刪除設備「${esc(nm)}」？</h3><p>刪除後這台設備需要重新申請認證（${[r.k&&'打卡',r.t&&'治療計劃單／耗材'].filter(Boolean).join('、')}）。${hwNote}</p>`,
      ()=>{run(Promise.all([...(r.t?[DB.tp(r.uid,null)]:[]),...(r.k?[DB.dev(r.uid,null)]:[])]),'已刪除');},'刪除',true);
  }
});

/* ====== 對話框 ====== */
function modal(html,onOk,okLabel='確定',danger=false){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}<div class="acts"><button type="button" data-x="cancel">取消</button><button type="button" class="${danger?'btn-danger':'btn-primary'}" data-x="ok">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(bg);bg.querySelector('input')?.focus();
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.closest('[data-x="cancel"]'))bg.remove();if(e.target.closest('[data-x="ok"]')&&onOk(bg.querySelector('.modal'))!==false)bg.remove()});
}

/* ====== 登入：只有排班超級管理員（OWNER_EMAILS 或 access/{Gmail}.perm == 'super'） ====== */
function showGate(kind,email){
  const g=$('#gate'),msg=$('#gateMsg'),acts=$('#gateActs');g.hidden=false;
  if(kind==='loading'){msg.textContent='連線中…';acts.innerHTML='';return}
  if(kind==='signin'){msg.textContent='請用 Google 帳號登入（與排班系統相同的帳號）。';acts.innerHTML='<button class="btn-primary" id="gSignIn">使用 Google 登入</button>';$('#gSignIn').onclick=signIn;return}
  if(kind==='error'){msg.textContent=email;acts.innerHTML='<button id="gReload">重新整理</button>';$('#gReload').onclick=()=>location.reload();return}
  msg.innerHTML=`你的帳號 <span class="who">${esc(email)}</span> 不是超級管理員，不能使用設備認證。<br>如需核准設備，請洽診所的超級管理員。`;
  acts.innerHTML='<button id="gOther">改用其他帳號登入</button>';$('#gOther').onclick=signOut;
}
async function signIn(){
  const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
  try{await firebase.auth().signInWithPopup(pr)}
  catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-environment')return firebase.auth().signInWithRedirect(pr);
    if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('登入失敗：'+e.message)}
}
async function signOut(){if(window.firebase&&firebase.apps.length)await firebase.auth().signOut();location.reload()}
$('#signOutBtn').addEventListener('click',signOut);
function afterLogin(){$('#gate').hidden=true;$('#me').hidden=false;$('#meEmail').textContent=me;renderDev()}
function bootCloud(){
  if(!window.firebase){showGate('error','無法載入登入元件，請確認網路連線後重新整理。');return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  fs=firebase.firestore();fs.settings({ignoreUndefinedProperties:true,merge:true});
  if(window.ReadCounter)ReadCounter.install(fs,()=>me,'設備認證');
  showGate('loading');
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous){if(u)await firebase.auth().signOut();showGate('signin');return}
    me=(u.email||'').toLowerCase();
    const owner=(window.OWNER_EMAILS||[]).some(x=>x.toLowerCase()===me);
    let acc=null;try{const s=await fs.doc('access/'+me).get();acc=s.exists?s.data():null}catch(e){console.error(e)}
    if(!owner&&acc?.perm!=='super'){showGate('nosuper',me);return}
    afterLogin();
    const err=e=>{console.warn(e);toast('讀取失敗：'+permErr(e))};
    const to=snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());return m};
    fs.collection('tpDevices').onSnapshot(s=>{tpDevs=to(s);renderDev()},err);
    fs.collection('devices').onSnapshot(s=>{kDevs=to(s);renderDev()},err);
    fs.collection('hw').onSnapshot(s=>{hwDevs=to(s);renderDev()},err);
    fs.collection('tpHw').onSnapshot(s=>{tpHws=to(s);renderDev()},err);
  });
}
// 本機模式：沒有資料時放兩筆示範用的設備申請
function loadLocal(){const k=ld(KIOSK_KEY);tpDevs=ld(TPDEV_KEY);tpHws=ld(TPHW_KEY);kDevs=k.devices||{};hwDevs=k.hw||{};renderDev()}
function bootLocal(){
  me='本機測試';
  if(!localStorage.getItem(TPDEV_KEY))sv(TPDEV_KEY,{'demoUidAAAAAA':{name:'診間平板',code:'AAAAAA',approved:false,from:'cs',reqAt:Date.now()-3600e3},'demoUidBBBBBB':{name:'櫃台平板',code:'BBBBBB',approved:true,reqAt:Date.now()-86400e3,approvedBy:'本機測試',approvedAt:Date.now()-80000e3}});
  const k=ld(KIOSK_KEY);if(!k.devices){k.devices={'kioskcode01':{name:'',approved:false,at:Date.now(),hwId:'abc12345678x',model:'iPad (示範)'}};sv(KIOSK_KEY,k)}
  afterLogin();loadLocal();addEventListener('storage',e=>{if(e.key===KIOSK_KEY||e.key===TPDEV_KEY||e.key===TPHW_KEY)loadLocal()});
}
if(window.FIREBASE_CONFIG)bootCloud();else bootLocal();
