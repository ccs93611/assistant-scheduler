<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新海治療計劃單</title>
<style>
:root{
  --bg:#f4f6f7;--panel:#fff;--ink:#1d2a30;--muted:#66767d;--line:#dde3e6;--soft:#eef3f4;
  --accent:#0f7c80;--accent-ink:#fff;--accent-soft:#e1f1f1;
  --danger:#c0392b;--danger-soft:#fbe9e7;--ok:#1e8449;--ok-soft:#e5f4ea;--warn:#b9770e;--warn-soft:#fdf2e0;--info:#1f5fae;--info-soft:#e3eefb;
  --sig-bg:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181b;--panel:#1a2226;--ink:#e3eaec;--muted:#93a3a9;--line:#2c383d;--soft:#212b30;
  --accent:#3fb6b9;--accent-ink:#0b1416;--accent-soft:#16383a;
  --danger:#ef7a6c;--danger-soft:#3a1f1c;--ok:#5cc98a;--ok-soft:#173023;--warn:#e7b25a;--warn-soft:#352a16;--info:#7fb3f0;--info-soft:#16283f;
  --sig-bg:#f7f7f7;
}}
*{box-sizing:border-box}
[hidden]{display:none!important} /* 讓 hidden 屬性一定生效（.gate、.me 等有自己的 display） */
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input:disabled,select:disabled{background:var(--soft);color:var(--ink);opacity:1}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-danger{color:var(--danger)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:3px 8px;font-size:13px}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
@media (min-width:1500px){.app{grid-template-columns:550px 1fr}}
@media (min-width:821px) and (max-width:1180px){.app{grid-template-columns:230px 1fr}}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;max-height:100vh;position:sticky;top:0}
.side-head{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.side-head h1{font-size:17px;margin:0}
.side-head .row{display:flex;gap:6px}
.side-head .row>*{flex:1}
.plan-list{overflow:auto;flex:1;container-type:inline-size;container-name:plist}
.plan-item{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;gap:3px 12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 14px;background:transparent}
.plan-item.on{background:var(--accent-soft)}
.plan-item .t{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.ptags{display:inline-flex;flex-wrap:wrap;gap:4px}
.plan-item .l1,.plan-item .l2,.plan-item .x1,.plan-item .x2{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;min-width:0}
.plan-item .l1{grid-column:1;grid-row:1}.plan-item .l2{grid-column:1;grid-row:2}
.plan-item .tg{grid-column:2;grid-row:1/3;align-self:center;min-width:0}  /* 標籤放在中間空白處，上下置中 */
.plan-item .x1{grid-column:3;grid-row:1;justify-content:flex-end}.plan-item .x2{grid-column:3;grid-row:2;justify-content:flex-end}
.plan-item .tg:empty{display:none}
/* 列表窄時（例如側欄 300px）改成直式排列，避免文字重疊 */
@container plist (max-width:480px){
  .plan-item{grid-template-columns:minmax(0,1fr) auto;gap:4px 8px}
  .plan-item .l1{grid-column:1;grid-row:1}
  .plan-item .x1{display:contents}
  .plan-item .x1 .chip{grid-column:2;grid-row:1;align-self:start}
  .plan-item .l2{grid-column:1/3;grid-row:2}
  .plan-item .x1 .dt{grid-column:1;grid-row:3}
  .plan-item .x2{grid-column:2;grid-row:3}
  .plan-item .tg{grid-column:1/3;grid-row:4;margin-top:2px}
  .plan-item .ptag{font-size:13px;padding:1px 9px}
}
.plan-item .nm{font-size:15px}
.plan-item .m{font-size:12px;color:var(--muted);white-space:nowrap}
.plan-item .m.big{font-size:14px;color:var(--ink)}
.plan-item .m:empty{display:none}
.plan-item .sp{flex:1}
.ptag{font-size:15px;line-height:1.6;padding:2px 11px;border-radius:999px;background:hsl(var(--h) 65% 92%);color:hsl(var(--h) 55% 28%);white-space:nowrap}
.ptag[data-custom="1"]{background:var(--soft);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ptag{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 78%)}}
.plan-item .s{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.side-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.me{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
.gate-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:420px;width:100%;text-align:center}
.gate-box h2{margin:0 0 12px;font-size:20px}
.gate-box p{color:var(--muted);line-height:1.7}
.gate-box .who{color:var(--ink);font-weight:600}
.gate-box button{margin-top:8px;padding:10px 18px;font-size:15px}
.local-banner{margin:8px 14px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ro-note{font-size:13px;color:var(--warn);margin:6px 0}
main{padding:20px;min-width:0}
.empty{color:var(--muted);text-align:center;padding:80px 20px}
.sheet{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .title{font-size:20px;font-weight:700}
.topbar .no{color:var(--muted);font-size:13px}
.topbar .sp{flex:1}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.chip.open{background:var(--warn-soft);color:var(--warn)}
.chip.pending{background:var(--accent-soft);color:var(--accent)}
.chip.expiredNone{background:var(--soft);color:var(--muted);border:1px dashed var(--muted)}  /* 同「未定案」 */
.chip.expiredPaid{background:var(--soft);color:var(--muted);border:1.5px solid var(--danger)}   /* 同「未定案」外加紅框 */
.chip.draftCont,.chip.draft{background:var(--soft);color:var(--muted);border:1px dashed var(--muted)}
.chip.paid{background:var(--ok-soft);color:var(--ok)}
.chip.changed{background:var(--info-soft);color:var(--info)}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid-f label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.grid-f label input{font-size:15px;color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:middle}
th{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--soft)}
td input,td select{width:100%}
td.num,th.num{text-align:right}
td input.num{text-align:right;min-width:96px}
td input[data-k="qty"]{min-width:52px}
td.drag-handle{cursor:grab;user-select:none;touch-action:none;white-space:nowrap}
.drag-handle i{font-style:normal;color:var(--muted);font-size:12px;letter-spacing:-2px}
tr.dragging td{opacity:.45}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--accent)}
tr.drop-after td{box-shadow:inset 0 -3px 0 var(--accent)}
@media print{.drag-handle i{display:none}}
/* 繳費紀錄、收據開立紀錄：寬度不夠時改成卡片排法，不需要左右捲動 */
.pay-wrap{container-type:inline-size;container-name:pays}
.rcpt-wrap{container-type:inline-size;container-name:rcpts}
@container pays (max-width:640px){
  .pay-tbl thead{display:none}
  .pay-tbl,.pay-tbl tbody{display:block}
  .pay-tbl tbody tr:not([data-list]) td{display:block}
  .pay-tbl tr[data-list]{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) 32px;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:end}
  .pay-tbl tr[data-list] td{display:block;border:0;padding:0;min-width:0}
  .pay-tbl .p-date{grid-column:1/3;grid-row:1}.pay-tbl .p-item{grid-column:3/7;grid-row:1}
  .pay-tbl .p-del{grid-column:7;grid-row:1;align-self:center}
  .pay-tbl .p-teeth{grid-column:1/5;grid-row:2}.pay-tbl .p-note{grid-column:5/7;grid-row:2}
  .pay-tbl .p-amt{grid-column:1/3;grid-row:3}.pay-tbl .p-hand{grid-column:3/5;grid-row:3}.pay-tbl .p-sig{grid-column:5/7;grid-row:3}
}
@container pays (max-width:600px){
  .pay-tbl .p-date{grid-column:1/7}
  .pay-tbl .p-item{grid-column:1/8;grid-row:2}.pay-tbl .p-teeth{grid-column:1/8;grid-row:3}
  .pay-tbl .p-note{grid-column:1/8;grid-row:4}
  .pay-tbl .p-amt{grid-column:1/4;grid-row:5}.pay-tbl .p-hand{grid-column:4/8;grid-row:5}.pay-tbl .p-sig{grid-column:1/8;grid-row:6}
}
@container rcpts (max-width:640px){
  .rcpt-tbl thead{display:none}
  .rcpt-tbl,.rcpt-tbl tbody{display:block}
  .rcpt-tbl tbody tr:not([data-list]) td{display:block}
  .rcpt-tbl tr[data-list]{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) 32px;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:end}
  .rcpt-tbl tr[data-list] td{display:block;border:0;padding:0;min-width:0}
  .rcpt-tbl .r-date{grid-column:1/3;grid-row:1}.rcpt-tbl .r-amt{grid-column:3/5;grid-row:1}.rcpt-tbl .r-taken{grid-column:5/7;grid-row:1;text-align:left!important}
  .rcpt-tbl .r-del{grid-column:7;grid-row:1;align-self:center}
  .rcpt-tbl .r-note{grid-column:1/5;grid-row:2}.rcpt-tbl .r-sig{grid-column:5/7;grid-row:2}
  .rcpt-tbl .r-photo{grid-column:1/7;grid-row:3}
}
@container rcpts (max-width:520px){
  .rcpt-tbl .r-date{grid-column:1/4}.rcpt-tbl .r-amt{grid-column:4/7}
  .rcpt-tbl .r-taken{grid-column:1/4;grid-row:2}.rcpt-tbl .r-sig{grid-column:4/8;grid-row:2}
  .rcpt-tbl .r-note{grid-column:1/8;grid-row:3}.rcpt-tbl .r-photo{grid-column:1/8;grid-row:4}
}
.pay-tbl td[data-label]::before,.rcpt-tbl td[data-label]::before{content:attr(data-label);display:none;font-size:13px;color:var(--muted);margin-bottom:2px;white-space:nowrap}
@container pays (max-width:640px){.pay-tbl td[data-label]::before{display:block}.pay-tbl .p-amt::before{text-align:right}}
@container rcpts (max-width:640px){.rcpt-tbl td[data-label]::before{display:block}.rcpt-tbl .r-amt::before{text-align:right}}
/* 平板寬度：繳費紀錄、收據開立紀錄維持一列表格，縮小間距與欄寬 */
@container pays (min-width:641px) and (max-width:1150px){
  .pay-tbl th,.pay-tbl td{padding:6px 3px}
  .pay-tbl th{font-size:13px;width:auto!important;min-width:0!important}
  .pay-tbl th:nth-child(1){width:106px!important}.pay-tbl th:nth-child(2){min-width:96px!important}.pay-tbl th:nth-child(3){min-width:160px!important}
  .pay-tbl th:nth-child(5){width:72px!important}.pay-tbl th:nth-child(6){width:66px!important}.pay-tbl th:nth-child(7){width:56px!important}.pay-tbl th:nth-child(8){width:24px!important}
  .pay-tbl td.p-sig .btn-sm{padding:3px 6px}
  .pay-tbl td input,.pay-tbl td select{padding:5px 3px;font-size:13px}
  .pay-tbl td input.num{min-width:0}
  .pay-tbl input[type=number]{-moz-appearance:textfield}
  .pay-tbl input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .pay-tbl .need-sig{display:none}
  .pay-tbl .sig-mini{max-width:70px}
  .pay-tbl .teeth-cell .jaw span{width:12px}
  .pay-tbl .btn-x{padding:3px 4px}
}
@container rcpts (min-width:641px) and (max-width:950px){
  .rcpt-tbl th,.rcpt-tbl td{padding:6px 3px}
  .rcpt-tbl th{font-size:13px;width:auto!important;min-width:0!important;white-space:normal}
  .rcpt-tbl th:nth-child(1){width:112px!important}.rcpt-tbl th:nth-child(2){width:84px!important}.rcpt-tbl th:nth-child(3){width:56px!important}
  .rcpt-tbl th:nth-child(5){min-width:110px!important}.rcpt-tbl th:nth-child(6){width:74px!important}.rcpt-tbl th:nth-child(7){width:24px!important}
  .rcpt-tbl td input{padding:5px 3px;font-size:13px}
  .rcpt-tbl td input.num{min-width:0}
  .rcpt-tbl input[type=number]{-moz-appearance:textfield}
  .rcpt-tbl input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .rcpt-tbl .need-sig{display:none}
  .rcpt-tbl .sig-mini{max-width:70px}
  .rcpt-tbl .btn-x{padding:3px 4px}
}
/* 治療項目表：寬度不夠時改成兩～三行的卡片排法，不需要左右捲動 */
.items-wrap{container-type:inline-size;container-name:items}
.items-tbl tr.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.items-tbl tr.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.items-tbl .h-no{width:34px}.items-tbl .h-item{min-width:230px}.items-tbl .h-teeth{min-width:340px}.items-tbl .h-unit{width:110px}.items-tbl .h-qty{width:76px}
.items-tbl .h-orig,.items-tbl .h-chg{width:120px}.items-tbl .h-del{width:36px}
/* 平板寬度：維持一列表格，縮小間距與欄寬 */
@container items (min-width:641px) and (max-width:1150px){
  .items-tbl th,.items-tbl td{padding:6px 3px}
  .items-tbl th{font-size:13px}
  .items-tbl .h-no{width:26px}.items-tbl .h-item{min-width:140px}.items-tbl .h-teeth{min-width:190px}
  .items-tbl .h-unit{width:72px}.items-tbl .h-qty{width:44px}.items-tbl .h-orig,.items-tbl .h-chg{width:78px}.items-tbl .h-del{width:26px}
  .items-tbl td input,.items-tbl td select{padding:5px 4px;font-size:14px}
  .items-tbl td input.num,.items-tbl td input[data-k="qty"]{min-width:0}
  .items-tbl input[type=number]{-moz-appearance:textfield}
  .items-tbl input[type=number]::-webkit-inner-spin-button,.items-tbl input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .items-tbl .combo-wrap input{padding-right:18px}.items-tbl .combo-wrap::after{right:6px}
  .items-tbl .teeth-cell .jaw span{width:12px}
  .items-tbl .btn-x{padding:3px 4px}
  .items-tbl tfoot input{width:78px}
}
/* 手機寬度：每個項目分三行 */
@container items (max-width:640px){
  .items-tbl thead{display:none}
  .items-tbl,.items-tbl tbody,.items-tbl tfoot{display:block}
  .items-tbl tbody tr:not([data-list]) td{display:block}
  .items-tbl tr[data-list="items"]{display:grid;grid-template-columns:30px repeat(5,minmax(0,1fr)) 32px;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:end}
  .items-tbl tr[data-list="items"] td{display:block;border:0;padding:0;min-width:0}
  .items-tbl .c-no{grid-column:1;grid-row:1/3;align-self:center}
  .items-tbl .c-item{grid-column:2/4;grid-row:1}
  .items-tbl .c-teeth{grid-column:4/7;grid-row:1}
  .items-tbl .c-del{grid-column:7;grid-row:1;align-self:center}
  .items-tbl .c-unit{grid-column:2;grid-row:2}.items-tbl .c-qty{grid-column:3;grid-row:2}.items-tbl .c-orig{grid-column:4;grid-row:2}
  .items-tbl .c-chg{grid-column:5/7;grid-row:2}
  .items-tbl td[data-label]::before{content:attr(data-label);display:block;font-size:13px;color:var(--muted);margin-bottom:2px;text-align:right;white-space:nowrap}
  .items-tbl td input.num,.items-tbl td input[data-k="qty"]{min-width:0}
  .items-tbl tfoot tr{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-top:8px}
  .items-tbl tfoot td{display:block;border:0;padding:0}
  .items-tbl tfoot td:empty{display:none}
  .items-tbl tfoot input{width:130px}
}
@container items (max-width:640px){
  .items-tbl .c-no{grid-row:1/4}
  .items-tbl .c-item{grid-column:2/7;grid-row:1}
  .items-tbl .c-teeth{grid-column:2/8;grid-row:2}
  .items-tbl .c-unit,.items-tbl .c-qty,.items-tbl .c-orig,.items-tbl .c-chg{grid-row:3}
}
textarea.note-ta{width:100%;resize:none;overflow:hidden;line-height:1.4;display:block;min-height:34px;white-space:pre-wrap;word-break:break-word}
.cat-tag{font-size:11px;color:var(--accent);display:block}
.combo-wrap{position:relative}
.combo-wrap::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}
.combo-wrap input{padding-right:24px}
.combo-pop{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:auto;padding:4px 0;max-width:min(420px,calc(100vw - 16px))}
.combo-grp{font-size:12px;font-weight:700;color:var(--muted);padding:6px 12px 2px;position:sticky;top:-4px;background:var(--panel)}
.combo-opt{padding:5px 12px;cursor:pointer;font-size:14px}
.combo-cat{font-weight:600;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.combo-cat:first-child{border-top:0}
.combo-cat .arr{width:12px;color:var(--muted);font-size:11px}
.combo-cat .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.combo-cat.open{color:var(--accent)}
.combo-sub{padding-left:30px}
.combo-opt.on{background:var(--accent-soft)}
.combo-opt.sel{font-weight:700;color:var(--accent)}
.combo-empty{padding:8px 12px;color:var(--muted);font-size:13px}
@media print{.combo-wrap::after{display:none}}
.teeth-cell{display:flex;gap:4px;align-items:center}
.teeth-cell .jaws{flex:1;display:grid;min-width:0}
.teeth-cell .jaw{display:flex;align-items:center;gap:4px}
.teeth-cell .jaw+.jaw{border-top:2px solid var(--line);padding-top:3px;margin-top:3px}
.teeth-cell .jaw span{font-size:11px;color:var(--muted);width:14px;flex:none}
.teeth-cell .jaws{position:relative}
.teeth-cell .midl{position:absolute;top:2px;bottom:2px;left:50%;border-left:2px dashed var(--muted);opacity:.55;pointer-events:none}
.teeth-cell input{flex:1;font-size:13px;padding:3px 6px}
.teeth-cell input.bad{border-color:var(--danger);color:var(--danger)}
.teeth-cell button{padding:3px 6px}
.disc-amt{color:var(--warn)}
input.expired-in{border-color:var(--danger);color:var(--danger)}
.changed-amt{color:var(--danger);font-weight:600}
tfoot tr.extra-disc td{background:var(--panel);font-weight:600;color:var(--muted)}
tfoot td{font-weight:700;background:var(--soft)}
.totals{display:flex;gap:18px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.totals div{text-align:right}
.totals small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.totals b{font-size:20px}

const T_ORDER=[...REGIONS,...[1,2,3,4].flatMap(q=>[1,2,3,4,5,6,7,8].map(n=>`${q}${n}`)),...[5,6,7,8].flatMap(q=>[1,2,3,4,5].map(n=>`${q}${n}`))];

/* ====== 資料存放 ======
   雲端模式（正式使用）：Firestore
     tpPlans/{id}   一張計劃單：{json: 計劃單 JSON 字串, updatedAt, by}（簽名在 JSON 內；照片另存）
     tpFiles/{id}   一張照片：{data: dataURL, planId, at}（單一文件上限 1MB，所以照片分開存）
     tpConfig/settings  價目表等設定：{json}（只有超級管理員可以寫）
   本機模式（?local=1 開發測試，或舊資料搬遷來源）：這台電腦的 IndexedDB */
const LocalDB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('xinhai-treatment-plan',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('plans',{keyPath:'id'});d.createObjectStore('kv')};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx('plans','readonly',s=>s.getAll())},
  put(p){return this.tx('plans','readwrite',s=>s.put(p))},
  del(id){return this.tx('plans','readwrite',s=>s.delete(id))},
  get(k){return this.tx('kv','readonly',s=>s.get(k))},
  set(k,v){return this.tx('kv','readwrite',s=>s.put(v,k))},
};
let fs=null,me='',PERM='super';            // 目前登入者與權限
const canEdit=()=>['self','manage','super','device'].includes(PERM); // 可以開單、編輯、記錄繳費與收據
const canPrice=()=>PERM==='super';                          // 可以修改價目表與單上的單一金額
// 刪除計劃單：超級管理員可刪任何一張（含已定案、已結單）；其他可編輯的人只能刪還沒定案的
const canDelPlan=p=>PERM==='super'||(canEdit()&&!p.finalized&&p.status==='open');
const isPhotoData=s=>typeof s==='string'&&s.startsWith('data:');
const fileCache=new Map();
const DB={
  async put(p){
    if(!fs){await LocalDB.put(p);return}
    // 還沒上傳的照片（dataURL）先存到 tpFiles，計劃單只留檔案編號
    for(const r of p.receipts||[])for(let i=0;i<r.photos.length;i++)if(isPhotoData(r.photos[i]))r.photos[i]=await DB.putFile(r.photos[i],p.id);
    // finalized、status 另外存成欄位，讓安全規則判斷能不能刪除
    await fs.doc('tpPlans/'+p.id).set({json:JSON.stringify(p),finalized:!!p.finalized,status:p.status||'open',updatedAt:p.updatedAt||Date.now(),by:me});
  },
  async del(p){
    if(!fs){await LocalDB.del(p.id);return}
    for(const r of p.receipts||[])for(const ph of r.photos)if(!isPhotoData(ph))fs.doc('tpFiles/'+ph).delete().catch(()=>{});
    await fs.doc('tpPlans/'+p.id).delete();
  },
  async putFile(data,planId){
    if(!fs)return data;
    const id='f'+uid().replace(/-/g,'');fileCache.set(id,data);
    await fs.doc('tpFiles/'+id).set({data,planId,at:Date.now(),by:me});return id;
  },
  delFile(ph){if(fs&&!isPhotoData(ph))fs.doc('tpFiles/'+ph).delete().catch(()=>{})},
  async getFile(ph){
    if(isPhotoData(ph))return ph;if(fileCache.has(ph))return fileCache.get(ph);
    const s=await fs.doc('tpFiles/'+ph).get();const d=s.exists?s.data().data:'';fileCache.set(ph,d);return d;
  },
  async saveSettings(){
    if(!canPrice())return;
    if(!fs){await LocalDB.set('settings',settings);return}
    await fs.doc('tpConfig/settings').set({json:JSON.stringify(settings),at:Date.now(),by:me});
  },
};

const money=n=>(Number(n)||0).toLocaleString('zh-TW');
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowLocal=()=>{const d=new Date();return `${today()}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDT=s=>s?s.replace('T',' '):'';
const numOrNull=v=>v===''||v==null?null:Math.max(0,Math.round(Number(v)||0));
const cur=()=>plans.get(curId);

// 變更金額：留空等於原始金額；舊資料若存的是減免金額（disc），變更金額 = 原始金額 − 減免金額
const chgOf=it=>it.disc!=null?(it.orig||0)-it.disc:(it.chg??(it.orig||0));
const discOf=it=>(it.orig||0)-chgOf(it);
function calc(p){
  const orig=p.items.reduce((a,i)=>a+(i.orig||0),0);
  const chg=p.items.reduce((a,i)=>a+chgOf(i),0)-(p.extraDisc||0); // 追加減免：整張單另外再減
  const paid=p.payments.reduce((a,x)=>a+(x.amount||0),0);
  const rcpt=p.receipts.reduce((a,x)=>a+(x.amount||0),0);
  return {orig,chg,paid,due:chg-paid,rcpt};
}
const STATUS={draftCont:'未定案-續',expiredPaid:'有繳費且過期',expiredNone:'無繳費且過期',draft:'未定案',pending:'尚未進行',open:'進行中',paid:'已結單－費用收訖',changed:'已結單－計畫變更'};
// 顯示用狀態（未結單時）：還沒定案 → 未定案；已定案但還沒有繳費紀錄 → 尚未進行；有繳費紀錄 → 進行中
// 有繳費：只要有過一筆金額不是 0 的繳費紀錄（含退費、前單轉入）
const hasPaid=p=>p.payments.some(x=>x.amount);
const stOf=p=>p.status!=='open'?p.status:isExpired(p)?(hasPaid(p)?'expiredPaid':'expiredNone'):!p.finalized?(p.prevId?'draftCont':'draft'):hasPaid(p)?'open':'pending';
// 有效期限：預設為單據開立日起 6 個月，可手動調整（手動設定的存在 p.expiry）；還沒結單且超過期限顯示「有繳費且過期」或「無繳費且過期」
const EXPIRY_MONTHS=6;
function addMonths(ymd,n){const [y,m,d]=ymd.split('-').map(Number);const last=new Date(y,m-1+n+1,0).getDate();const dt=new Date(y,m-1+n,Math.min(d,last));return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`}
const expiryOf=p=>p.expiry||((p.createdAt||'').slice(0,10)?addMonths(p.createdAt.slice(0,10),EXPIRY_MONTHS):'');
const isExpired=p=>{const e=expiryOf(p);return !!e&&today()>e};
const ST_SHORT={draftCont:'未定案-續',expiredPaid:'有繳費且過期',expiredNone:'無繳費且過期',draft:'未定案',pending:'尚未進行',open:'進行中',paid:'已收訖',changed:'計畫變更'};

/* ====== 儲存 ====== */
let saveT=null,pendingP=null;
// 換到別張單時，上一張還沒寫入的變更立刻寫入；已刪除的單不再寫回
const saveFail=e=>{console.error(e);const i=$('#saveInd');if(i)i.textContent='⚠ 儲存失敗'+(e&&e.code==='permission-denied'?'（沒有權限）':'')};
function flushPending(){clearTimeout(saveT);const q=pendingP;pendingP=null;if(q&&plans.has(q.id))DB.put(q).catch(saveFail)}
function touch(){const p=cur();if(!p)return;p.updatedAt=Date.now();const ind=$('#saveInd');if(ind)ind.textContent='儲存中…';
  if(pendingP&&pendingP!==p)flushPending();
  pendingP=p;clearTimeout(saveT);saveT=setTimeout(async()=>{pendingP=null;if(!plans.has(p.id))return;try{await DB.put(p)}catch(e){saveFail(e);return}const i=$('#saveInd');if(i)i.textContent='已自動儲存 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});renderList()},350)}
async function saveNow(p){flushPending();p.updatedAt=Date.now();try{await DB.put(p)}catch(e){saveFail(e);alert('儲存失敗'+(e.code==='permission-denied'?'：沒有權限':''))}}
async function saveSettings(){try{await DB.saveSettings()}catch(e){console.error(e);alert('價目表儲存失敗：'+(e.code==='permission-denied'?'沒有權限':e.message))}}

/* ====== 列表 ====== */
function renderList(){
  const q=$('#search').value.trim().toLowerCase(),sf=$('#statusFilter').value;
  const arr=[...plans.values()].filter(p=>(!sf||stOf(p)===sf)&&(!q||[p.name,p.chartNo,p.no,p.doctor,p.assistant,...p.items.flatMap(i=>[i.name,i.cat])].some(v=>String(v||'').toLowerCase().includes(q))))
    .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')||b.updatedAt-a.updatedAt);
  $('#planList').innerHTML=arr.length?arr.map(p=>{const c=calc(p);return `<button class="plan-item ${p.id===curId?'on':''}" data-open="${p.id}">
    <div class="l1"><b class="nm">${esc(p.name||'（未填姓名）')}</b><span class="m big">${p.birthday?'生日 '+esc(p.birthday):''}</span><span class="m">${esc(p.chartNo||'')}</span></div>
    <div class="l2"><span class="m big">主治 ${esc(p.doctor||'—')}・助理 ${esc(p.assistant||'—')}</span></div>
    <div class="tg">${planTags(p)}</div>
    <div class="x1"><span class="m dt">開立 ${esc(fmtDT(p.createdAt)||'—')}</span><span class="chip ${stOf(p)}">${ST_SHORT[stOf(p)]}</span></div>
    <div class="x2"><span class="m">$${money(c.chg)}${c.due>0&&p.status==='open'?` ・未繳 ${money(c.due)}`:''}</span></div>
  </button>`}).join(''):'<div class="empty" style="padding:30px 10px">沒有符合的計劃單</div>';
}
$('#planList').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openPlan(b.dataset.open)});
$('#search').addEventListener('input',renderList);
$('#statusFilter').addEventListener('change',renderList);

// 列表上的治療種類標籤：滑鼠移上去可看該種類的項目
const CAT_HUE=Object.fromEntries(CATS.map(([c],i)=>[c,[200,30,140,265,330,95,175,45,290,55,10][i%11]]));
function planTags(p){
  const by=new Map();
  for(const i of p.items){if(!i.name)continue;const c=i.custom?'自訂項目':i.cat;if(!by.has(c))by.set(c,[]);by.get(c).push(i.name)}
  if(!by.size)return '';
  const order=[...CATS.map(c=>c[0]),'自訂項目'];
  return '<div class="ptags">'+[...by].sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])).map(([c,names])=>
    `<span class="ptag" style="--h:${CAT_HUE[c]??0}" data-custom="${c==='自訂項目'?1:0}" title="${esc([...new Set(names)].join('、'))}">${esc(c)}</span>`).join('')+'</div>';
}
function nextNo(){const d='TP'+today().replace(/-/g,'');const n=Math.max(0,...[...plans.values()].filter(p=>(p.no||'').startsWith(d+'-')).map(p=>parseInt(p.no.slice(d.length+1))||0))+1;return `${d}-${pad(n)}`}
function blankPlan(){return {id:uid(),no:nextNo(),name:'',birthday:'',chartNo:'',doctor:'',assistant:'',createdAt:nowLocal(),
  items:[newItem()],consent:{sig:null,at:''},payments:[],receipts:[],status:'open',closedAt:null,prevId:null,nextId:null,updatedAt:Date.now()}}
function newItem(){return {id:uid(),cat:'',name:'',custom:false,teeth:[],pontics:[],bridgeTeeth:[],qty:1,qtyManual:false,orig:0,chg:null}}

$('#newBtn').addEventListener('click',async()=>{const p=blankPlan();plans.set(p.id,p);await saveNow(p);openPlan(p.id);setTimeout(()=>{const n=document.querySelector('[data-f="name"]');n&&n.focus()},50)});

function openPlan(id){curId=id;renderList();renderEditor();if(innerWidth<=820)$('#main').scrollIntoView({behavior:'smooth'})}
window.addEventListener('pagehide',flushPending);

/* ====== 編輯畫面 ====== */

const ITEM_INDEX=CATS.flatMap(([cat,list])=>list.map(name=>({cat,name})));
const findItem=s=>{const q=String(s||'').trim().toLowerCase().replace(/s+/g,'');return ITEM_INDEX.find(x=>x.name.toLowerCase().replace(/s+/g,'')===q)};
function datalists(){
  const dl=(id,arr)=>`<datalist id="${id}">${arr.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`;
  // 雲端模式：名單來自排班系統的人員名單；本機模式：用設定裡手動輸入的名單
  return fs?dl('dlDoc',staffNames.doctor)+dl('dlAsst',staffNames.assistant):dl('dlDoc',settings.doctors)+dl('dlAsst',settings.assistants);
}

// 備註欄依內容自動長高，字多時換行顯示全部內容

const itemAmt=it=>chgOf(it);
const itemPaid=(p,id,exceptPay)=>p.payments.filter(x=>x.itemId===id&&x!==exceptPay).reduce((a,x)=>a+(x.amount||0),0);
function payItemOptions(p,x){
  let h=`<option value="">— 選擇項目 —</option>`;

  if(x.itemId&&!p.items.some(i=>i.id===x.itemId))h+=`<option value="${esc(x.itemId)}" selected>（已刪除的項目）</option>`;

}
// 牙位欄（治療項目與繳費紀錄共用）：上顎、下顎各一個輸入欄，中線虛線對齊，🦷 開牙位圖
function teethCell(o,disAttr){
  const v=teethInputs(o),bad=o.teethBad&&o.teethBad.length,ti=bad?esc('無法辨識：'+o.teethBad.join('、')):'可直接輸入，例如 14X12X21X23, 46, 17(X)';
  const inp=(j,ph)=>`<input data-k="teethIn" data-jaw="${j}" class="${bad?'bad':''}" value="${esc(v[j])}" placeholder="${ph}" title="${ti}" ${disAttr}>`;
  return `<div class="teeth-cell"><div class="jaws"><div class="jaw"><span>上</span>${inp('up','上顎牙位')}</div><div class="jaw"><span>下</span>${inp('lo','下顎牙位')}</div><i class="midl"></i></div><button class="btn-sm no-print" data-k="teeth" title="開啟牙位圖" ${disAttr}>🦷</button></div>`;
}
// 舊的繳費紀錄牙位是文字，轉成和治療項目相同的格式
function payTeeth(x){
  if(!Array.isArray(x.teeth)){const raw=x.teeth||'',o=parseTeeth(raw);x.teeth=o.teeth;x.pontics=o.pontics;x.bridgeTeeth=o.bridgeTeeth;x.bridgeGroups=o.bridgeGroups;if(o.bad.length){x.teethBad=o.bad;x.teethText={up:raw,lo:''}}}

}
// 更新一列的減免／變更金額顯示（skip：使用者正在輸入的欄位不覆蓋）
function syncAmtRow(tr,it,skip){

const isOrthoItem=i=>!i.custom&&i.cat==='矯正';
const PRICE_LOCK_MSG='只有超級管理員可以修改單價';
const priceLock=it=>!canPrice()&&!it.custom?`disabled title="${PRICE_LOCK_MSG}"`:'';
// 沒有編輯權限（僅檢視）的人：整張單唯讀，只能看、列印、看照片與簽名
function applyPerms(){
  const m=$('#main');if(!m||canEdit())return;
  m.querySelectorAll('input,select,textarea').forEach(x=>x.disabled=true);
  m.querySelectorAll('[data-act="addItem"],[data-act="addPay"],[data-act="addRcpt"],[data-act="finalize"],[data-act="reopen"],[data-act="delete"],.close-bar,.btn-x,.add-photo,button[data-k="sig"],button[data-k="teeth"]').forEach(x=>x.hidden=true);
  m.querySelectorAll('td.drag-handle').forEach(x=>x.classList.remove('drag-handle'));
  const top=m.querySelector('.topbar');if(top&&!m.querySelector('.ro-note'))top.insertAdjacentHTML('afterend','<div class="ro-note">你的權限為「僅檢視」，只能查看與列印。</div>');

function refreshTotals(){
  {const p=cur(),ch=document.querySelector('.topbar .chip');if(p&&ch){const s=stOf(p);ch.className='chip '+s;ch.textContent=STATUS[s]}}
  const p=cur(),c=calc(p),set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent='$'+money(v)};
  set('tOrig',c.orig);set('tDisc',c.orig-c.chg);set('tChg',c.chg);set('tChg2',c.chg);set('tPaid',c.paid);set('tDue',c.due);set('tPaid2',c.paid);set('tRcpt',c.rcpt);set('tRcptDue',c.paid-c.rcpt);
}
const rowOf=(p,el)=>{const tr=el.closest('[data-list]');if(!tr)return null;const list=p[tr.dataset.list];return {tr,list,row:list.find(r=>r.id===tr.dataset.id),name:tr.dataset.list}};
const priceOf=it=>it.custom?0:(settings.prices[pk(it.cat,it.name)]||0);
// 單一金額：開單時由價目表帶入，可在單上修改；原始金額 = 單一金額 × 數量
const unitOf=it=>it.unit!=null?it.unit:priceOf(it);
// 每張單的單價固定為開單當時的價格：舊資料沒有存單價的，用當時的原始金額 ÷ 數量 推回當時單價並存起來
function freezeUnits(p){
  for(const it of p.items||[]){
    if(it.unit!=null||!it.name)continue;
    it.unit=it.orig&&it.qty?Math.round(it.orig/it.qty):(it.custom?null:priceOf(it));
  }
  return p;
}

      const v=teethParts(it);r.tr.querySelectorAll('[data-k="teethIn"]').forEach(i=>{i.value=v[i.dataset.jaw];i.classList.remove('bad')});alignTeeth(r.tr.querySelector('.teeth-cell'));
      if(!it.amount||it.amtAuto){it.amount=Math.max(0,itemAmt(item)-itemPaid(p,item.id,it));it.amtAuto=true;r.tr.querySelector('[data-k="amount"]').value=it.amount||''}}}
  else if(k==='taken')it.taken=t.checked;

/* 點擊 */
$('#main').addEventListener('click',async e=>{
  const p=cur();if(!p)return;
  if(!canEdit()){ // 僅檢視：只允許列印、切換計劃單、看照片與簽名
    const a=e.target.closest('[data-act]'),k=e.target.closest('[data-k]')?.dataset.k;
    if(a&&a.dataset.act!=='print'){if(a.dataset.act==='consentSig'&&p.consent.sig)showImage(p.consent.sig,'患者同意治療計畫簽名');return}
    if(k&&k!=='photo'){if(k==='sig'){const r=rowOf(p,e.target);if(r&&r.row.sig)showImage(r.row.sig,'患者簽名')}return}
  }
  const op=e.target.closest('[data-open-plan]');if(op){openPlan(op.dataset.openPlan);return}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act,L=p.status!=='open';
    if(act==='print')window.print();

    else if(act==='addPay'){p.payments.push({id:uid(),date:today(),handler:'',itemId:null,teeth:[],pontics:[],bridgeTeeth:[],bridgeGroups:[],amount:Math.max(0,calc(p).due),amtAuto:true,note:'',sig:null});touch();renderEditor()}
    else if(act==='addRcpt'){const c=calc(p);p.receipts.push({id:uid(),date:today(),amount:Math.max(0,c.paid-c.rcpt),taken:false,note:'',photos:[]});touch();renderEditor()}
    else if(act==='consentSig'){if(L||p.finalized){if(p.consent.sig)showImage(p.consent.sig,'患者同意治療計畫簽名');return}const s=await openSig('患者同意治療計畫簽名',p.consent.sig);if(s!==undefined){p.consent.sig=s;if(s&&!p.consent.at)p.consent.at=nowLocal();touch();renderEditor()}}
    else if(act==='delete'){if(!canDelPlan(p))return;
      const c=calc(p),info=[p.finalized?'已定案':'',p.status!=='open'?STATUS[p.status]:'',p.payments.length?`有 ${p.payments.length} 筆繳費紀錄（已繳 $${money(c.paid)}）`:'',p.receipts.length?`有 ${p.receipts.length} 筆收據紀錄`:''].filter(Boolean);
      if(!confirm(`確定刪除治療計劃單 ${p.no}（${p.name||'未填姓名'}）？${info.length?'\n\n這張單：'+info.join('、'):''}\n\n刪除後簽名、繳費、收據與照片都會一併刪除，無法復原。`))return;
      if(info.length&&prompt(`請輸入單號 ${p.no} 確認刪除`)!==p.no){alert('單號不符，已取消刪除');return}
      if(p.prevId&&plans.get(p.prevId)){const pv=plans.get(p.prevId);pv.nextId=null;await saveNow(pv)}
      if(p.nextId&&plans.get(p.nextId)){const nx=plans.get(p.nextId);nx.prevId=null;await saveNow(nx)}
      plans.delete(p.id);flushPending();await DB.del(p);curId=null;renderList();renderEditor()}
    else if(act==='finalize')finalize(p);
    else if(act==='closePaid')closePaid(p);
    else if(act==='closeChanged')closeChanged(p);
    else if(act==='reopen'){if(!confirm('確定取消結單？此單會回到結單前的狀態。'))return;p.status='open';p.closedAt=null;await saveNow(p);renderList();renderEditor()}

  }

    if(r.name==='receipts'&&(r.row.photos.length||r.row.amount||r.row.sig)&&!confirm('確定刪除這筆收據紀錄（含照片）？'))return;

  }else if(k==='teeth'){if(r.name==='items'?IL:(L||r.row.sig))return;const it=r.row;const out=await openTeeth(it.teeth,it.pontics,bridgeTeethOf(it),it.bridgeGroups);if(out){applyTeeth(it,out);it.teethText=null;it.teethBad=null;touch();renderEditor()}}
  else if(k==='sig'){const lock=r.name==='payments'&&(L||r.row.sig);

});

/* 定案：治療項目與金額鎖定，之後只能用「結單－計畫變更」另開新單 */
async function finalize(p){
  const c=calc(p),items=p.items.filter(i=>i.name);
  if(!items.length){alert('請先填寫治療項目再定案');return}
  if(items.some(isOrthoItem)&&!items.every(isOrthoItem)){alert('矯正類項目不能和其他種類開在同一張計劃單，請把其他種類移到另一張單後再定案。');return}
  if(items.filter(i=>!i.custom&&ORTHO_MAIN.has(i.name)).length>1){alert('一張計劃單只能有一項矯正療程，請另開一張單後再定案。');return}
  if(items.some(i=>qtyOne(i)&&i.qty>1)){alert('矯正療程與矯正分析的數量固定為 1 單位，請修正後再定案。');return}
  if(!p.consent.sig){alert('患者簽名同意治療計畫後才能定案');return}
  const warn=[];if(p.items.length>items.length)warn.push(`・有 ${p.items.length-items.length} 列未選治療項目，定案時會移除`);
  if(p.items.some(i=>i.teethBad&&i.teethBad.length))warn.push('・有牙位無法辨識（紅色）');
  if(!confirm(`定案治療計畫\n\n共 ${items.length} 項，總金額 $${money(c.orig)}，變更後總金額 $${money(c.chg)}\n${warn.length?'\n注意：\n'+warn.join('\n')+'\n':''}\n定案後病患資料、治療項目與金額將無法再更動（如需變更請用「結單－計畫變更」）。確定定案？`))return;
  p.items=items;p.finalized=true;p.finalizedAt=nowLocal();await saveNow(p);renderList();renderEditor();
}
/* 結單 */
async function closePaid(p){
  const c=calc(p);const warn=[];
  if(!p.items.some(i=>i.name))warn.push('・尚未填任何治療項目');
  if(!p.finalized)warn.push('・治療計畫尚未定案');
  if(!p.consent.sig)warn.push('・患者尚未簽署同意治療計畫');
  const uns=p.payments.filter(x=>!x.transfer&&!x.sig).length;if(uns)warn.push(`・有 ${uns} 筆繳費尚未簽名`);
  if(c.due>0)warn.push(`・尚有未繳餘額 $${money(c.due)}`);
  if(c.due<0)warn.push(`・已繳金額超過變更後總金額 $${money(-c.due)}`);
  if(!confirm(`結單－費用收訖\n\n變更後總金額 $${money(c.chg)}\n已繳合計 $${money(c.paid)}\n${warn.length?'\n注意：\n'+warn.join('\n')+'\n':''}\n結單後治療項目與繳費紀錄將鎖定（收據紀錄仍可新增）。確定結單？`))return;
  p.status='paid';p.closedAt=nowLocal();await saveNow(p);renderList();renderEditor();
}
async function closeChanged(p){
  const c=calc(p);
  if(!confirm(`結單－計畫變更\n\n此單將結單並鎖定，同時建立一張新的治療計劃單（帶入病患資料與目前的治療項目）。\n此單已繳 $${money(c.paid)} 會以「前單轉入」列入新單的繳費紀錄。\n\n確定？`))return;
  const n=blankPlan();
  Object.assign(n,{name:p.name,birthday:p.birthday,chartNo:p.chartNo,doctor:p.doctor,assistant:p.assistant,prevId:p.id,

// sticky：點旁邊空白處或按 Esc 不會關閉，只能按視窗上的按鈕關閉（設定視窗用）
function modal(html,onMount,sticky){
  return new Promise(res=>{const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(bg);const close=v=>{bg.remove();document.removeEventListener('keydown',kd);res(v)};
    const kd=e=>{if(e.key==='Escape'&&!sticky)close(undefined)};document.addEventListener('keydown',kd);
    bg.addEventListener('mousedown',e=>{if(e.target===bg&&!sticky)close(undefined)});
    onMount(bg.firstElementChild,close)});
}

/* 簽名板：回傳 dataURL、null（清除）或 undefined（取消） */
function openSig(title,existing,note){
  return modal(`<h3>${esc(title)}</h3><canvas class="sigpad"></canvas>
    <div class="hint" style="margin-top:6px">請以手指、觸控筆或滑鼠在框內簽名。</div>${note?`<div class="hint" style="color:var(--danger);font-weight:600">${esc(note)}</div>`:''}
    <div class="acts">${existing?'<button class="btn-danger" data-x="remove">刪除簽名</button>':''}<span class="sp"></span><button data-x="clear">清除重簽</button><button data-x="cancel">取消</button><button class="btn-primary" data-x="ok">確認簽名</button></div>`,
  (box,close)=>{
    const cv=box.querySelector('canvas');const ctx=cv.getContext('2d');let drawn=false,down=false,last=null;
    const fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111'};
    requestAnimationFrame(fit);
    const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
    cv.addEventListener('pointerdown',e=>{down=true;last=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}ctx.beginPath();ctx.arc(last[0],last[1],1.2,0,7);ctx.fillStyle='#111';ctx.fill();drawn=true});
    cv.addEventListener('pointermove',e=>{if(!down)return;let pts=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!pts.length)pts=[e];for(const ev of pts){const q=pos(ev);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();last=q}drawn=true});
    const up=()=>{down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    box.addEventListener('click',e=>{const x=e.target.dataset.x;if(!x)return;
      if(x==='clear'){ctx.clearRect(0,0,cv.width,cv.height);drawn=false}
      else if(x==='cancel')close(undefined);
      else if(x==='remove'){if(confirm('確定刪除此簽名？'))close(null)}
      else if(x==='ok'){if(!drawn){alert('請先簽名');return}close(trimCanvas(cv))}});
  });
}
function trimCanvas(cv){
  const ctx=cv.getContext('2d'),{width:w,height:h}=cv,d=ctx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  const m=10;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(w,x1+m);y1=Math.min(h,y1+m);
  const sc=Math.min(1,500/(x1-x0));const o=document.createElement('canvas');o.width=Math.round((x1-x0)*sc);o.height=Math.round((y1-y0)*sc);
  o.getContext('2d').drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height);return o.toDataURL('image/png');
}

/* 牙位選擇 */
function openTeeth(current,curPontics,curBridgeTeeth,curGroups){
  const sel=new Set(current),px=new Set((curPontics||[]).filter(t=>sel.has(t))),bt=new Set((curBridgeTeeth||[]).filter(t=>sel.has(t)));let bMode=false,groups=(curGroups||[]).map(g=>[...g]);
  px.forEach(t=>bt.add(t));
  const btn=(t,prim)=>`<button class="tooth ${prim?'prim':''}" data-t="${t}">${t}</button>`;
  const row=(arr,prim)=>`<div class="tooth-row">${arr.map((t,i)=>btn(t,prim)+(i===arr.length/2-1?'<span class="gap"></span>':'')).join('')}</div>`;
  return modal(`<h3>選擇牙位</h3>
    <div class="regions">${REGIONS.map(r=>`<button class="btn-sm tooth-r" data-t="${r}">${r}</button>`).join('')}</div>
    <div class="tooth-sec">恆牙（病患右側在左）</div>
    <div class="tooth-grid">${row(UP)}<div class="midline"></div>${row(LO)}</div>
    <div class="tooth-sec">乳牙</div>
    <div class="tooth-grid">${row(UPP,1)}<div class="midline"></div>${row(LOP,1)}</div>
    <div class="bridge-hint" id="bridgeHint"></div>
    <div class="acts"><button data-q="single" class="single-btn">單顆</button><button data-q="bridge" class="bridge-btn">牙橋</button><button data-q="clr">清除</button><span class="sp"></span><button data-x="cancel">取消</button><button class="btn-primary" data-x="ok">確定</button></div>`,
  (box,close)=>{
    const sync=()=>{
      groups=calcSegments([...bt],groups);const brs=calcBridges([...bt],[...px],groups);
      box.querySelectorAll('[data-t]').forEach(b=>{const t=b.dataset.t,on=sel.has(t);
        if(b.classList.contains('tooth-r')){b.classList.toggle('on',on);b.classList.toggle('tooth',on);b.style.cssText=on?'width:auto;height:auto;padding:3px 10px':'';return}
        b.classList.toggle('sg',on&&!bt.has(t));b.classList.toggle('br',bt.has(t));b.classList.toggle('x',px.has(t))});
      box.querySelector('[data-q="bridge"]').classList.toggle('on',bMode);box.querySelector('[data-q="single"]').classList.toggle('on',!bMode);
      box.querySelector('#bridgeHint').textContent=(bMode?'牙橋模式：點一下選取，點兩下變成 X（缺牙），X 會和相連的牙橋選取牙自動形成牙橋；再點一下取消。':'單顆模式：點一下選取（綠色），再點一下取消；單顆不會和其他牙相連。')+
        (brs.length?`　目前牙橋：${brs.map(bridgeStr).join('、')}`:'');
    };
    sync();
    box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.t;
      if(t){
        if(REGIONS.includes(t)){sel.has(t)?sel.delete(t):sel.add(t)}
        else if(bMode){ // 未選／單顆 → 牙橋選取 → X → 取消
          if(!bt.has(t)){sel.add(t);bt.add(t)}else if(!px.has(t))px.add(t);else{px.delete(t);bt.delete(t);sel.delete(t)}
        }else if(sel.has(t)&&!bt.has(t))sel.delete(t); // 單顆：再點取消
        else if(bt.has(t)){bt.delete(t);px.delete(t);sel.delete(t)} // 點到牙橋上的牙：取消
        else sel.add(t);
        sync();
      }
      else if(b.dataset.q==='bridge'){bMode=true;sync()}
      else if(b.dataset.q==='single'){bMode=false;sync()}
      else if(b.dataset.q==='clr'){sel.clear();px.clear();bt.clear();sync()}
      else if(b.dataset.x==='cancel')close(null);else if(b.dataset.x==='ok')close({teeth:sortTeeth([...sel]),pontics:sortTeeth([...px]),bridgeTeeth:sortTeeth([...bt]),bridgeGroups:calcSegments([...bt],groups)});});
  });
}
// 只有用「牙橋」選的牙才會相連：同一排相連的牙橋選取牙分成一段，
// 但原本屬於不同組（groups，例如輸入「14X12, 11X22」）的牙在交界處斷開，新加入的牙併入相鄰那組
function calcSegments(bTeeth,groups){
  const sel=new Set(bTeeth),gid=new Map();(groups||[]).forEach((g,i)=>g.forEach(t=>gid.set(t,i)));
  const out=[];
  for(const r of [UP,LO,UPP,LOP]){let seg=[],sg=null;
    const flush=()=>{if(seg.length)out.push(seg);seg=[];sg=null};
    for(const t of r){
      if(!sel.has(t)){flush();continue}
      const g=gid.has(t)?gid.get(t):null;
      if(seg.length&&g!=null&&sg!=null&&g!==sg)flush();
      seg.push(t);if(sg==null)sg=g;
    }flush()}
  return out;
}
// 一段裡有 X 且不只一顆，就是一座牙橋
function calcBridges(bTeeth,pontics,groups){
  const px=new Set(pontics||[]);
  return calcSegments(bTeeth,groups).filter(s=>s.length>1&&s.some(t=>px.has(t)))
    .map(s=>({from:s[0],to:s[s.length-1],teeth:s,pontics:s.filter(t=>px.has(t))}));
}
// 舊資料沒有 bridgeTeeth：以當時算出的牙橋為準
const bridgeTeethOf=it=>it.bridgeTeeth||calcBridges(it.teeth,it.pontics||[]).flatMap(b=>b.teeth);
// 牙橋寫法：依牙位順序，缺牙（X）不寫號碼，例如 14X12X21X23
const bridgeStr=b=>b.teeth.map(t=>b.pontics.includes(t)?'X':t).join('');
// 牙位文字輸入：例如「14X12X21X23, 46, 17(X), 上顎」
function parseTeeth(str){
  const teeth=new Set(),px=new Set(),bt=new Set(),groups=[],bad=[];
  const rowIdx=t=>{for(const r of [UP,LO,UPP,LOP]){const i=r.indexOf(t);if(i>=0)return [r,i]}return null};
  for(const raw of String(str||'').split(/[,，、;；\s]+/)){
    const tok=raw.trim().replace(/ｘ|Ｘ|x|×|✕/g,'X').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/（/g,'(').replace(/）/g,')');
    if(!tok)continue;
    if(REGIONS.includes(tok)){teeth.add(tok);continue}
    if(/^\d{2}$/.test(tok)&&rowIdx(tok)){teeth.add(tok);continue}
    let m=tok.match(/^(\d{2})\(X\)$/);if(m&&rowIdx(m[1])){teeth.add(m[1]);px.add(m[1]);bt.add(m[1]);continue}
    if(/^(\d{2}|X)+$/.test(tok)&&tok.includes('X')&&/\d/.test(tok)){
      const parts=tok.match(/\d{2}|X/g),known=parts.map((p,i)=>p==='X'?null:[i,rowIdx(p)]).filter(Boolean);
      if(known.some(k=>!k[1])||known.some(k=>k[1][0]!==known[0][1][0])){bad.push(raw);continue}
      const row=known[0][1][0],[i0,[,x0]]=known[0];
      const dir=known.length>1?Math.sign(known[1][1][1]-x0)||1:1;
      const idx=parts.map((_,i)=>x0+dir*(i-i0));
      if(idx.some(i=>i<0||i>=row.length)||known.some(([i,[,x]])=>idx[i]!==x)){bad.push(raw);continue}
      const g=[];parts.forEach((p,i)=>{const t=row[idx[i]];teeth.add(t);bt.add(t);g.push(t);if(p==='X')px.add(t)});groups.push(g);
      continue;
    }
    bad.push(raw);
  }
  return {teeth:sortTeeth([...teeth]),pontics:sortTeeth([...px]),bridgeTeeth:sortTeeth([...bt]),bridgeGroups:groups,bad};
}
function applyTeeth(it,out){
  it.teeth=out.teeth;it.pontics=out.pontics;it.bridgeTeeth=out.bridgeTeeth;it.bridgeGroups=out.bridgeGroups;delete it.bridges;
  if(PER_TOOTH.has(it.name)&&!it.qtyManual){it.qty=it.teeth.filter(x=>!REGIONS.includes(x)).length||1;const u=unitOf(it);if(u)it.orig=u*it.qty}
}
// 象限：右上 q1、左上 q2、左下 q3、右下 q4
const REGION_Q={'全口':'q1','上顎':'q1','右上':'q1','左上':'q2','下顎':'q4','右下':'q4','左下':'q3'};
const quadOf=t=>REGION_Q[t]||{1:'q1',5:'q1',2:'q2',6:'q2',3:'q3',7:'q3',4:'q4',8:'q4'}[t[0]];
const CHART_ORDER=[...REGIONS,...UP,...UPP,...LO,...LOP];
// 每排（上顎／下顎）是一個輸入欄，依牙位圖由左到右排列（病患右側在左）；中間虛線只是輔助閱讀
const isUpperQ=t=>['q1','q2'].includes(quadOf(t));
function teethParts(it){
  const px=it.pontics||[],brs=calcBridges(bridgeTeethOf(it),px,it.bridgeGroups),inB=new Set(brs.flatMap(b=>b.teeth));
  const all=[...brs.map(b=>[b.teeth[0],bridgeStr(b)]),...it.teeth.filter(t=>!inB.has(t)).map(t=>[t,px.includes(t)?`${t}(X)`:t])]
    .sort((a,b)=>CHART_ORDER.indexOf(a[0])-CHART_ORDER.indexOf(b[0]));
  return {up:all.filter(([t])=>isUpperQ(t)).map(x=>x[1]).join(', '),lo:all.filter(([t])=>!isUpperQ(t)).map(x=>x[1]).join(', ')};
}
function teethLabel(it){const p=teethParts(it);return [p.up,p.lo].filter(Boolean).join(', ')}
// 輸入欄顯示的文字：無法辨識時保留原本打的字（相容舊格式）
function teethInputs(it){
  const v=it.teethText;if(v==null)return teethParts(it);
  if(typeof v==='string')return {up:v,lo:''};
  if('q1' in v)return {up:[v.q1,v.q2].filter(Boolean).join(', '),lo:[v.q4,v.q3].filter(Boolean).join(', ')};
  return v;
}

/* 牙位欄中線對齊：找出文字中病患右側（1、4、5、8 象限）與左側（2、3、6、7 象限）的交界，
   調整上下兩排的左內距，讓交界都落在同一條虛線上（虛線只是輔助閱讀，不分格） */
const SIDE_REGION={'右上':'R','右下':'R','左上':'L','左下':'L'};
const sideOf=t=>REGIONS.includes(t)?(SIDE_REGION[t]||null):('1458'.includes(t[0])?'R':'L');
function midSplit(text){ // 右側文字結束的位置、左側文字開始的位置（字元索引）
  let endR=null,startL=null;
  const addR=e=>{endR=Math.max(endR??0,e)},addL=s=>{startL=Math.min(startL??Infinity,s)};
  for(const m of String(text).matchAll(/[^,，、;；\s]+/g)){
    const tok=m[0],o=parseTeeth(tok);if(o.bad.length||!o.teeth.length)continue;
    const g=o.bridgeGroups[0];
    if(g){const els=[...tok.matchAll(/[0-9０-９]{2}|[XxｘＸ×✕]/g)];if(els.length!==g.length)continue;
      g.forEach((t,i)=>{const s=m.index+els[i].index;sideOf(t)==='R'?addR(s+els[i][0].length):addL(s)});}
    else{const sd=sideOf(o.teeth[0]);if(sd==='R')addR(m.index+tok.length);else if(sd==='L')addL(m.index)}

let measureCtx=null;
function textW(inp,s){measureCtx=measureCtx||document.createElement('canvas').getContext('2d');measureCtx.font=getComputedStyle(inp).font;return measureCtx.measureText(s).width}
function alignTeeth(cell){
  const PAD=6,MAX_FS=13,MIN_FS=7;
  for(const c of cell?[cell]:document.querySelectorAll('.teeth-cell')){
    const jaws=c.querySelector('.jaws'),line=c.querySelector('.midl'),ins=[...c.querySelectorAll('[data-k="teethIn"]')];if(!jaws||!line||!ins.length)continue;
    const W=ins[0].clientWidth;if(!W)continue;
    // 量出每排在中線左右各要多寬；放不下就縮小字體，直到兩排都能完整呈現
    let fsz=MAX_FS,rows;
    for(;;){
      ins.forEach(i=>i.style.fontSize=fsz+'px');
      rows=ins.map(i=>{const v=i.value,total=textW(i,v),{endR,startL}=midSplit(v);
        let mid=null;
        if((endR!=null||startL!=null)&&!(endR!=null&&startL!=null&&endR>startL)){ // 順序還沒整理好時先不對齊
          const a=endR!=null?textW(i,v.slice(0,endR)):null,b=startL!=null?textW(i,v.slice(0,startL)):null;
          mid=a!=null&&b!=null?(a+b)/2:a!=null?a+5:b-5;}
        return {total,mid}});
      const al=rows.filter(r=>r.mid!=null),L=Math.max(0,...al.map(r=>r.mid)),R=Math.max(0,...al.map(r=>r.total-r.mid));
      const need=Math.max(al.length?L+R:0,...rows.filter(r=>r.mid==null).map(r=>r.total))+2*PAD;
      if(need<=W||fsz<=MIN_FS)break;
      fsz-=0.5;
    }
    const al=rows.filter(r=>r.mid!=null),L=Math.max(0,...al.map(r=>r.mid)),R=Math.max(0,...al.map(r=>r.total-r.mid));
    let X=Math.max(W/2,PAD+L);if(X+R>W-PAD)X=Math.max(PAD+L,W-PAD-R);
    ins.forEach((i,k)=>{i.style.paddingLeft=rows[k].mid!=null?Math.max(0,X-rows[k].mid)+'px':''});
    const r0=ins[0].getBoundingClientRect(),rj=jaws.getBoundingClientRect();
    line.style.left=(r0.left-rj.left+ins[0].clientLeft+X-1)+'px';
  }
}
window.addEventListener('resize',()=>alignTeeth());
if(document.fonts)document.fonts.ready.then(()=>alignTeeth());

/* 治療項目下拉目錄：分層顯示（先選治療種類，展開後選項目）；輸入文字時改為搜尋結果；清單外的文字可當自訂項目 */
const combo={el:null,inp:null,opts:[],hi:-1,openCats:new Set(),q:''};
function comboOpen(inp){
  if(!combo.el){combo.el=document.createElement('div');combo.el.className='combo-pop';document.body.appendChild(combo.el);
    combo.el.addEventListener('mousedown',e=>{e.preventDefault();const o=e.target.closest('[data-i]');if(o)comboPick(+o.dataset.i)});}
  combo.inp=inp;
  // 打開時展開目前項目所屬的治療種類
  const cur=findItem(inp.value);combo.openCats=new Set(cur?[cur.cat]:[]);
}
function comboClose(){if(combo.el)combo.el.hidden=true;combo.inp=null;combo.hi=-1}
function comboFilter(showAll){
  const inp=combo.inp;if(!inp)return;
  const raw=inp.value.trim(),q=showAll?'':raw.toLowerCase().replace(/\s+/g,'');combo.q=q;
  const m=s=>s.toLowerCase().replace(/\s+/g,'').includes(q);

  if(!q){ // 分層：治療種類 → 項目
    for(const [cat,list] of CATS){const open=combo.openCats.has(cat);
      opt({cat,toggle:true},`<span class="arr">${open?'▾':'▸'}</span>${esc(cat)}<span class="cnt">${list.length}</span>`,'combo-opt combo-cat'+(open?' open':''));
      if(open)for(const n of list)opt({cat,name:n},esc(n),'combo-opt combo-sub'+(n===raw?' sel':''));
    }
  }else{ // 搜尋：符合的項目，依治療種類分組
    for(const [cat,list] of CATS){const hit=m(cat)?list:list.filter(m);if(!hit.length)continue;
      h+=`<div class="combo-grp">${esc(cat)}</div>`;
      for(const n of hit)opt({cat,name:n},esc(n),'combo-opt combo-sub'+(n===raw?' sel':''));}
    if(raw&&!findItem(raw)){h+=`<div class="combo-grp">其他</div>`;opt({custom:raw},`自訂項目：「${esc(raw)}」`,'combo-opt combo-sub')}

function comboPlace(){

  Object.assign(combo.el.style,{left:r.left+'px',minWidth:Math.max(r.width,240)+'px',maxHeight:Math.max(160,Math.min(380,below>240?below-12:r.top-12))+'px'});
  if(below>240||below>=r.top){combo.el.style.top=r.bottom+2+'px';combo.el.style.bottom=''}else{combo.el.style.top='';combo.el.style.bottom=(innerHeight-r.top+2)+'px'}

function comboHi(){combo.el.querySelectorAll('[data-i]').forEach(o=>o.classList.toggle('on',+o.dataset.i===combo.hi));
  const o=combo.el.querySelector('[data-i].on');if(o)o.scrollIntoView({block:'nearest'})}
function comboToggle(cat,open){
  const was=combo.openCats.has(cat);if(open===undefined)open=!was;if(open===was)return;

$('#main').addEventListener('pointerdown',e=>{
  const h=e.target.closest('.drag-handle');if(!h||e.button>0)return;
  const p=cur();if(!p||p.status!=='open'||p.finalized||!canEdit())return;
  const tbody=h.closest('tbody'),src=h.closest('tr'),rows=[...tbody.querySelectorAll('tr[data-list="items"]')];if(rows.length<2)return;
  e.preventDefault();try{h.setPointerCapture(e.pointerId)}catch(_){}
  src.classList.add('dragging');let target=null,after=false;
  const clear=()=>rows.forEach(r=>r.classList.remove('drop-before','drop-after'));
  const move=ev=>{
    clear();target=null;
    for(const r of rows){const b=r.getBoundingClientRect();if(ev.clientY>=b.top&&ev.clientY<=b.bottom){target=r;after=ev.clientY>b.top+b.height/2;break}}
    if(!target){const f=rows[0].getBoundingClientRect(),l=rows[rows.length-1].getBoundingClientRect();
      if(ev.clientY<f.top){target=rows[0];after=false}else if(ev.clientY>l.bottom){target=rows[rows.length-1];after=true}}
    if(target&&target!==src)target.classList.add(after?'drop-after':'drop-before');
  };
  const up=()=>{
    h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
    clear();src.classList.remove('dragging');
    if(!target||target===src)return;
    const it=p.items.find(x=>x.id===src.dataset.id);p.items.splice(p.items.indexOf(it),1);
    const ti=p.items.findIndex(x=>x.id===target.dataset.id);p.items.splice(after?ti+1:ti,0,it);
    touch();renderEditor();
  };
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});

function shrink(file,max=1600,q=.78){

// 醫師支出助理獎金(月)：該月結單（費用收訖／計畫變更）的計劃單，依治療種類拆列；金額＝該種類的實際已繳金額（依繳費紀錄選的項目分類，

const COMM_CATS=[...CATS.map(c=>c[0]),'其他'];

const commCfg=cat=>{const v=(settings.commission||{})[cat];if(v==null||v==='')return {type:'pct',v:0};return typeof v==='object'?{type:v.type==='amt'?'amt':'pct',v:Number(v.v)||0}:{type:'pct',v:Number(v)||0}};

// 個別項目抽成（優先於種類設定）：{type:'pct',v:%} 或 {type:'unit',v:每單位元}；舊資料存數字時視為每單位元
const itemCommCfg=name=>{const v=(settings.itemComm||{})[name];if(v==null||v==='')return null;return typeof v==='object'?{type:v.type==='unit'?'unit':'pct',v:Number(v.v)||0}:{type:'unit',v:Number(v)||0}};

function closedRows(ym,doc,asst){
  const rows=[];
  for(const p of plans.values()){
    if(doc&&((p.doctor||'').trim()||'（未填）')!==doc)continue;
    if(asst&&((p.assistant||'').trim()||'（未填）')!==asst)continue;
    if(isOrthoPlan(p)){ // 矯正療程單：第一次繳費的月份列一筆，每單固定抽成（含分析項目每單位抽成）；由前單轉入的延續單已在前單計過，不再計
      const fp=firstPay(p);if(!fp||fp.date.slice(0,7)!==ym||(p.payments||[]).some(x=>x.transfer&&x.amount>0))continue;
      const comm=orthoPlanComm(); // 矯正療程單只計這一次（每單固定），結單時不另計
      rows.push({date:fp.date,kind:'矯正首次繳費',name:p.name||'',chartNo:p.chartNo||'',cat:'矯正',teeth:p.items.filter(i=>i.teeth.length).map(teethLabel).join('；'),amount:fp.amount,
        assistant:p.assistant||'',doctor:p.doctor||'',rate:`矯正療程 $${money(orthoPlanComm())}／單`,comm,planId:p.id});
      continue;
    }
    if(!['paid','changed'].includes(p.status)||(p.closedAt||'').slice(0,7)!==ym)continue;
    // by：各種類已繳總額；rest：沒有個別項目設定的部分（套用種類設定）；itemPaid：有個別項目設定的項目各自已繳
    const by=new Map(),rest=new Map(),itemPaid=new Map();
    for(const x of p.payments||[]){
      if(x.transfer||!x.amount)continue;
      const it=p.items.find(i=>i.id===x.itemId);
      const cat=it&&!it.custom&&COMM_CATS.includes(it.cat)?it.cat:'其他';
      by.set(cat,(by.get(cat)||0)+x.amount);
      if(it&&!it.custom&&itemCommCfg(it.name))itemPaid.set(it,(itemPaid.get(it)||0)+x.amount);

    }

      // 抽成＝各項目設定加總（% ＝該項目已繳 × 比例；元/單位＝數量 × 金額，該項目已繳大於 0 才計）
      let comm=0; // 只依各項目設定；沒有設定的項目、自訂項目、未選項目不抽成
      for(const [it,paid] of itemPaid){if(it.cat!==cat)continue;const c=itemCommCfg(it.name);comm+=c.type==='pct'?Math.round(paid*c.v/100):(paid>0?c.v*(it.qty||1):0)}

}

// 助理業績統計(月)：依計劃單的責任助理
//  - 矯正類：比照「醫師支出助理獎金(月)」的矯正獎金（療程單第一次繳費當月每單固定、分析等依項目設定）
//  - 其他：當月有結單（費用收訖／計畫變更）的計劃單，計該單總金額＝實際已繳（不含前單轉入，已算給前單的負責助理），不計抽成
function perfRows(ym,asst){
  const who=p=>(p.assistant||'').trim()||'（未填）',rows=[];
  // 矯正獎金：沿用醫師支出助理獎金的計算
  for(const r of closedRows(ym,'',asst))if(r.cat==='矯正'&&r.comm)rows.push({date:r.date,asst:(r.assistant||'').trim()||'（未填）',name:r.name,chartNo:r.chartNo,kind:r.kind==='矯正首次繳費'?'矯正首次繳費':'矯正（'+r.kind+'）',amount:0,bonus:r.comm,planId:r.planId});
  for(const p of plans.values()){
    if(!['paid','changed'].includes(p.status)||(p.closedAt||'').slice(0,7)!==ym)continue;
    if(asst&&who(p)!==asst)continue;
    if(isOrthoPlan(p))continue;
    let amt=0,n=0;
    for(const x of p.payments||[]){
      if(x.transfer||!x.amount)continue;
      const it=p.items.find(i=>i.id===x.itemId);if(it&&isOrthoItem(it))continue; // 矯正類只算獎金
      amt+=x.amount;n++;
    }
    if(!n)continue;
    rows.push({date:(p.closedAt||'').slice(0,10),asst:who(p),name:p.name||'',chartNo:p.chartNo||'',kind:p.status==='paid'?'結單－費用收訖':'結單－計畫變更',amount:amt,bonus:0,planId:p.id});
  }
  return rows.sort((a,b)=>a.asst.localeCompare(b.asst,'zh-Hant')||a.date.localeCompare(b.date));
}
function perfHtml(ym,asst){
  const rows=perfRows(ym,asst);
  if(!rows.length)return '<p class="hint">這個月沒有資料。</p>';
  const by=new Map();rows.forEach(r=>{if(!by.has(r.asst))by.set(r.asst,{asst:r.asst,closed:0,amount:0,ortho:0,bonus:0});const s=by.get(r.asst);if(r.bonus){s.ortho++;s.bonus+=r.bonus}else{s.closed++;s.amount+=r.amount}});
  const sum=[...by.values()].sort((a,b)=>b.amount-a.amount||b.bonus-a.bonus),T=sum.reduce((a,s)=>({closed:a.closed+s.closed,amount:a.amount+s.amount,ortho:a.ortho+s.ortho,bonus:a.bonus+s.bonus}),{closed:0,amount:0,ortho:0,bonus:0});
  return `<table class="st-tbl"><thead><tr><th>責任助理</th><th class="num">結單件數</th><th class="num">結單總金額</th><th class="num">矯正件數</th><th class="num">矯正獎金</th></tr></thead><tbody>

    <h4 style="margin-top:14px">明細</h4>
    <table class="st-tbl inc-tbl"><thead><tr><th>日期</th><th>責任助理</th><th>姓名</th><th>病歷號</th><th>類別</th><th class="num">結單總金額</th><th class="num">矯正獎金</th></tr></thead><tbody>
      ${rows.map(r=>`<tr data-st-plan="${esc(r.planId)}" title="點一下打開這張計劃單"><td>${esc(r.date)}</td><td>${esc(r.asst)}</td><td>${esc(r.name)}</td><td>${esc(r.chartNo)}</td><td>${esc(r.kind)}</td><td class="num ${r.amount<0?'refund':''}">${r.bonus?'':'$'+money(r.amount)}</td><td class="num">${r.bonus?'$'+money(r.bonus):''}</td></tr>`).join('')}
    </tbody></table>`;
}

      if(t.dataset.orthocomm!==undefined){settings.orthoPlanComm=Math.max(0,Math.round(Number(t.value)||0));saveSettings()}
      if(t.dataset.icv!==undefined||t.dataset.ictype!==undefined){ // 各項目抽成
        const n=t.dataset.icv??t.dataset.ictype,row=t.closest('.comm-row'),type=row.querySelector('[data-ictype]').value,raw=row.querySelector('[data-icv]').value;
        settings.itemComm=settings.itemComm||{};
        if(raw==='')delete settings.itemComm[n];
        else{let v=Math.max(0,Number(raw)||0);v=type==='pct'?Math.min(100,v):Math.round(v);settings.itemComm[n]={type,v}}
        row.querySelector('[data-icv]').step=type==='unit'?1:0.1;saveSettings()}
      if(t.dataset.comm!==undefined||t.dataset.commtype!==undefined){ // 抽成：數值與單位（% / 元）
        const cat=t.dataset.comm??t.dataset.commtype,row=t.closest('.comm-row'),type=row.querySelector('[data-commtype]').value,raw=row.querySelector('[data-comm]').value;
        settings.commission=settings.commission||{};
        if(raw==='')delete settings.commission[cat];
        else{let v=Math.max(0,Number(raw)||0);if(type==='pct')v=Math.min(100,v);else v=Math.round(v);settings.commission[cat]={type,v}}
        row.querySelector('[data-comm]').step=type==='amt'?1:0.1;saveSettings()}
      if(t.dataset.price){const v=numOrNull(t.value);if(v)P[t.dataset.price]=v;else delete P[t.dataset.price];saveSettings()}
      if(t.dataset.listSet){settings[t.dataset.listSet]=t.value.split('\n').map(s=>s.trim()).filter(Boolean);saveSettings()}});
    box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.tab)show(b.dataset.tab);
      if(b.dataset.devx)deviceAction(b.closest('[data-dev]').dataset.dev,b.dataset.devx);
      if(b.dataset.x==='close'){close();renderEditor()}
      if(b.dataset.x==='export')exportBackup();
      if(b.dataset.x==='import'){$('#importInput').value='';$('#importInput').click()}});
  },true);
}
async function exportBackup(){
  // 備份檔把雲端照片一併放進去（換電腦或匯入本機模式都看得到）
  const list=JSON.parse(JSON.stringify([...plans.values()]));
  try{for(const p of list)for(const r of p.receipts||[])for(let i=0;i<r.photos.length;i++)r.photos[i]=await DB.getFile(r.photos[i])}catch(e){alert('讀取照片失敗，備份檔可能缺少部分照片')}
  const data={app:'xinhai-treatment-plan',version:1,exportedAt:new Date().toISOString(),settings,plans:list};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download=`治療計劃單備份_${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
$('#importInput').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=='xinhai-treatment-plan'||!Array.isArray(d.plans))throw 0;
    if(!canEdit()){alert('沒有權限匯入');return}
    const dup=d.plans.filter(p=>plans.has(p.id)).length;
    if(!confirm(`備份檔含 ${d.plans.length} 張計劃單（其中 ${dup} 張與現有資料相同編號，將以備份檔覆蓋）。${canPrice()?'\n價目表與人員名單也會以備份檔取代。':''}\n確定匯入？`))return;
    for(const p of d.plans){freezeUnits(p);plans.set(p.id,p);await DB.put(p)}
    if(d.settings&&canPrice()){settings={...settings,...d.settings};await saveSettings()}
    alert('匯入完成');document.querySelector('.modal-bg')?.remove();renderList();renderEditor();
  }catch(err){alert('這不是有效的治療計劃單備份檔')}
});

/* ====== 認證設備：不用 Google 登入的平板等（匿名登入 → 申請 → 超級管理員核准）====== */
let tpDevices=[];
const devCode=uid=>uid.slice(-6).toUpperCase();
async function deviceApply(){
  try{await firebase.auth().signInAnonymously()} // 之後由 onAuthStateChanged 接手（顯示申請表）
  catch(e){showGate('error',e.code==='auth/operation-not-allowed'?'Firebase 尚未啟用「匿名」登入方式，請管理者到 Firebase 主控台 → Authentication → 登入方式 啟用「匿名」。':'無法連線：'+(e.code||e.message))}
}
async function handleDevice(u){
  const ref=fs.doc('tpDevices/'+u.uid);let d=null;
  try{const s=await ref.get();d=s.exists?s.data():null}catch(e){console.error(e)}
  const g=$('#gate'),msg=$('#gateMsg'),acts=$('#gateActs');g.hidden=false;
  if(!d){
    msg.innerHTML=`申請把這台設備設為「認證設備」。<br>核准後開啟本頁不需要 Google 登入，可以開單、編輯，只能刪除未定案的單。<br>設備代碼：<span class="who">${devCode(u.uid)}</span>`;
    acts.innerHTML=`<input id="devName" placeholder="設備名稱，例如：櫃台平板" style="width:100%;margin:6px 0"><br><button class="btn-primary" id="devSend">送出申請</button> <button id="devCancel">改用 Google 登入</button>`;
    $('#devCancel').onclick=signOut;
    $('#devSend').onclick=async()=>{
      const name=$('#devName').value.trim();if(!name){alert('請輸入設備名稱');return}
      $('#devSend').disabled=true;
      try{await ref.set({name,code:devCode(u.uid),approved:false,reqAt:Date.now(),ua:navigator.userAgent.slice(0,200)});handleDevice(u)}
      catch(e){alert('申請失敗：'+(e.code||e.message));$('#devSend').disabled=false}
    };
    return;
  }
  if(!d.approved){
    msg.innerHTML=`已送出設備認證申請（<span class="who">${esc(d.name)}</span>）。<br>請超級管理員到「⚙ → 設備認證」核准，設備代碼：<span class="who">${devCode(u.uid)}</span><br>核准後本頁會自動開啟。`;
    acts.innerHTML='<button id="devCancel">改用 Google 登入</button>';$('#devCancel').onclick=signOut;
    ref.onSnapshot(s=>{if(s.exists&&s.data().approved)location.reload()},()=>{});
    return;
  }
  PERM='device';me='設備：'+d.name;
  // 被撤銷或刪除時立刻停用
  ref.onSnapshot(s=>{if(!s.exists||!s.data().approved)location.reload()},()=>location.reload());
  startCloud();
}
function watchDevices(){
  if(PERM!=='super')return;
  fs.collection('tpDevices').onSnapshot(snap=>{
    tpDevices=snap.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>(a.approved-b.approved)||(b.reqAt||0)-(a.reqAt||0));
    const pane=document.querySelector('.modal [data-pane="device"]');if(pane)pane.innerHTML=devicePane();
    const btn=$('#settingsBtn');const n=tpDevices.filter(x=>!x.approved).length;btn.textContent='⚙ 價目表／人員／備份'+(n?`（設備待核准 ${n}）`:'');
  },e=>console.warn(e));
}
function devicePane(){
  const fmt=t=>t?new Date(t).toLocaleString('zh-TW',{hour12:false}):'';
  return `<p class="hint">認證設備開啟本頁不需要 Google 登入，可以看所有計劃單、開單與編輯（含繳費、收據），只能刪除未定案的單，不能修改價目表。設備在登入畫面按「這台設備申請認證」後會出現在這裡。</p>
  ${tpDevices.length?`<table><thead><tr><th>設備名稱</th><th>代碼</th><th>申請時間</th><th>狀態</th><th></th></tr></thead><tbody>${tpDevices.map(d=>`<tr data-dev="${esc(d.uid)}">
    <td>${esc(d.name)}</td><td>${esc(d.code||devCode(d.uid))}</td><td>${esc(fmt(d.reqAt))}</td>
    <td>${d.approved?`<span class="chip paid">已核准</span><div class="hint">${esc(d.approvedBy||'')} ${esc(fmt(d.approvedAt))}</div>`:'<span class="chip open">待核准</span>'}</td>
    <td style="white-space:nowrap">${d.approved?'<button class="btn-sm" data-devx="revoke">撤銷</button>':'<button class="btn-sm btn-primary" data-devx="ok">核准</button>'} <button class="btn-sm btn-danger" data-devx="del">刪除</button></td>
  </tr>`).join('')}</tbody></table>`:'<p class="hint">目前沒有設備申請。</p>'}`;
}
async function deviceAction(uid,act){
  const d=tpDevices.find(x=>x.uid===uid);if(!d)return;
  try{
    if(act==='ok'){if(!confirm(`核准設備「${d.name}」（代碼 ${d.code||devCode(uid)}）？\n核准後這台設備不需登入即可查看、開立與編輯治療計劃單。`))return;
      await fs.doc('tpDevices/'+uid).update({approved:true,approvedBy:me,approvedAt:Date.now()})}
    if(act==='revoke'){if(!confirm(`撤銷設備「${d.name}」的認證？撤銷後該設備會立刻無法使用，需重新核准。`))return;
      await fs.doc('tpDevices/'+uid).update({approved:false,revokedBy:me,revokedAt:Date.now()})}
    if(act==='del'){if(!confirm(`刪除設備「${d.name}」？該設備需要重新申請認證。`))return;
      await fs.doc('tpDevices/'+uid).delete()}
  }catch(e){alert('操作失敗：'+(e.code==='permission-denied'?'沒有權限（請確認安全規則已更新）':e.message))}
}

/* ====== 啟動：Google 登入 → 權限（沿用排班系統）→ 雲端即時同步 ====== */
let staffNames={doctor:[],assistant:[]};
const PERM_LABEL={view:'僅檢視',self:'一般編輯',manage:'排班管理',super:'超級管理員',device:'認證設備'};
function showGate(kind,email){
  const g=$('#gate'),msg=$('#gateMsg'),acts=$('#gateActs');g.hidden=false;
  if(kind==='loading'){msg.textContent='連線中…';acts.innerHTML='';return}
  if(kind==='signin'){
    msg.textContent=/FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent)?'App 內建的瀏覽器無法使用 Google 登入，請點右上角「⋯」選擇用 Safari 或 Chrome 開啟。':'請用 Google 帳號登入（與排班系統相同的帳號）。';
    acts.innerHTML='<button class="btn-primary" id="gSignIn">使用 Google 登入</button><div style="margin-top:14px"><button class="btn-sm btn-ghost" id="gDevice">這台設備申請認證（免登入）</button></div>';$('#gSignIn').onclick=signIn;$('#gDevice').onclick=deviceApply;return;
  }
  if(kind==='error'){msg.textContent=email;acts.innerHTML='<button id="gReload">重新整理</button>';$('#gReload').onclick=()=>location.reload();return}
  msg.innerHTML=kind==='suspended'?`你的帳號 <span class="who">${esc(email)}</span> 已被停權，無法使用本系統。`
    :`你的帳號 <span class="who">${esc(email)}</span> 還沒開通。<br>請把這個 Gmail 交給診所管理者，在排班系統「人員名單」綁定登入帳號。`;
  acts.innerHTML='<button id="gOther">改用其他帳號登入</button>';$('#gOther').onclick=signOut;
}
async function signIn(){
  const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
  try{await firebase.auth().signInWithPopup(pr)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-environment')return firebase.auth().signInWithRedirect(pr);
    if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('登入失敗：'+e.message);
  }
}
async function signOut(){if(PERM==='device'&&!confirm('退出設備模式？\n退出後這台設備需要重新申請認證、由超級管理員核准。'))return;flushPending();if(window.firebase&&firebase.apps.length)await firebase.auth().signOut();location.reload()}
$('#signOutBtn').addEventListener('click',signOut);
function afterLogin(){
  $('#gate').hidden=true;
  $('#me').hidden=!fs;$('#meEmail').textContent=me;$('#mePerm').textContent=PERM_LABEL[PERM]||PERM;
  $('#signOutBtn').textContent=PERM==='device'?'退出設備模式':'登出';
  $('#newBtn').hidden=!canEdit();
  renderList();renderEditor();
}
// 本機模式（開發測試）
async function bootLocal(){
  const m=location.search.match(/[?&]perm=(view|self|manage|super)/);PERM=m?m[1]:'super';
  try{await LocalDB.open()}catch(e){$('#main').innerHTML='<div class="empty">此瀏覽器無法使用本機資料庫（可能是無痕模式），資料將無法保存。</div>';return}
  const s=await LocalDB.get('settings');if(s)settings={...settings,...s};
  migrateCatComm();
  (await LocalDB.all()).forEach(p=>plans.set(p.id,freezeUnits(p)));
  afterLogin();
}
// 雲端模式
function bootCloud(){
  if(!window.firebase){showGate('error','無法載入登入元件，請確認網路連線後重新整理。');return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  fs=firebase.firestore();fs.settings({ignoreUndefinedProperties:true,merge:true});
  // 登入狀態（含認證設備的匿名身分）預設就長期保存在這台電腦（Firebase 網頁版預設 LOCAL），關機、重開瀏覽器都不用重新登入／認證。
  // 注意：不要在這裡呼叫 setPersistence()，會讓「整頁跳轉」方式登入回來時的結果遺失，造成登入失敗。
  // 請瀏覽器把本站資料列為「持續保存」，避免空間不足時被自動清掉（清掉的話設備就要重新申請認證）
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  showGate('loading');
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){showGate('signin');return}
    if(u.isAnonymous){handleDevice(u);return}  // 認證設備
    me=(u.email||'').toLowerCase();
    const owner=(window.OWNER_EMAILS||[]).some(x=>x.toLowerCase()===me);
    let acc=null;try{const s=await fs.doc('access/'+me).get();acc=s.exists?s.data():null}catch(e){console.error(e)}
    if(!owner&&!acc){showGate('pending',me);fs.doc('access/'+me).onSnapshot(s=>{if(s.exists)location.reload()},()=>{});return}
    if(!owner&&acc.perm==='suspended'){showGate('suspended',me);return}
    PERM=owner?'super':(acc.perm||'view');
    startCloud();
  });
}
let stale=false,firstSnap=true;
function rerenderKeep(){const y=scrollY;renderEditor();scrollTo(0,y)}
function startCloud(){
  afterLogin();watchDevices();$('#planList').innerHTML='<div class="empty" style="padding:30px 10px">載入中…</div>';
  const onErr=e=>{console.error(e);if(e.code==='permission-denied')showGate('error','沒有權限讀取治療計劃單。請確認 Firestore 安全規則已更新，或洽診所管理者。')};
  fs.collection('tpPlans').onSnapshot(snap=>{
    let curChanged=false;
    snap.docChanges().forEach(ch=>{
      const id=ch.doc.id;
      if(ch.type==='removed'){if(plans.delete(id)&&id===curId)curChanged=true;return}
      if(ch.doc.metadata.hasPendingWrites)return;              // 自己剛寫入、還沒送到伺服器
      let p;try{p=freezeUnits(JSON.parse(ch.doc.data().json))}catch(e){return}
      const local=plans.get(id);
      if(local&&pendingP===local)return;                        // 這張正在編輯、還沒存
      if(local&&(local.updatedAt||0)>=(p.updatedAt||0))return; // 本機已是最新
      plans.set(id,p);if(id===curId)curChanged=true;
    });
    renderList();
    if(curChanged){
      if(!plans.has(curId)){curId=null;renderEditor()}
      else if(document.activeElement&&$('#main').contains(document.activeElement)&&document.activeElement.matches('input,textarea,select'))stale=true; // 打字中先不重畫
      else rerenderKeep();
    }
    if(firstSnap){firstSnap=false;checkLocalMigration()}
  },onErr);
  fs.doc('tpConfig/settings').onSnapshot(s=>{
    if(s.exists){try{settings={prices:{},doctors:[],assistants:[],...JSON.parse(s.data().json)}}catch(e){}}
    migrateCatComm();
  },e=>console.warn(e));
  fs.collection('staff').onSnapshot(snap=>{
    const n={doctor:[],assistant:[]};
    // 排序與排班系統人員名單相同（依代號）
    snap.docs.map(d=>d.data()).filter(v=>v.active!==false&&n[v.role]&&v.name)
      .sort((a,b)=>(a.code||a.name||'').localeCompare(b.code||b.name||'','zh-Hant',{numeric:true}))
      .forEach(v=>n[v.role].push(v.name));
    staffNames=n;
    // 名單更新時，換掉畫面上的選單內容
    const sh=$('#main .sheet');if(sh){sh.querySelectorAll('datalist').forEach(x=>x.remove());sh.insertAdjacentHTML('afterbegin',datalists())}
  },e=>console.warn(e));
}
// 別人改了正在看的這張單：等目前的輸入欄離開焦點再更新畫面
$('#main').addEventListener('focusout',()=>setTimeout(()=>{if(stale&&!(document.activeElement&&$('#main').contains(document.activeElement))){stale=false;rerenderKeep()}},200));
// 舊的本機資料（雲端化以前存在這台電腦的計劃單）一鍵上傳
async function checkLocalMigration(){
  if(!canEdit())return;
  try{await LocalDB.open()}catch(e){return}
  const loc=(await LocalDB.all()).filter(p=>!plans.has(p.id));
  const ls=await LocalDB.get('settings');
  const needPrices=canPrice()&&ls&&Object.keys(ls.prices||{}).length&&!Object.keys(settings.prices||{}).length;
  if(!loc.length&&!needPrices)return;
  const b=$('#localBanner');
  b.innerHTML=`<div class="local-banner"><span>這台電腦有 ${loc.length} 張舊的本機計劃單${needPrices?'與價目表':''}還沒上傳到雲端。</span><button class="btn-sm" id="migBtn">上傳到雲端</button></div>`;
  $('#migBtn').onclick=async()=>{
    if(!confirm(`把這台電腦的 ${loc.length} 張計劃單${needPrices?'與價目表':''}上傳到雲端？上傳後會從這台電腦的本機資料移除。`))return;
    $('#migBtn').disabled=true;$('#migBtn').textContent='上傳中…';
    try{
      for(const p of loc){freezeUnits(p);await DB.put(p);plans.set(p.id,p);await LocalDB.del(p.id)}
      if(needPrices){settings={...settings,...ls};await DB.saveSettings()}
      b.innerHTML='';renderList();alert('上傳完成');
    }catch(e){console.error(e);alert('上傳失敗：'+(e.code==='permission-denied'?'沒有權限':e.message));$('#migBtn').disabled=false;$('#migBtn').textContent='上傳到雲端'}
  };
}
if(window.FIREBASE_CONFIG)bootCloud();else bootLocal();
</script>
</body>
</html>
