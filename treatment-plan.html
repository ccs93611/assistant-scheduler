function showGate(kind,email){
  const g=$('#gate'),msg=$('#gateMsg'),acts=$('#gateActs');g.hidden=false;
  if(kind==='loading'){msg.textContent='連線中…';acts.innerHTML='';return}
  if(kind==='signin'){
    msg.textContent=/FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent)?'App 內建的瀏覽器無法使用 Google 登入，請點右上角「⋯」選擇用 Safari 或 Chrome 開啟。':'請用 Google 帳號登入（與排班系統相同的帳號）。';
    acts.innerHTML='<button class="btn-primary" id="gSignIn">使用 Google 登入</button><div style="margin-top:14px"><button class="btn-sm btn-ghost" id="gDevice">這台設備申請認證（免登入）</button></div>';$('#gSignIn').onclick=signIn;$('#gDevice').onclick=deviceApply;return;
  }
  if(kind==='error'){msg.textContent=email;acts.innerHTML='<button id="gReload">重新整理</button>';$('#gReload').onclick=()=>location.reload();return}
  msg.innerHTML=kind==='suspended'?`你的帳號 <span class="who">${esc(email)}</span> 已被停權，無法使用本系統。`
    :`你的帳號 <span class="who">${esc(email)}</span> 還沒開通。<br>請把這個 Gmail 交給診所管理者，在排班系統「人員名單」綁定登入帳號。`;
  acts.innerHTML='<button id="gOther">改用其他帳號登入</button>';$('#gOther').onclick=signOut;
}
async function signIn(){
  const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});
  try{await firebase.auth().signInWithPopup(pr)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-environment')return firebase.auth().signInWithRedirect(pr);
    if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('登入失敗：'+e.message);
  }
}
async function signOut(){if(PERM==='device'&&!confirm('退出設備模式？\n退出後這台設備需要重新申請認證、由超級管理員核准。'))return;flushPending();if(window.firebase&&firebase.apps.length)await firebase.auth().signOut();location.reload()}
$('#signOutBtn').addEventListener('click',signOut);
function afterLogin(){
  $('#gate').hidden=true;
  $('#me').hidden=!fs;$('#meEmail').textContent=me;$('#mePerm').textContent=PERM_LABEL[PERM]||PERM;
  $('#signOutBtn').textContent=PERM==='device'?'退出設備模式':'登出';
  $('#newBtn').hidden=!canEdit();
  renderList();renderEditor();
}
// 本機模式（開發測試）
async function bootLocal(){
  const m=location.search.match(/[?&]perm=(view|self|manage|super)/);PERM=m?m[1]:'super';
  try{await LocalDB.open()}catch(e){$('#main').innerHTML='<div class="empty">此瀏覽器無法使用本機資料庫（可能是無痕模式），資料將無法保存。</div>';return}
  const s=await LocalDB.get('settings');if(s)settings={...settings,...s};
  migrateCatComm();rebuildCats();
  (await LocalDB.all()).forEach(p=>plans.set(p.id,freezeUnits(p)));
  afterLogin();
}
// 雲端模式
function bootCloud(){
  if(!window.firebase){showGate('error','無法載入登入元件，請確認網路連線後重新整理。');return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  fs=firebase.firestore();fs.settings({ignoreUndefinedProperties:true,merge:true});
  // 登入狀態（含認證設備的匿名身分）預設就長期保存在這台電腦（Firebase 網頁版預設 LOCAL），關機、重開瀏覽器都不用重新登入／認證。
  // 注意：不要在這裡呼叫 setPersistence()，會讓「整頁跳轉」方式登入回來時的結果遺失，造成登入失敗。
  // 請瀏覽器把本站資料列為「持續保存」，避免空間不足時被自動清掉（清掉的話設備就要重新申請認證）
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  showGate('loading');
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){showGate('signin');return}
    if(u.isAnonymous){handleDevice(u);return}  // 認證設備
    me=(u.email||'').toLowerCase();
    const owner=(window.OWNER_EMAILS||[]).some(x=>x.toLowerCase()===me);
    let acc=null;try{const s=await fs.doc('access/'+me).get();acc=s.exists?s.data():null}catch(e){console.error(e)}
    if(!owner&&!acc){showGate('pending',me);fs.doc('access/'+me).onSnapshot(s=>{if(s.exists)location.reload()},()=>{});return}
    if(!owner&&acc.perm==='suspended'){showGate('suspended',me);return}
    PERM=owner?'super':(acc.perm||'view');
    startCloud();
  });
}
let stale=false,firstSnap=true;
function rerenderKeep(){const y=scrollY;renderEditor();scrollTo(0,y)}
const addPlanDoc=d=>{let p;try{p=freezeUnits(JSON.parse(d.data().json))}catch(e){return null}const l=plans.get(d.id);if(!l||(l.updatedAt||0)<(p.updatedAt||0))plans.set(d.id,p);return plans.get(d.id)};
// 讀進全部計劃單（統計需要時、或在設定按「補舊單欄位」時）；順便替還沒有搜尋欄位的舊單補上
function ensureAllLoaded(){
  if(!fs||allLoaded)return Promise.resolve();
  return allLoading||(allLoading=fs.collection('tpPlans').get().then(snap=>{
    const ups=[];snap.docs.forEach(d=>{const p=addPlanDoc(d);if(p&&canEdit()&&d.data().createdDay===undefined)ups.push(d.ref.update(idxFields(p)))});
    allLoaded=true;renderList();
    if(canPrice()&&settings.idxV!==IDX_V)Promise.all(ups).then(()=>{settings.idxV=IDX_V;saveSettings()}).catch(()=>{});
  }).catch(e=>{allLoading=null;alert('載入舊單失敗：'+e.message)}));
}
// 統計某個月份：只讀「該月有繳費」或「該月結單」的單（舊單還沒補好欄位時，改成讀全部）
const loadedMonths=new Map();
function loadMonth(ym){
  if(!fs||allLoaded||!ym)return Promise.resolve();
  if(settings.idxV!==IDX_V)return ensureAllLoaded();
  if(!loadedMonths.has(ym)){const col=fs.collection('tpPlans');
    loadedMonths.set(ym,Promise.all([col.where('payMonths','array-contains',ym).get(),col.where('closedYm','==',ym).get()])
      .then(sn=>{sn.forEach(x=>x.docs.forEach(addPlanDoc));renderList()}).catch(e=>{loadedMonths.delete(ym);alert('讀取統計資料失敗：'+e.message)}))}
  return loadedMonths.get(ym);
}
// 「無繳費且過期比例」：開始、結束日期都選好才讀，只讀開立日期在區間內的單（舊單還沒補好欄位時讀全部）
const loadedRanges=new Map();
function loadRange(from,to){
  if(!fs||allLoaded)return Promise.resolve();
  if(!from||!to)return Promise.resolve();
  if(settings.idxV!==IDX_V)return ensureAllLoaded();
  const k=from+'|'+to;
  if(!loadedRanges.has(k)){const q=fs.collection('tpPlans').where('createdDay','>=',from).where('createdDay','<=',to);
    loadedRanges.set(k,q.get().then(sn=>{sn.docs.forEach(addPlanDoc);renderList()}).catch(e=>{loadedRanges.delete(k);alert('讀取統計資料失敗：'+e.message)}))}
  return loadedRanges.get(k);
}
// 載入 n 個月內有異動的舊單（n 記在這台設備）；已載入過更長的月數就不重讀
const oldMonths=()=>{try{return +localStorage.getItem('tpOldMonths')||3}catch(e){return 3}}; // 預設 3 個月
let loadedBackN=0;
async function loadMonthsBack(n){
  if(!fs||allLoaded||n<=loadedBackN)return -1;
  const sn=await fs.collection('tpPlans').where('updatedAt','>=',Date.now()-n*30.44*864e5).get().catch(e=>{alert('載入舊單失敗：'+e.message);return null});
  if(!sn)return -1;const before=plans.size;sn.docs.forEach(addPlanDoc);loadedBackN=n;renderList();return plans.size-before;
}
// 雲端搜尋舊單：姓名開頭、病歷號開頭、單號開頭
async function searchOld(q){
  if(!fs)return 0;q=q.trim();if(!q)return 0;
  const end=q+'',col=fs.collection('tpPlans');
  const snaps=await Promise.all(['name','chartNo','no'].map(k=>col.where(k,'>=',q).where(k,'<=',end).limit(50).get()));
  let n=0;snaps.forEach(sn=>sn.docs.forEach(d=>{if(addPlanDoc(d))n++}));renderList();return n;
}
// 打開的單連到還沒讀進來的前單／新單（計畫變更），補讀那一張
async function ensureLinked(p){
  if(!fs||!p)return;let got=false;
  for(const id of [p.prevId,p.nextId])if(id&&!plans.has(id)){try{const d=await fs.doc('tpPlans/'+id).get();if(d.exists&&addPlanDoc(d))got=true}catch(e){}}
  if(got&&curId===p.id)rerenderKeep();
}
function startCloud(){
  afterLogin();watchDevices();$('#planList').innerHTML='<div class="empty" style="padding:30px 10px">載入中…</div>';
  const onErr=e=>{console.error(e);if(e.code==='permission-denied')showGate('error','沒有權限讀取治療計劃單。請確認 Firestore 安全規則已更新，或洽診所管理者。')};
  // 只即時同步「所選狀態」和「近 N 天內有異動」的單（兩個查詢合併），減少每天的讀取次數；設定改了就重新訂閱
  let member={A:new Set(),B:new Set()},unsub=[],subKey=null;
  const subscribe=()=>{
    const key=JSON.stringify([syncSts(),syncDays()]);if(key===subKey)return;subKey=key;
    unsub.forEach(u=>u());unsub=[];member={A:new Set(),B:new Set()};
    const col=fs.collection('tpPlans'),sts=syncSts(),days=syncDays();
    if(sts.length)unsub.push(col.where('status','in',sts).onSnapshot(onSnap('A'),onErr));
    if(days>0)unsub.push(col.where('updatedAt','>=',Date.now()-days*864e5).onSnapshot(onSnap('B'),onErr));
    if(!sts.length&&!(days>0)&&firstSnap){firstSnap=false;renderList();checkLocalMigration()}
    renderList();
  };
  const onSnap=key=>snap=>{
    let curChanged=false;
    snap.docChanges().forEach(ch=>{
      const id=ch.doc.id;
      if(ch.type==='removed'){member[key].delete(id);
        // 從某個查詢移出不一定是刪除（例如結單後不再是「進行中」）；兩個查詢都沒有了，才確認雲端是否還在
        if(!member.A.has(id)&&!member.B.has(id))fs.doc('tpPlans/'+id).get().then(d=>{if(!d.exists&&plans.delete(id)){if(id===curId){curId=null;renderEditor()}renderList()}}).catch(()=>{});
        return}
      member[key].add(id);
      if(ch.doc.metadata.hasPendingWrites)return;              // 自己剛寫入、還沒送到伺服器
      let p;try{p=freezeUnits(JSON.parse(ch.doc.data().json))}catch(e){return}
      const local=plans.get(id);
      if(local&&pendingP===local)return;                        // 這張正在編輯、還沒存
      if(local&&(local.updatedAt||0)>=(p.updatedAt||0))return; // 本機已是最新
      plans.set(id,p);if(id===curId)curChanged=true;
    });
    renderList();
    if(curChanged){
      if(!plans.has(curId)){curId=null;renderEditor()}
      else if(document.activeElement&&$('#main').contains(document.activeElement)&&document.activeElement.matches('input,textarea,select'))stale=true; // 打字中先不重畫
      else rerenderKeep();
    }
    if(firstSnap){firstSnap=false;checkLocalMigration()}
  };
  // 先讀到設定（讀取天數、狀態）再開始讀計劃單
  fs.doc('tpConfig/settings').onSnapshot(s=>{
    if(s.exists){try{settings={prices:{},doctors:[],assistants:[],...JSON.parse(s.data().json)}}catch(e){}}
    migrateCatComm();rebuildCats();subscribe();
  },e=>{console.warn(e);subscribe()});
  fs.collection('staff').onSnapshot(snap=>{
    const n={doctor:[],assistant:[]};
    // 排序與排班系統人員名單相同（依代號）
    snap.docs.map(d=>d.data()).filter(v=>v.active!==false&&n[v.role]&&v.name)
      .sort((a,b)=>(a.code||a.name||'').localeCompare(b.code||b.name||'','zh-Hant',{numeric:true}))
      .forEach(v=>n[v.role].push(v.name));
    const c={};snap.docs.forEach(d=>{const v=d.data();if(v.name&&v.code)c[v.name]=String(v.code).replace(/^Dr\.?\s*/i,'')});
    staffNames=n;staffCodes=c;
    // 名單更新時，換掉畫面上的選單內容
    const sh=$('#main .sheet');if(sh){sh.querySelectorAll('datalist').forEach(x=>x.remove());sh.insertAdjacentHTML('afterbegin',datalists())}
  },e=>console.warn(e));
}
// 別人改了正在看的這張單：等目前的輸入欄離開焦點再更新畫面
$('#main').addEventListener('focusout',()=>setTimeout(()=>{if(stale&&!(document.activeElement&&$('#main').contains(document.activeElement))){stale=false;rerenderKeep()}},200));
// 舊的本機資料（雲端化以前存在這台電腦的計劃單）一鍵上傳
async function checkLocalMigration(){
  if(!canEdit())return;
  try{await LocalDB.open()}catch(e){return}
  const loc=(await LocalDB.all()).filter(p=>!plans.has(p.id));
  const ls=await LocalDB.get('settings');
  const needPrices=canPrice()&&ls&&Object.keys(ls.prices||{}).length&&!Object.keys(settings.prices||{}).length;
  if(!loc.length&&!needPrices)return;
  const b=$('#localBanner');
  b.innerHTML=`<div class="local-banner"><span>這台電腦有 ${loc.length} 張舊的本機計劃單${needPrices?'與價目表':''}還沒上傳到雲端。</span><button class="btn-sm" id="migBtn">上傳到雲端</button></div>`;
  $('#migBtn').onclick=async()=>{
    if(!confirm(`把這台電腦的 ${loc.length} 張計劃單${needPrices?'與價目表':''}上傳到雲端？上傳後會從這台電腦的本機資料移除。`))return;
    $('#migBtn').disabled=true;$('#migBtn').textContent='上傳中…';
    try{
      for(const p of loc){freezeUnits(p);await DB.put(p);plans.set(p.id,p);await LocalDB.del(p.id)}
      if(needPrices){settings={...settings,...ls};await DB.saveSettings()}
      b.innerHTML='';renderList();alert('上傳完成');
    }catch(e){console.error(e);alert('上傳失敗：'+(e.code==='permission-denied'?'沒有權限':e.message));$('#migBtn').disabled=false;$('#migBtn').textContent='上傳到雲端'}
  };
}
if(window.FIREBASE_CONFIG)bootCloud();else bootLocal();
</script>
