<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1823">
<title>新海牙科常見疾病</title>
<link rel="icon" href="icons/icon-ti.svg?v=1" type="image/svg+xml">
<link rel="icon" href="icons/icon-ti-512.png?v=1" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-ti.png?v=1">
<meta property="og:title" content="新海牙科常見疾病">
<meta property="og:description" content="新海美學牙醫診所・牙科常見疾病衛教">
<meta property="og:image" content="https://shinyhi-dental.vercel.app/icons/og-image-tp.png?v=2">
<meta property="og:type" content="website">
<style>
/* 版面、配色、字級跟 treatments.html（治療項目介紹）一致：固定深色背景，列印時改白底 */
:root{color-scheme:dark;
  --bg:#0e1823;--panel:#1a2226;--ink:#e3eaec;--muted:#93a3a9;--line:#2c383d;--card-line:#4a6572;--soft:#212b30;
  --accent:#3fb6b9;--accent-ink:#0b1416;--accent-soft:#16383a;
  --warn:#f0965a;--warn-soft:rgba(240,150,90,.12);--alert:#e5484d;--alert-soft:rgba(229,72,77,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
.btn-sm{padding:3px 10px;font-size:13px}
a.btn-sm{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:6px;color:var(--ink);text-decoration:none}
a.btn-sm:hover{border-color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 40px}
header.top{padding:22px 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top img{width:44px;height:44px;border-radius:10px}
header.top h1{margin:0;font-size:24px;line-height:1.25}
header.top .sub{font-size:13px;color:var(--muted)}
header.top .sp{flex:1}
header.top .acts{display:flex;gap:6px;flex-wrap:wrap}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:grid;gap:8px}
.tools input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tools input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{flex:0 0 auto;border-radius:999px;padding:4px 12px;font-size:14px}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
section.cat{margin-top:22px}
section.cat>h2{font-size:19px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
section.cat>h2 .no{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.85em}
section.cat>.desc{color:var(--muted);font-size:14px;margin:2px 0 10px}
details.ti{background:var(--panel);border:1.5px solid var(--card-line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin:8px 0;overflow:hidden;scroll-margin-top:calc(var(--tools-h,150px) + 12px)}
details.ti>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
details.ti>summary::-webkit-details-marker{display:none}
details.ti>summary .t{font-weight:800;font-size:18px;line-height:1.35;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
details.ti>summary .t::before{content:"";flex:0 0 auto;width:5px;height:1.1em;border-radius:3px;background:var(--accent)}
details.ti>summary .arr{grid-row:1/3;grid-column:2;color:var(--muted);transition:transform .15s;align-self:center}
details.ti[open]>summary .arr{transform:rotate(90deg)}
details.ti[open]{border-color:var(--accent)}
details.ti[open]>summary{background:var(--accent-soft);border-bottom:1.5px solid var(--accent)}
details.ti[open]>summary .t{color:var(--accent)}
details.ti>summary .lead{grid-column:1;color:var(--muted);font-size:14px;margin:3px 0 0 13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.ti[open]>summary .lead{display:none}
.ti-in{padding:2px 16px 14px}
.ti-items{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.ti-items span{font-size:12px;background:var(--soft);border-radius:999px;padding:1px 9px;color:var(--muted)}
.ti-acts{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.print-head,.print-foot{display:none}
footer.disc{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}

/* ---- 疾病介紹專用 ---- */
/* 病程與治療對照：病程由輕到重橫向一排（顏色由主色漸漸轉成紅色），每個階段的治療放在正下方同一欄；
   手機太窄放不下多欄，改成上下排（病程下面接治療，再往下一個階段）。--c 是第幾欄（箭頭也佔一欄） */
.di-st{display:grid;gap:8px 0;margin-top:6px}
.di-stage{min-width:0;border-radius:10px;padding:8px 10px;border:1.5px solid;line-height:1.45}
.di-stage b{display:block;font-size:.98em}
.di-stage span{display:block;font-size:.85em;color:var(--muted);margin-top:2px}
.di-stage .n{display:inline-block;font-size:.75em;font-weight:700;opacity:.85;margin-bottom:1px}
.di-st-tr{min-width:0;border-top:3px solid;padding-top:8px}
.di-st-tr .di-treat{gap:6px}.di-st-tr .di-treat>li{padding:7px 10px}
.di-st-tr .di-links a{white-space:normal;border-radius:8px}
.di-none{margin:0;padding:7px 2px;color:var(--muted);font-size:.92em}
.di-st-arr{display:flex;align-items:center;justify-content:center}.di-st-arr svg{width:12px;height:20px}
@media (min-width:600px){
  .di-stage{grid-row:1;grid-column:var(--c)}
  .di-st-tr{grid-row:2;grid-column:var(--c)}
  .di-st-arr{grid-row:1;grid-column:var(--c)}
}
@media (max-width:599px){
  .di-st{gap:0;grid-template-columns:1fr!important}
  .di-st-tr{border-top:0;border-left:3px solid;margin:6px 0 0 14px;padding:0 0 0 10px}
  .di-st-arr{padding:6px 0}.di-st-arr svg{transform:rotate(90deg)}
}
/* 兩欄：原因／症狀並排（寬螢幕） */
.di-two{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
@media (max-width:719px){.di-two{grid-template-columns:1fr}}
/* 緊急處理、就醫警訊：醒目框 */
.di-box{border-radius:10px;padding:8px 12px 10px;margin-top:12px}
.di-box h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:6px}
.di-box h4::before{display:none}
.di-first{background:var(--warn-soft);border:1.5px solid rgba(240,150,90,.55)}.di-first h4{color:var(--warn)}
.di-alert{background:var(--alert-soft);border:1.5px solid rgba(229,72,77,.5)}.di-alert h4{color:var(--alert)}
.di-box ul,.di-box ol{margin:0;padding-left:1.4em}.di-box li{margin:2px 0}
/* 治療方式：每一點後面列出可點的治療介紹連結 */
.di-treat{list-style:none;padding:0!important;margin:0;display:grid;gap:8px}
.di-treat>li{background:var(--soft);border-radius:10px;padding:8px 12px;margin:0!important}
.di-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.di-links a{font-size:.82em;line-height:1.5;padding:2px 10px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;white-space:nowrap}
.di-links a:hover{background:var(--accent);color:var(--accent-ink)}
.di-links a::after{content:" ›"}
.di-links a.di{border-style:dashed;border-color:var(--warn);color:var(--warn)}.di-links a.di:hover{background:var(--warn);color:var(--accent-ink)}

/* 治療介紹彈窗：點治療項目按鈕時開啟（內容跟治療介紹頁同一則）；裡面的照片再點會用 tiPop 放大，所以 z-index 要比 tiPop（100000）低 */
body.di-lock{overflow:hidden}
.di-modal{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.di-modal .box{width:100%;max-width:880px;margin:auto 0;background:var(--panel);border:1.5px solid var(--accent);border-radius:14px;box-shadow:0 12px 50px rgba(0,0,0,.5)}
.di-modal .hd{position:sticky;top:-24px;z-index:1;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--accent-soft);border-bottom:1.5px solid var(--accent);border-radius:12px 12px 0 0}
.di-modal .hd b{flex:1;font-size:1.2em;color:var(--accent);line-height:1.35}
.di-modal .hd .cat{font-size:.8em;color:var(--muted);white-space:nowrap}
.di-modal .x{flex:0 0 auto;width:36px;height:36px;border-radius:50%;padding:0;font-size:18px;line-height:1}
.di-modal .bd{padding:14px 16px 6px}
.di-modal .ft{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px}
@media (max-width:599px){.di-modal{padding:0}.di-modal .box{border-radius:0;border-width:0;min-height:100%}.di-modal .hd{top:0;border-radius:0}}
@media print{.di-modal{display:none!important}}

@media (max-width:520px){header.top h1{font-size:21px}}
/* 平板：字放大，方便拿給病人看（內文字級在 TI_CSS） */
@media screen and (min-width:600px) and (pointer:coarse),screen and (min-width:600px) and (max-width:1100px){
  body{font-size:20px}
  header.top h1{font-size:32px}header.top .sub{font-size:17px}
  .tools input{font-size:20px;padding:13px 16px}
  .chips button{font-size:18.5px;padding:7px 17px}
  .btn-sm{font-size:17px;padding:6px 14px}
  section.cat>h2{font-size:26px}section.cat>.desc{font-size:19px}
  details.ti>summary{padding:17px 20px}
  details.ti>summary .t{font-size:25px}
  details.ti>summary .lead{font-size:19px;margin-left:13px}
  .ti-in{padding:4px 20px 18px}
  .ti-items span{font-size:16px;padding:2px 12px}
  .di-box h4{font-size:21px}
  footer.disc{font-size:16px}
}
@media screen and (min-width:1101px) and (pointer:fine){
  .wrap{max-width:1100px}
  body{font-size:18px}
  header.top h1{font-size:30px}header.top .sub{font-size:16px}
  .tools input{font-size:18px;padding:11px 15px}
  .chips button{font-size:16.5px;padding:6px 15px}
  .btn-sm{font-size:15px}
  section.cat>h2{font-size:23px}section.cat>.desc{font-size:16.5px}
  details.ti>summary .t{font-size:22px}
  details.ti>summary .lead{font-size:16.5px}
  .ti-items span{font-size:14px}
  .di-box h4{font-size:19px}
  footer.disc{font-size:14.5px}
}
@media screen and (max-width:599px){
  body{font-size:16.5px}
  .tools input{font-size:16.5px}
  .chips button{font-size:15.5px}
  .btn-sm{font-size:14px}
  section.cat>h2{font-size:21px}section.cat>.desc{font-size:15.5px}
  details.ti>summary .t{font-size:20px}
  details.ti>summary .lead{font-size:15.5px}
  .ti-items span{font-size:13.5px}
  .di-box h4{font-size:17px}
  footer.disc{font-size:13.5px}
}
/* ---- 列印：A4 白底，只印標記 .pr 的項目，每項從新的一頁開始 ---- */
@page{size:A4;margin:14mm}
@media print{
  :root{color-scheme:light;--card-line:#cfd8dc;--accent-ink:#fff;--bg:#fff;--panel:#fff;--ink:#111;--muted:#555;--line:#cfd8dc;--soft:#f1f4f5;--accent:#0f7c80;--accent-soft:#e8f4f4;--warn:#b85a1c;--alert:#c62828}
  body{background:#fff;font-size:13px}
  .wrap{max-width:none;padding:0}
  header.top,.tools,.ti-acts,.ti-items,footer.disc,.arr,.lead,section.cat>h2,section.cat>.desc{display:none!important}
  section.cat:not(:has(details.pr)),details.ti:not(.pr){display:none!important}
  section.cat{margin-top:0}
  details.ti{border:0!important;border-radius:0;margin:0;box-shadow:none}
  details.ti.pr~details.ti.pr,section.cat~section.cat details.ti.pr{break-before:page}
  details.ti>summary{padding:0 0 4px;display:block;background:none!important;border-bottom:1.5px solid var(--accent)!important;margin-bottom:8px}
  details.ti>summary .t{font-size:20px;color:var(--accent)!important}
  .ti-in{padding:0}
  .ti-body{font-size:13px;line-height:1.55}
  .ti-sec:not(:has(.di-st)),.di-box,.di-stage,.di-treat>li{break-inside:avoid}
  .di-stage,.di-box,.di-treat>li{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .di-links a{border:0;padding:0 6px 0 0;font-size:.85em}.di-links a::after{content:""}
  .di-links::before{content:"相關治療：";font-size:.85em;color:var(--muted)}
  .print-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:6mm}
  .print-head img{width:30px;height:30px}
  .print-head b{font-size:16px}.print-head span{color:var(--muted);font-size:12px;margin-left:auto}
  .print-foot{display:block;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;margin-top:6mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="print-head"><img src="icons/icon-ti.svg?v=1" alt=""><b>新海美學牙醫診所・牙科常見疾病衛教</b><span id="printDate"></span></div>
  <header class="top">
    <img src="icons/icon-ti.svg?v=1" alt="">
    <div><h1>牙科常見疾病</h1><div class="sub">新海美學牙醫診所</div></div>
    <span class="sp"></span>
    <div class="acts">
      <a class="btn-sm" href="treatments.html">🦷 治療項目介紹</a>
      <button id="printAll" class="btn-sm" title="列印目前顯示的所有疾病">🖨 列印</button>
    </div>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="搜尋疾病或症狀，例如：蛀牙、刷牙流血、牙齒搖、喀喀聲" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <main id="list"></main>
  <div class="print-foot" id="printFoot"></div>
  <footer class="disc" id="disc"></footer>
</div>
<script src="js/treatment-info.js?v=154"></script>
<script src="js/treatment-figs.js?v=14"></script>
<script src="js/disease-info.js?v=52"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
document.head.insertAdjacentHTML('beforeend',`<style>${TI_CSS}</style>`);
$('#disc').textContent=$('#printFoot').textContent=DI_DISCLAIMER;
$('#printDate').textContent=new Date().toLocaleDateString('zh-TW');

const list=a=>`<ul>${a.map(x=>`<li>${tiEsc(x)}</li>`).join('')}</ul>`;
const sec=(h,a)=>a?.length?`<div class="ti-sec"><h4>${h}</h4>${list(a)}</div>`:'';
const box=(cls,h,a)=>a?.length?`<div class="di-box ${cls}"><h4>${h}</h4>${list(a)}</div>`:'';
// 病程顏色：第一段主色，最後一段紅色，中間依比例混色
const stageColor=(i,n)=>{const k=n>1?i/(n-1):0,c=[[63,182,185],[240,150,90],[229,72,77]],
  s=k<.5?[c[0],c[1],k*2]:[c[1],c[2],(k-.5)*2],m=s[0].map((v,j)=>Math.round(v+(s[1][j]-v)*s[2]));return m.join(',')};
const dArr='<svg viewBox="0 0 12 20" aria-hidden="true"><path d="M3,2L9,10L3,18" fill="none" stroke="#f0965a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// 一項治療：連到治療項目介紹（treatments.html#id 會自動展開並捲到該項目）；di 連到本頁另一種疾病
function treatLi(x){
  const ls=(x.ids||[]).map(id=>TI_BY_ID[id]).filter(Boolean),dl=x.di&&DI_BY_ID[x.di];
  return `<li>${tiEsc(x.t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}${ls.length||dl?`<div class="di-links">${dl?`<a class="di" href="#${dl.id}">詳見：${tiEsc(dl.title)}</a>`:''}${ls.map(e=>`<a href="treatments.html#${e.id}">${tiEsc(e.title)}</a>`).join('')}</div>`:''}</li>`}
const treatHtml=(a,h='治療方式')=>a.length?`<div class="ti-sec"><h4>${h}</h4><ul class="di-treat">${a.map(treatLi).join('')}</ul></div>`:'';
// 病程與治療對照：每個階段一列，右邊是 s 指到這個階段的治療
// flow2：同一種疾病的第二張流程圖（例如蛀牙的乳牙）
const stageTreatHtml=e=>stageFlowHtml(e.stLabel||'病程變化與治療方式',e.stages,e.treat||[],e.otherLabel)+(e.flow2?stageFlowHtml(e.flow2.label,e.flow2.stages,e.flow2.treat||[]):'');
function stageFlowHtml(label,stages,tr,otherLabel){
  const e={stages},at=i=>tr.filter(x=>x.s!=null&&[].concat(x.s).includes(i));
  const n=e.stages.length,cols=Array.from({length:n},()=>'minmax(0,1fr)').join(' 22px '); // 階段欄之間夾一欄放箭頭
  return `<div class="ti-sec"><h4>${tiEsc(label)}</h4><div class="di-st" style="grid-template-columns:${cols}">${
    e.stages.map((s,i)=>{const c=stageColor(i,n),xs=at(i),col=`--c:${i*2+1}`;
      return (i?`<div class="di-st-arr" style="--c:${i*2}">${dArr}</div>`:'')+
        `<div class="di-stage" style="${col};border-color:rgba(${c},.6);background:rgba(${c},.1)"><span class="n" style="color:rgb(${c})">${i+1}</span><b style="color:rgb(${c})">${tiEsc(s.t)}</b><span>${tiEsc(s.d).replace(/\n/g,'<br>')}</span></div>`+
        `<div class="di-st-tr" style="${col};border-color:rgba(${c},.6)">${xs.length?`<ul class="di-treat">${xs.map(treatLi).join('')}</ul>`:`<p class="di-none">${tiEsc(s.none||'—')}</p>`}</div>`}).join('')}</div></div>`+
    treatHtml(tr.filter(x=>x.s==null),tiEsc(otherLabel||'其他治療方式'))}
function bodyHtml(e){
  return `<div class="ti-body">
    <p class="ti-what">${tiEsc(e.what)}</p>
    ${box('di-first','🚑 緊急處理',e.first)}
    <div class="di-two">${sec('常見原因',e.cause)}${sec('常見症狀',e.symptom)}</div>
    ${e.table?`<div class="ti-cmps">${tiTableHtml(e.table)}</div>`:''}
    ${e.stages?stageTreatHtml(e):treatHtml(e.treat||[])}
    ${sec('不處理可能的後果',e.risk)}
    ${sec('預防與保養',e.prevent)}
    ${box('di-alert','⚠️ 出現這些情況請盡快就醫',e.alert)}
    ${e.note?`<div class="ti-sec ti-note"><h4>補充說明</h4>${Array.isArray(e.note)?list(e.note):`<p>${tiEsc(e.note).replace(/\n/g,'<br>')}</p>`}</div>`:''}
  </div>`}

$('#list').innerHTML=DI_CATS.map((c,ci)=>{const es=DISEASE_INFO.filter(e=>e.cat===c);
  return `<section class="cat" data-cat="${tiEsc(c)}"><h2><span class="no">${ci+1}</span>${tiEsc(c)}</h2>
    <div class="desc">${tiEsc(DI_CAT_DESC[c]||'')}</div>
    ${es.map(e=>`<details class="ti" id="${e.id}" data-id="${e.id}">
      <summary><span class="t">${tiEsc(e.title)}</span><span class="arr">›</span><span class="lead">${tiEsc(e.what)}</span></summary>
      <div class="ti-in">
        ${e.alias?.length?`<div class="ti-items">${e.alias.slice(0,6).map(n=>`<span>${tiEsc(n)}</span>`).join('')}</div>`:''}
        ${bodyHtml(e)}
        <div class="ti-acts"><button class="btn-sm" data-print="${e.id}">🖨 列印這一項</button></div>
      </div></details>`).join('')}
  </section>`}).join('')+'<div class="empty" id="empty" hidden>找不到符合的疾病，可以換個說法試試，例如「牙痛」「流血」</div>';

$('#chips').innerHTML=['全部',...DI_CATS].map(c=>`<button data-cat="${tiEsc(c)}">${tiEsc(c)}</button>`).join('');
const toolsH=()=>document.documentElement.style.setProperty('--tools-h',$('.tools').offsetHeight+'px');toolsH();if(window.ResizeObserver)new ResizeObserver(toolsH).observe($('.tools'));

let cat='全部';
const norm=s=>String(s).toLowerCase().replace(/[\s\-－_（）()／/]/g,'');
// 搜尋範圍：名稱、俗稱、說明、原因、症狀（讓病人用症狀也找得到）
const hay=e=>norm([e.title,e.cat,e.what,...(e.alias||[]),...(e.cause||[]),...(e.symptom||[])].join(' '));
function filter(){
  const q=norm($('#q').value);let n=0;
  document.querySelectorAll('details.ti').forEach(d=>{const e=DI_BY_ID[d.dataset.id];
    const ok=(cat==='全部'||e.cat===cat)&&(!q||hay(e).includes(q));d.hidden=!ok;if(ok)n++});
  document.querySelectorAll('section.cat').forEach(s=>s.hidden=!s.querySelector('details.ti:not([hidden])'));
  $('#empty').hidden=n>0;
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));
}
// 一次只展開一則：打開一則時，其他已展開的自動收起；上方的卡片收起後內容會往上跳，捲動補回讓剛點的那則停在原位。列印時要同時展開多則，暫停這個動作
let printing=false;
document.querySelectorAll('details.ti').forEach(d=>d.addEventListener('toggle',()=>{
  if(!d.open||printing)return;
  const top=d.getBoundingClientRect().top;
  document.querySelectorAll('details.ti[open]').forEach(o=>{if(o!==d)o.open=false});
  const dy=d.getBoundingClientRect().top-top;if(dy)scrollBy(0,dy);
}));
// 列印指定的疾病：暫時展開（含比較表）並標記 .pr，印完恢復
function printIds(ids){
  const ds=ids.map(id=>document.getElementById(id)).filter(Boolean);if(!ds.length)return;
  printing=true;
  const was=ds.map(d=>d.open),tbls=ds.flatMap(d=>[...d.querySelectorAll('.ti-tbl-wrap[hidden]')]);
  ds.forEach(d=>{d.open=true;d.classList.add('pr')});tbls.forEach(t=>t.hidden=false);
  const done=()=>{ds.forEach((d,i)=>{d.open=was[i];d.classList.remove('pr')});tbls.forEach(t=>t.hidden=true);removeEventListener('afterprint',done);setTimeout(()=>printing=false,0)};
  addEventListener('afterprint',done);window.print();
}
$('#q').addEventListener('input',filter);
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.cat;filter();scrollTo({top:0})});
$('#list').addEventListener('click',e=>{const p=e.target.closest('[data-print]');if(p)printIds([p.dataset.print])});
// 點治療項目：用彈窗顯示該則治療介紹（按 Ctrl／⌘ 或中鍵仍照連結開新分頁）；點背景、✕ 或按 Esc 關閉
function openTreat(id){
  const e=TI_BY_ID[id];if(!e)return;
  const o=document.createElement('div');o.className='di-modal';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label',e.title);
  o.innerHTML=`<div class="box"><div class="hd"><b>${tiEsc(e.title)}</b><span class="cat">${tiEsc(e.cat)}</span><button type="button" class="x" aria-label="關閉">✕</button></div>
    <div class="bd">${tiBodyHtml(e)}<p class="ti-disclaimer">${tiEsc(TI_DISCLAIMER)}</p></div>
    <div class="ft"><a class="btn-sm" href="treatments.html#${e.id}">在治療項目介紹頁開啟 ›</a><button type="button" class="btn-sm cl">關閉</button></div></div>`;
  const close=()=>{o.remove();document.body.classList.remove('di-lock');removeEventListener('keydown',key)},
    key=ev=>{if(ev.key==='Escape'&&!document.getElementById('tiPop'))close()}; // 照片放大中按 Esc 先關照片
  o.addEventListener('click',ev=>{if(ev.target===o||ev.target.closest('.x,.cl'))close()});
  addEventListener('keydown',key);document.body.classList.add('di-lock');document.body.appendChild(o);o.querySelector('.x').focus();
}
document.addEventListener('click',ev=>{
  const a=ev.target.closest('.di-links a[href^="treatments.html#"]');
  if(!a||ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.button)return;
  ev.preventDefault();openTreat(a.getAttribute('href').split('#')[1]);
});
$('#printAll').onclick=()=>printIds([...document.querySelectorAll('details.ti:not([hidden])')].map(d=>d.dataset.id));

filter();
// #id：打開並捲到該疾病（例如 diseases.html#periodontitis）
function openHash(){const h=decodeURIComponent(location.hash.slice(1));
  if(h&&DI_BY_ID[h]){const d=document.getElementById(h);if(d.hidden){cat='全部';$('#q').value='';filter()}d.open=true;setTimeout(()=>d.scrollIntoView({block:'start'}),50)}}
openHash();addEventListener('hashchange',openHash);
</script>
</body>
</html>
