<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1823">
<title>新海治療項目介紹</title>
<link rel="icon" href="icon-tp.svg?v=2" type="image/svg+xml">
<link rel="icon" href="icon-tp-512.png?v=2" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon-tp.png?v=2">
<meta property="og:title" content="新海治療項目介紹">
<meta property="og:description" content="新海美學牙醫診所・治療項目說明">
<meta property="og:image" content="https://shinyhi-dental.vercel.app/og-image-tp.png?v=2">
<meta property="og:type" content="website">
<style>
/* 固定使用深色背景（不跟手機、電腦的淺色／深色設定走；色彩同治療計劃單的深色模式）。列印時改回白底，見下方 @media print */
:root{color-scheme:dark;
  --bg:#0e1823;--panel:#1a2226;--ink:#e3eaec;--muted:#93a3a9;--line:#2c383d;--card-line:#4a6572;--soft:#212b30;
  --accent:#3fb6b9;--accent-ink:#0b1416;--accent-soft:#16383a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
.btn-sm{padding:3px 10px;font-size:13px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 40px}
header.top{padding:22px 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top img{width:44px;height:44px;border-radius:10px}
header.top h1{margin:0;font-size:24px;line-height:1.25}
header.top .sub{font-size:13px;color:var(--muted)}
header.top .sp{flex:1}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:grid;gap:8px}
.tools input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tools input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips button{flex:0 0 auto;border-radius:999px;padding:4px 12px;font-size:14px}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sel-bar{background:var(--accent-soft);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.sel-bar .sp{flex:1}
section.cat{margin-top:22px}
section.cat>h2{font-size:19px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
section.cat>h2 .sp{flex:1}
section.cat>.desc{color:var(--muted);font-size:14px;margin:2px 0 10px}
details.ti{background:var(--panel);border:1.5px solid var(--card-line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin:8px 0;overflow:hidden;scroll-margin-top:150px} /* 捲到項目時不被上方搜尋列蓋住 */
details.ti>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
details.ti>summary::-webkit-details-marker{display:none}
details.ti>summary .t{font-weight:800;font-size:18px;line-height:1.35;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
details.ti>summary .t::before{content:"";flex:0 0 auto;width:5px;height:1.1em;border-radius:3px;background:var(--accent)} /* 標題前的主色短條，和內文明顯區隔 */
details.ti>summary .arr{grid-row:1/3;grid-column:2;color:var(--muted);transition:transform .15s;align-self:center}
details.ti[open]>summary .arr{transform:rotate(90deg)}
details.ti[open]{border-color:var(--accent)} /* 展開中的卡片用主色邊框 */
details.ti[open]>summary{background:var(--accent-soft);border-bottom:1.5px solid var(--accent)}
details.ti[open]>summary .t{color:var(--accent)}
details.ti>summary .lead{grid-column:1;color:var(--muted);font-size:14px;margin:3px 0 0 13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.ti[open]>summary .lead{display:none}
.ti-in{padding:2px 16px 14px}
.ti-items{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.ti-items span{font-size:12px;background:var(--soft);border-radius:999px;padding:1px 9px;color:var(--muted)}
.ti-acts{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.print-head,.print-foot{display:none}
footer.disc{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}
@media (max-width:520px){header.top h1{font-size:21px}}
/* 平板：標題、搜尋、分類、卡片摘要的字放大（內文放大在 treatment-info.js 的 TI_CSS） */
@media screen and (min-width:600px) and (pointer:coarse),screen and (min-width:600px) and (max-width:1100px){
  body{font-size:20px}
  header.top h1{font-size:32px}header.top .sub{font-size:17px}
  .tools input{font-size:20px;padding:13px 16px}
  .chips button{font-size:18.5px;padding:7px 17px}
  .btn-sm{font-size:17px;padding:6px 14px}
  section.cat>h2{font-size:26px}section.cat>.desc{font-size:19px}
  details.ti>summary{padding:17px 20px}
  details.ti>summary .t{font-size:25px}
  details.ti>summary .lead{font-size:19px;margin-left:13px}
  .ti-in{padding:4px 20px 18px}
  .ti-items span{font-size:16px;padding:2px 12px}
  .sel-bar{font-size:19px}
  footer.disc{font-size:16px}
}
/* 電腦（滑鼠、寬 1101px 以上）：字比預設大一點 */
@media screen and (min-width:1101px) and (pointer:fine){
  .wrap{max-width:1100px}
  body{font-size:18px}
  header.top h1{font-size:30px}header.top .sub{font-size:16px}
  .tools input{font-size:18px;padding:11px 15px}
  .chips button{font-size:16.5px;padding:6px 15px}
  .btn-sm{font-size:15px}
  section.cat>h2{font-size:23px}section.cat>.desc{font-size:16.5px}
  details.ti>summary .t{font-size:22px}
  details.ti>summary .lead{font-size:16.5px}
  .ti-items span{font-size:14px}
  .sel-bar{font-size:16.5px}
  footer.disc{font-size:14.5px}
}
/* 手機（寬 599px 以下）：字比預設大一點 */
@media screen and (max-width:599px){
  body{font-size:16.5px}
  .tools input{font-size:16.5px}
  .chips button{font-size:15.5px}
  .btn-sm{font-size:14px}
  section.cat>h2{font-size:21px}section.cat>.desc{font-size:15.5px}
  details.ti>summary .t{font-size:20px}
  details.ti>summary .lead{font-size:15.5px}
  .ti-items span{font-size:13.5px}
  footer.disc{font-size:13.5px}
}
/* ---- 列印：A4，只印標記 .pr 的項目 ---- */
@page{size:A4;margin:0} /* 邊界設 0：瀏覽器就不會印日期、網址、頁碼等頁首頁尾；頁面留白改由 printIds 加在每個項目上 */
/* 列印模式：列印前在 body 加上 .pm（列印完移除），每個項目一張 A4；printIds 會自動放大或縮小（zoom）讓內容剛好填滿一頁。
   寫成 body.pm 而不是 @media print，列印前才量得到排版後的高度 */
body.pm details.ti.pr{width:182mm;margin:0;padding:0;border:0!important;border-radius:0;box-shadow:none;background:transparent;color:#111}
/* 列印浮水印：診所 Logo（淺藍色）固定在頁面中央，列印時每一頁都會出現（用 <img> 而不是背景圖，不用勾「背景圖形」也印得出來） */
.pm-wm{display:none}
body.pm .pm-wm{display:flex;flex-direction:column;align-items:center;gap:6mm;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.22;filter:url(#wm-blue);z-index:0;pointer-events:none}
/* 浮水印由同一張 Logo 圖切成兩塊：上方牙齒圖案放大一倍、下方診所名稱維持原大小（原圖 324×184px：圖案 x89～232／y9～127，文字 x10～309／y144～177） */
.pm-wm>div{overflow:hidden}.pm-wm img{display:block;max-width:none}
.wm-icon{width:115.6mm;height:95.6mm}.wm-icon img{width:260.2mm;margin:-7.2mm 0 0 -71.5mm}
.wm-text{width:120.3mm;height:13.7mm}.wm-text img{width:130mm;margin:-57.8mm 0 0 -4mm}
body.pm .wrap{position:relative;z-index:1}
body.pm section.cat>h2,body.pm section.cat>.desc,body.pm .ti-items,body.pm .ti-acts{display:none!important}
body.pm details.ti.pr>summary{display:block;padding:0 0 4px;margin-bottom:6px;background:none;border-bottom:1.5px solid #0f7c80}
body.pm details.ti.pr>summary::before{content:"新海美學牙醫診所・治療說明";display:block;font-size:11px;color:#555;margin-bottom:2px}
body.pm details.ti.pr>summary .t{font-size:19px;color:#0f7c80}
body.pm .ti-in{padding:0}
body.pm .ti-in::after{content:attr(data-disc);display:block;margin-top:6px;padding-top:4px;border-top:1px solid #cfd8dc;font-size:10px;color:#555}
body.pm .ti-body{font-size:12.5px;line-height:1.5;display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
body.pm .ti-body>.ti-what,body.pm .ti-body>.ti-tbl,body.pm .ti-body>.ti-str,body.pm .ti-body>.ti-steps,body.pm .ti-body>.ti-fig,body.pm .ti-body>.ti-photo,body.pm .ti-body>.ti-photos,body.pm .ti-body>.ti-note{grid-column:1/-1}
body.pm .ti-what{margin-bottom:6px!important}
body.pm .ti-sec{margin-top:5px}body.pm .ti-sec h4{font-size:13px}
body.pm .ti-steps{max-width:none;gap:6px;margin-bottom:4px}
body.pm .ti-fig{max-width:150mm!important;margin-bottom:4px}
body.pm .ti-row figcaption,body.pm .ti-fig figcaption{font-size:10.5px;line-height:1.35}
body.pm .ti-photo img{max-height:70mm}
body.pm .ti-str table{font-size:11px}
@media print{
  :root{color-scheme:light;--card-line:#cfd8dc;--accent-ink:#fff;--bg:#fff;--panel:#fff;--ink:#111;--muted:#555;--line:#cfd8dc;--soft:#f1f4f5;--accent:#0f7c80;--accent-soft:#e8f4f4}
  body{background:#fff;font-size:13.5px}
  .wrap{max-width:none;padding:0}
  header.top,.tools,.sel-bar,.ti-acts,section.cat>h2 button,footer.disc,.arr,.lead{display:none!important}
  section.cat:not(:has(details.pr)),details.ti:not(.pr){display:none!important}
  section.cat{margin-top:0}
  section.cat>h2{font-size:13px;color:var(--muted);font-weight:400}
  section.cat>.desc{display:none}
  details.ti{border:0;border-radius:0;margin:0 0 6mm;break-inside:avoid;page-break-inside:avoid}
  details.ti+details.ti.pr,section.cat~section.cat details.ti.pr{border-top:1px dashed var(--line);padding-top:5mm}
  details.ti>summary{padding:0 0 4px;display:block}
  details.ti>summary .t{font-size:20px;color:var(--accent)}
  details.ti[open]>summary{background:none;border-bottom:1.5px solid var(--accent);margin-bottom:6px}
  .ti-in{padding:0;border:0}
  .ti-body{font-size:13.5px;line-height:1.6}
  .print-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:8mm}
  .print-head img{width:34px;height:34px}
  .print-head b{font-size:17px}.print-head span{color:var(--muted);font-size:12px;margin-left:auto}
  body.pm .print-head,body.pm .print-foot{display:none!important}
  .print-foot{display:block;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;margin-top:6mm}
  .ti-items span{border:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="pm-wm" aria-hidden="true"><div class="wm-icon"><img src="tp-watermark.png?v=3" alt=""></div><div class="wm-text"><img src="tp-watermark.png?v=3" alt=""></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wm-blue"><feFlood flood-color="#6fb3e8"/><feComposite in2="SourceAlpha" operator="in"/></filter></svg>
<div class="wrap">
  <div class="print-head"><img src="icon-tp.svg?v=2" alt=""><b>新海美學牙醫診所・治療說明</b><span id="printDate"></span></div>
  <header class="top">
    <img src="icon-tp.svg?v=2" alt="">
    <div><h1>治療項目介紹</h1><div class="sub">新海美學牙醫診所</div></div>
    <span class="sp"></span>
    <button id="printAll" class="btn-sm" title="列印目前顯示的所有項目">🖨 列印</button>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="搜尋治療項目，例如：植牙、美白、根管" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="sel-bar" id="selBar" hidden><span id="selTxt"></span><span class="sp"></span><button class="btn-sm" id="selPrint">🖨 列印這些項目</button><button class="btn-sm" id="selClear">顯示全部項目</button></div>
  </div>
  <main id="list"></main>
  <div class="print-foot" id="printFoot"></div>
  <footer class="disc" id="disc"></footer>
</div>
<script src="treatment-info.js?v=50"></script>
<script src="treatment-figs.js?v=13"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
document.head.insertAdjacentHTML('beforeend',`<style>${TI_CSS}</style>`);
$('#disc').textContent=$('#printFoot').textContent=TI_DISCLAIMER;
$('#printDate').textContent=new Date().toLocaleDateString('zh-TW');

// 網址參數：?ids=a,b 只顯示指定的項目（治療計劃單帶過來）；&print=1 開啟後直接列印；#id 打開並捲到該項目
const qs=new URLSearchParams(location.search);
let sel=(qs.get('ids')||'').split(',').filter(id=>TI_BY_ID[id]);
let cat='全部';

$('#list').innerHTML=TI_CATS.map(c=>{const es=TREATMENT_INFO.filter(e=>e.cat===c);
  return `<section class="cat" data-cat="${tiEsc(c)}"><h2>${tiEsc(c)}<span class="sp"></span><button class="btn-sm" data-print-cat="${tiEsc(c)}">🖨 列印此類</button></h2>
    <div class="desc">${tiEsc(TI_CAT_DESC[c]||'')}</div>
    ${es.map(e=>`<details class="ti" id="${e.id}" data-id="${e.id}">
      <summary><span class="t">${tiEsc(e.title)}</span><span class="arr">›</span><span class="lead">${tiEsc(e.what)}</span></summary>
      <div class="ti-in" data-disc="${tiEsc(TI_DISCLAIMER)}">
        <div class="ti-items">${e.items.map(n=>`<span>${tiEsc(n)}</span>`).join('')}</div>
        ${tiBodyHtml(e)}
        <div class="ti-acts"><button class="btn-sm" data-print="${e.id}">🖨 列印這一項</button></div>
      </div></details>`).join('')}
  </section>`}).join('')+'<div class="empty" id="empty" hidden>找不到符合的治療項目</div>';

$('#chips').innerHTML=['全部',...TI_CATS].map(c=>`<button data-cat="${tiEsc(c)}">${tiEsc(c)}</button>`).join('');

const norm=s=>String(s).toLowerCase().replace(/[\s\-－_]/g,'');
function hay(e){return norm([e.title,e.cat,e.what,...e.items,e.note||''].join(' '))}
function filter(){
  const q=norm($('#q').value);let n=0;
  document.querySelectorAll('details.ti').forEach(d=>{const e=TI_BY_ID[d.dataset.id];
    const ok=(sel.length?sel.includes(e.id):(cat==='全部'||e.cat===cat))&&(!q||hay(e).includes(q));
    d.hidden=!ok;if(ok)n++});
  document.querySelectorAll('section.cat').forEach(s=>s.hidden=!s.querySelector('details.ti:not([hidden])'));
  $('#empty').hidden=n>0;
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',!sel.length&&b.dataset.cat===cat));
  $('#selBar').hidden=!sel.length;$('#selTxt').textContent=`治療計劃單的 ${sel.length} 個項目說明`;
}
// 列印指定的項目：暫時展開並標記 .pr，印完恢復
// 列印指定的項目：每項一張 A4（暫時展開、標記 .pr、body 加 .pm），自動放大或縮小到剛好填滿一頁，印完恢復
async function printIds(ids){
  const ds=ids.map(id=>document.getElementById(id)).filter(Boolean);if(!ds.length)return;
  const was=ds.map(d=>d.open);ds.forEach(d=>{d.open=true;d.classList.add('pr')});
  document.body.classList.add('pm');
  await Promise.all(ds.flatMap(d=>[...d.querySelectorAll('img')].map(i=>(i.loading='eager',i.decode().catch(()=>{})))));
  // 有比較表的項目（例如隱適美各方案比較）：比較表拆到第二頁，兩頁各自縮放填滿一頁；印完放回原位
  const pages=[],moved=[];
  ds.forEach(d=>{pages.push(d);const t=d.querySelector('.ti-body>.ti-tbl');if(!t)return;
    const ph=document.createComment('ti-tbl'),p2=document.createElement('details');t.before(ph);
    p2.className='ti pr pm-p2';p2.open=true;
    p2.innerHTML='<summary><span class="t"></span></summary><div class="ti-in"><div class="ti-body"></div></div>';
    p2.querySelector('.t').textContent=(d.querySelector('summary .t')?.textContent||'').trim()+'（'+(t.querySelector('h4')?.textContent||'續')+'）';
    p2.querySelector('.ti-in').dataset.disc=d.querySelector('.ti-in')?.dataset.disc||'';
    p2.querySelector('.ti-body').appendChild(t);d.after(p2);pages.push(p2);moved.push([ph,t,p2])});
  const PAGE=1050; // A4 高 297mm，扣掉上 14mm、下 16mm 留白 = 267mm ≈ 1009px；加上上方留白 14mm 後上限約 281mm ≈ 1062px，留一點空間
  // 每項找出最大的縮放比例 z，讓高度剛好填滿一頁：版面寬度設為 210mm÷z 再放大 z 倍，印出來剛好 A4 寬（字和圖跟著變大）；超過一頁時 z<1 會縮小
  // 頁面四周留白（上 14mm、左右 14mm）放在項目自己的 padding，跟著縮放比例換算，印出來剛好 14mm
  const fit=(d,z)=>{const m=(14/z).toFixed(2)+'mm';d.style.width=(210/z).toFixed(2)+'mm';d.style.padding=m+' '+m+' 0';d.style.zoom=z;return d.getBoundingClientRect().height<=PAGE};
  pages.forEach((d,i)=>{d.style.breakBefore=i?'page':'';let lo=.5,hi=1.5; // 最多放大 1.5 倍，避免字太大
    if(fit(d,hi))lo=hi;else for(let k=0;k<9;k++){const m=(lo+hi)/2;if(fit(d,m))lo=m;else hi=m}
    fit(d,lo)});
  const done=()=>{ds.forEach((d,i)=>{d.open=was[i];d.classList.remove('pr');d.style.zoom='';d.style.width='';d.style.padding='';d.style.breakBefore=''});
    moved.forEach(([ph,t,p2])=>{ph.replaceWith(t);p2.remove()});document.body.classList.remove('pm');removeEventListener('afterprint',done)};
  addEventListener('afterprint',done);window.print();
}
const shown=()=>[...document.querySelectorAll('details.ti:not([hidden])')].map(d=>d.dataset.id);

$('#q').addEventListener('input',filter);
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.cat;sel=[];filter();scrollTo({top:0})});
$('#list').addEventListener('click',e=>{
  const p=e.target.closest('[data-print]');if(p){printIds([p.dataset.print]);return}
  const c=e.target.closest('[data-print-cat]');if(c){printIds(TREATMENT_INFO.filter(x=>x.cat===c.dataset.printCat&&!document.getElementById(x.id).hidden).map(x=>x.id))}
});
$('#printAll').onclick=()=>printIds(shown());
$('#selPrint').onclick=()=>printIds(sel);
$('#selClear').onclick=()=>{sel=[];history.replaceState(null,'',location.pathname);filter()};

filter();
if(sel.length)document.querySelectorAll('details.ti:not([hidden])').forEach(d=>d.open=true);
const h=decodeURIComponent(location.hash.slice(1));
if(h&&TI_BY_ID[h]){const d=document.getElementById(h);d.open=true;setTimeout(()=>d.scrollIntoView({block:'start'}),50)}
if(qs.get('print')==='1'&&sel.length)setTimeout(()=>printIds(sel),300);
</script>
</body>
</html>
